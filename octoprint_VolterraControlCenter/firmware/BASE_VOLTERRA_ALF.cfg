#             RESPOND TYPE=echo MSG="Fan P{params.P} not available on single nozzle printer"
#         {% endif %}
#     {% else %}
#         M106.1 S{(raw_speed)|int}
#     {% endif %}


# [gcode_macro M107]
# description: Turn off print cooling fan
# gcode:
#     M106 S0

# Override M104 to handle T1 commands gracefully on single nozzle
[gcode_macro M104]
rename_existing: M104.1
description: Set extruder temperature (single nozzle)
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(0)|int %}
    {% if tool == 0 or tool == -1 %}
        M104.1 S{temp}
    {% elif tool == 1 %}
        RESPOND TYPE=echo MSG="T1 not available on single nozzle printer, ignoring M104 T1"
    {% else %}
        RESPOND TYPE=error MSG="Invalid tool T{tool}"
    {% endif %}

#Override M109 to handle T1 commands gracefully on single nozzle
[gcode_macro M109]
rename_existing: M109.1
description: Set extruder temperature and wait (single nozzle)
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(0)|int %}
    {% if tool == 0 or tool == -1 %}
        M109.1 S{temp}
    {% elif tool == 1 %}
        RESPOND TYPE=echo MSG="T1 not available on single nozzle printer, ignoring M109 T1"
    {% else %}
        RESPOND TYPE=error MSG="Invalid tool T{tool}"
    {% endif %}

########################################
# PAUSE & Resume Functionality for Single Nozzle
########################################

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set z = params.Z|default(printer_var.z_hop)|float %}
    {% set r = params.R|default(2.0)|float %}
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target|default(0)|int}

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE

        {% if printer.gcode_move.gcode_position.z < (printer.toolhead.axis_maximum.z - z) %}
            G91
            G1 Z{z} F900
        {% else %}
            RESPOND TYPE=echo MSG="Pause zhop exceeds maximum Z height."
        {% endif %}
        G90
        G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F{printer_var.feedrate}
        #M106 S0
        {% if printer.extruder.temperature >= 150 %}
            M83
            G1 E-{r} F2100
        {% endif %}
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    G90
    G1 X{printer_var.tool0_pause_position_x + 10} Y{printer_var.tool0_pause_position_y + 10} F{printer_var.feedrate}
    G1 X{printer_var.tool0_pause_position_x + 50} F{printer_var.feedrate}
    G1 X{printer_var.tool0_pause_position_x + 10}
    G1 X{printer_var.tool0_pause_position_x + 50}
    G1 X{printer_var.tool0_pause_position_x + 10}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(20)|float %}
    {% set r = params.R|default(1)|float %}
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        # Restore temps
        {% if etemp > 0 %}
            M104 S{etemp|int}
            M109 S{etemp|int}
        {% endif %}

        # Determine if we can safely prime
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% set can_prime = (printer.extruder.temperature|float >= min_temp) %}

        {% if can_prime %}
            M83
            G1 E{r} F2100
        {% endif %}

        CLEAN_NOZZLE
        M420 S1
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150

        {% if can_prime %}
            M83
            G1 E{e} F900
        {% endif %}

        BASE_RESUME VELOCITY=150
    {% endif %}
