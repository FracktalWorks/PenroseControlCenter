########################################
# FILAMENT_HEATER.cfg
# Spool/Filament Dryer Heater Control
# Closed-loop PID controlled heater
########################################

[heater_generic Filament]
gcode_id: Filament
heater_pin: PA8  # Change to your filament heater pin
max_power: 1.0
sensor_type: ATC Semitec 104GT-2  # Change to your thermistor type
sensor_pin: PA7  # Change to your filament thermistor pin
pwm_cycle_time: 0.005
smooth_time: 2
control: pid #pid_v
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -199
max_temp: 100  # Keep low for filament safety (PLA ~45, ABS ~65)

[verify_heater Filament]
max_error: 120
check_gain_time: 600  # Long time for slow-heating enclosure
hysteresis: 50
heating_gain: 1

########################################
# Filament/Spool Heater Control Macros
########################################

# Set Filament/Spool Heater Temperature (no wait)
[gcode_macro SET_SPOOL_TEMP]
gcode:
    {% set S = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER=Filament TARGET={S}

# Wait for Filament/Spool Heater Temperature
[gcode_macro WAIT_SPOOL_TEMP]
gcode:
    {% set S = params.S|default(0)|float %}
    {% set TOLERANCE = params.TOLERANCE|default(3)|float %}
    SET_HEATER_TEMPERATURE HEATER=Filament TARGET={S}
    {% if S > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic Filament" MINIMUM={S - TOLERANCE}
    {% endif %}

# Turn off spool heater
[gcode_macro SPOOL_OFF]
gcode:
    SET_HEATER_TEMPERATURE HEATER=Filament TARGET=0

# Preset temperatures for common filaments
[gcode_macro SPOOL_PLA]
gcode:
    SET_HEATER_TEMPERATURE HEATER=Filament TARGET=45

[gcode_macro SPOOL_PETG]
gcode:
    SET_HEATER_TEMPERATURE HEATER=Filament TARGET=55

[gcode_macro SPOOL_ABS]
gcode:
    SET_HEATER_TEMPERATURE HEATER=Filament TARGET=65