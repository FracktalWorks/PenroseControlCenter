########################################
# RING.cfg
# Ring/Zone Heater Control Configuration
# PWM-controlled heater using output_pin
########################################

# Ring Heater controlled via PWM output
# Uses output_pin for direct PWM control without PID
# Maximum power is limited to 50% for safety (enforced in macros)
[output_pin Ring_Heater]
pin: PA4  # Change to your ring heater pin
pwm: true
hardware_pwm: false
cycle_time: 0.03125  # ~32Hz PWM frequency
value: 0  # Start with heater off (0-255 range, 0 = 0%)
shutdown_value: 0  # Turn off on emergency shutdown
#maximum_mcu_duration: 0  # Disabled - no timeout for continuous heater operation
scale: 255  # Accept 0-255 input range (like standard M-codes)

# Temperature sensor to monitor ring heater zone (optional)
# Uncomment and configure if you have a temperature sensor
# [temperature_sensor Ring_Zone]
# sensor_type: ATC Semitec 104GT-2  # Change to your thermistor type
# sensor_pin: PC5  # Change to your sensor pin
# min_temp: 0
# max_temp: 400
# gcode_id: Ring

########################################
# Ring Heater Control Macros
########################################

# M143 - Set Ring Heater Power Level
# Usage: M143 S<power>
#   S: Power level 0-255 (0=off, 255=max allowed power)
# Examples:
#   M143 S0    - Turn off ring heater
#   M143 S128  - Set ring heater to ~50% of max allowed power
#   M143 S255  - Set ring heater to maximum allowed power
[gcode_macro M143]
description: Set Ring Heater PWM power level (0-255, limited by PRINTER_VARIABLES)
gcode:
    {% set power_raw = params.S|default(0)|int %}
    {% set max_power = printer["gcode_macro PRINTER_VARIABLES"].ring_heater_max_power|default(0.5)|float %}
    # Clamp to 0-255 range, then limit to configured max power
    {% set power_clamped = [[power_raw, 0]|max, 255]|min %}
    {% set power_limited = (power_clamped * max_power)|int %}
    
    SET_PIN PIN=Ring_Heater VALUE={power_limited}
    # Report the actual limited power value for UI display (power_limited/255)
    {action_respond_info("Ring heater set to %.1f%% (%d/255, max %.0f%%)" % (power_limited / 255.0 * 100, power_limited, max_power * 100))}

# M144 - Turn Off Ring Heater
# Usage: M144
# Immediately turns off the ring heater
[gcode_macro M144]
description: Turn off Ring Heater
gcode:
    SET_PIN PIN=Ring_Heater VALUE=0
    {action_respond_info("Ring heater turned off")}

# SET_RING_POWER - Alternative macro for setting ring power by percentage
# Usage: SET_RING_POWER POWER=<0-100>
# Examples:
#   SET_RING_POWER POWER=0   - Turn off
#   SET_RING_POWER POWER=50  - Set to 25% actual power (50% of max allowed 50%)
#   SET_RING_POWER POWER=100 - Set to 50% actual power (100% of max allowed 50%)
[gcode_macro SET_RING_POWER]
description: Set Ring Heater power by percentage (0-100% of configured max)
gcode:
    {% set power_pct = params.POWER|default(0)|float %}
    {% set max_power = printer["gcode_macro PRINTER_VARIABLES"].ring_heater_max_power|default(0.5)|float %}
    # Clamp to 0-100, convert to 0-255 range, limit to configured max power
    {% set power_clamped = [[power_pct, 0]|max, 100]|min %}
    {% set power_limited = (power_clamped * 2.55 * max_power)|int %}
    
    SET_PIN PIN=Ring_Heater VALUE={power_limited}
    {action_respond_info("Ring heater set to %.1f%% actual power (max %.0f%%)" % (power_limited / 255.0 * 100, max_power * 100))}

# RING_OFF - Convenience macro to turn off ring heater
[gcode_macro RING_OFF]
description: Turn off the ring heater
gcode:
    SET_PIN PIN=Ring_Heater VALUE=0
    {action_respond_info("Ring heater turned off")}

########################################
# Configuration Notes
########################################
# 
# The ring heater is limited to 50% maximum power for safety.
# This is enforced in the macro scaling (output limited to 0.0-0.5).
#
# Power Level Mapping (M143):
#   M143 S0     = 0% actual power (off)
#   M143 S64    = 12.5% actual power
#   M143 S128   = 25% actual power
#   M143 S192   = 37.5% actual power
#   M143 S255   = 50% actual power (MAXIMUM)
#
# Alternative percentage control (SET_RING_POWER):
#   SET_RING_POWER POWER=0    = 0% actual power
#   SET_RING_POWER POWER=50   = 25% actual power
#   SET_RING_POWER POWER=100  = 50% actual power (MAXIMUM)
#
########################################
