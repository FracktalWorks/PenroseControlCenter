########################################
# BASE_PENROSE.cfg
# Base Hardware Configuration for Penrose Cartesian IDEX Printer
# Dual X carriages, Dual Y motors, external stepper drivers
# Author: Vijay Raghav Varada
# Version: 2
########################################

########################################
# X Stepper - Motor M1 (Primary Carriage / T0)
# Cartesian IDEX configuration
########################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver
endstop_pin: ^PF0
homing_speed: 60
homing_retract_dist: 10.0

########################################
# X Dual Carriage - Motor M2 (Secondary Carriage / T1)
# IDEX second toolhead
########################################

[dual_carriage]
axis: x
safe_distance: 60
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver
endstop_pin: ^PF3
homing_speed: 60
homing_retract_dist: 10.0

########################################
# Y Stepper - Motor M4 (Primary Y)
########################################

[stepper_y]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver
endstop_pin: ^PF2
homing_speed: 60
homing_retract_dist: 10.0

########################################
# Y1 Stepper - Motor M5 (Secondary Y)
# Same direction as Y
########################################

[stepper_y1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver
endstop_pin: ^PF2

########################################
# Z Stepper - Motor M3
########################################

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver (min 2.5µs per datasheet)
endstop_pin: ^PF1
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 3  # Reduced from 10 to stay within Z max after homing

########################################
# Extruder 0 - Motor M6 (Primary Toolhead)
########################################

[extruder]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 37.73  # Calibrated for pellet auger (4g ABS @ 200mm test)
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA0
max_power: 0.4  # Limit AC heater to 40% power
sensor_pin: PB0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_extrude_temp: 130
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 8.0
min_temp: -200
max_temp: 480

########################################
# Extruder 1 - Motor M7 (Secondary Toolhead / Dual Carriage)
########################################

[extruder1]
step_pin: PD11
dir_pin: PD9
enable_pin: !PD15
microsteps: 16
rotation_distance: 37.73  # Calibrated for pellet auger (4g ABS @ 200mm test)
step_pulse_duration: 0.000005  # 5µs - required for DM542 driver
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA3
max_power: 0.4  # Limit AC heater to 40% power
sensor_pin: PC4
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_extrude_temp: 130
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 8.0
min_temp: -200
max_temp: 480

########################################
# Heater Bed
########################################

[heater_bed]
heater_pin: PA4
sensor_pin: PB1
sensor_type: ATC Semitec 104GT-2
control: watermark
min_temp: 0
max_temp: 150

########################################
# H0 - Secondary Heater for T0
########################################

[heater_generic H0]
gcode_id: H0
heater_pin: PA1
max_power: 0.4  # Limit AC heater to 40% power
sensor_pin: PC5
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -200
max_temp: 480

[verify_heater H0]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

########################################
# H1 - Secondary Heater for T1
########################################

[heater_generic H1]
gcode_id: H1
heater_pin: PA5
max_power: 0.4  # Limit AC heater to 40% power
sensor_pin: PA7
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -200
max_temp: 480

[verify_heater H1]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

########################################
# Probe and ABL
########################################

[probe]
pin: PD8
x_offset: 0
y_offset: 0
z_offset: -0.55
sample_retract_dist: 2.0
speed: 4
lift_speed: 10
samples_tolerance: 0.05
samples: 1
samples_result: average
samples_tolerance_retries: 8

########################################
# Dual Carriage Configuration
########################################

[respond]
default_type: echo

########################################
# Misc.
########################################

[delayed_gcode STARTUP]
initial_duration: 1
gcode:
    RESPOND TYPE=echo MSG="Penrose IDEX Ready"

########################################
# IDEX Tool Management Macros
########################################

[gcode_macro T0]
description: Activate Tool 0 (Primary Carriage)
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    
    # Park T1 if it's currently active
    {% if printer.toolhead.extruder == 'extruder1' %}
        # Save current position for T1
        SAVE_GCODE_STATE NAME=T1_state
        # Move T1 to park position
        G90
        G1 X{printer_var.tool1_park_x} F{printer_var.feedrate}
    {% endif %}
    
    # Activate primary carriage
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    
    # Apply T0 offset
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    
    RESPOND TYPE=echo MSG="Active Tool: T0"

[gcode_macro T1]
description: Activate Tool 1 (Dual Carriage)
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    
    # Park T0 if it's currently active
    {% if printer.toolhead.extruder == 'extruder' %}
        # Save current position for T0
        SAVE_GCODE_STATE NAME=T0_state
        # Move T0 to park position
        G90
        G1 X{printer_var.tool0_park_x} F{printer_var.feedrate}
    {% endif %}
    
    # Activate dual carriage
    SET_DUAL_CARRIAGE CARRIAGE=1
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    
    # Apply T1 offset (calibrated offset between nozzles)
    SET_GCODE_OFFSET X={printer_var.offset_x} Y={printer_var.offset_y} Z={printer_var.offset_z}
    
    RESPOND TYPE=echo MSG="Active Tool: T1"

########################################
# Temperature Control (IDEX + Secondary Heaters)
# T0 = extruder (T0 primary)
# T1 = extruder1 (T1 primary)
# H0 = Secondary heater for T0
# H1 = Secondary heater for T1
########################################

[gcode_macro M104]
rename_existing: M104.1
description: Set heater temp. T0/T1 for primary, H0/H1 for secondary
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(-1)|int %}
    {% set sec = params.H|default(-1)|int %}
    {% if sec == 0 %}
        SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
    {% elif sec == 1 %}
        SET_HEATER_TEMPERATURE HEATER=H1 TARGET={temp}
    {% elif tool == 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    {% elif tool == 1 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
    {% elif tool == -1 and sec == -1 %}
        M104.1 S{temp}
    {% else %}
        RESPOND TYPE=error MSG="Invalid heater. Use T0, T1, H0, or H1"
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Set heater temp and wait. T0/T1 for primary, H0/H1 for secondary
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(-1)|int %}
    {% set sec = params.H|default(-1)|int %}
    {% if sec == 0 %}
        SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
        TEMPERATURE_WAIT SENSOR="heater_generic H0" MINIMUM={temp - 2}
    {% elif sec == 1 %}
        SET_HEATER_TEMPERATURE HEATER=H1 TARGET={temp}
        TEMPERATURE_WAIT SENSOR="heater_generic H1" MINIMUM={temp - 2}
    {% elif tool == 0 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}
    {% elif tool == 1 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp - 2}
    {% elif tool == -1 and sec == -1 %}
        M109.1 S{temp}
    {% else %}
        RESPOND TYPE=error MSG="Invalid heater. Use T0, T1, H0, or H1"
    {% endif %}

########################################
# IDEX Homing
########################################

[gcode_macro _HOME_X]
gcode:
    # Home X axis - both carriages
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    
    # Home primary carriage first (moves to min)
    SET_DUAL_CARRIAGE CARRIAGE=0
    G28 X
    G1 X{printer_var.tool0_park_x} F{printer_var.feedrate}
    
    # Home secondary carriage (moves to max)
    SET_DUAL_CARRIAGE CARRIAGE=1
    G28 X
    G1 X{printer_var.tool1_park_x} F{printer_var.feedrate}
    
    # Return to primary carriage
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder

########################################
# IDEX COPY and MIRROR Modes
########################################

[gcode_macro IDEX_COPY]
description: Enable IDEX copy mode (print 2 identical parts)
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    RESPOND TYPE=echo MSG="IDEX COPY mode enabled"

[gcode_macro IDEX_MIRROR]
description: Enable IDEX mirror mode (print 2 mirrored parts)
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    RESPOND TYPE=echo MSG="IDEX MIRROR mode enabled"

[gcode_macro IDEX_SINGLE]
description: Return to single toolhead mode
gcode:
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    RESPOND TYPE=echo MSG="IDEX SINGLE mode - T0 active"

########################################
# PAUSE & Resume Functionality for IDEX
########################################

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set z = params.Z|default(printer_var.z_hop)|float %}
    {% set r = params.R|default(2.0)|float %}
    
    {% if printer['pause_resume'].is_paused|int == 0 %}
        # Store temps for both extruders
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp0 VALUE={printer['extruder'].target|default(0)|int}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp1 VALUE={printer['extruder1'].target|default(0)|int}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=active_extruder VALUE="'{printer.toolhead.extruder}'"

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE

        # Z hop
        {% if printer.gcode_move.gcode_position.z < (printer.toolhead.axis_maximum.z - z) %}
            G91
            G1 Z{z} F900
        {% else %}
            RESPOND TYPE=echo MSG="Pause zhop exceeds maximum Z height."
        {% endif %}
        
        # Park current toolhead
        G90
        {% if printer.toolhead.extruder == 'extruder' %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F{printer_var.feedrate}
        {% else %}
            G1 X{printer_var.tool1_pause_position_x} Y{printer_var.tool1_pause_position_y} F{printer_var.feedrate}
        {% endif %}
        
        M106 S0
        
        # Retract if hot enough
        {% if printer[printer.toolhead.extruder].temperature >= 150 %}
            G1 E-{r} F2100
        {% endif %}
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp0: 0
variable_etemp1: 0
variable_active_extruder: 'extruder'
gcode:
    {% set e = params.E|default(20)|float %}
    {% set r = params.R|default(1)|float %}
    
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        # Restore temps for both extruders
        {% if etemp0 > 0 %}
            M104 T0 S{etemp0|int}
        {% endif %}
        {% if etemp1 > 0 %}
            M104 T1 S{etemp1|int}
        {% endif %}
        
        # Wait for active extruder temp
        {% if active_extruder == 'extruder' and etemp0 > 0 %}
            M109 T0 S{etemp0|int}
        {% elif active_extruder == 'extruder1' and etemp1 > 0 %}
            M109 T1 S{etemp1|int}
        {% endif %}

        # Prime if possible
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% set can_prime = (printer[printer.toolhead.extruder].temperature|float >= min_temp) %}

        {% if can_prime %}
            G90
            G1 E{r} F2100
        {% endif %}

        M420 S1
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150

        {% if can_prime %}
            G90
            G1 E{e} F900
        {% endif %}

        BASE_RESUME VELOCITY=150
    {% endif %}

