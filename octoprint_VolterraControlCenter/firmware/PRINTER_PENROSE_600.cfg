########################################
# PRINTER_PENROSE_600.cfg
# Printer specific configurations for Penrose 600
# Cartesian IDEX 600x600x600mm
# Author: Vijay Raghav Varada
# Version: 2
########################################

########################################
# Core Configs, Common to all printers
[include macro.cfg]
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Select Printer Family Series
# Penrose is a Cartesian IDEX printer
[include BASE_PENROSE.cfg]
########################################

########################################
# Include Add-Ons
# ----------------------------------------
# Filament Sensors on Main Board
# ----------------------------------------
# [include T0_FILAMENT_RUNOUT_SENSOR.cfg]
# [include T0_FILAMENT_JAM_SENSOR.cfg]
# ----------------------------------------
# T1 Filament Sensors for IDEX
# [include T1_FILAMENT_RUNOUT_SENSOR.cfg]
# [include T1_FILAMENT_JAM_SENSOR.cfg]
# ----------------------------------------
# Other Add Ons:
# ----------------------------------------
#[include MAG_DOOR.cfg]
[include mainsail.cfg]
# [include ELECTRONICS_CHAMBER_COOLING.cfg]
# [include CHAMBER_HEATER.cfg]
# [include RING.cfg]
# [include FILAMENT_HEATER.cfg]
#######################################

#######################################
# PRINTER VARIABLES
# Contains all printer-specific settings
# Used by ControlCenter for dynamic configuration
#######################################
[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage (T1 offset relative to T0)
# Calibrate these values after initial setup
variable_offset_x: 0
variable_offset_y: 0
variable_offset_z: 0

# Autopark parameters
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 300  # mm/s
variable_feedrate: 18000  # mm/min

# HeatBed size (600x600x600)
variable_bed_x_min: 0
variable_bed_x_max: 600
variable_bed_y_min: 0
variable_bed_y_max: 600
variable_bed_z_min: 0
variable_bed_z_max: 600

# Print cooling fans names
variable_fan0: 'extruder_CF'
variable_fan1: 'extruder1_CF'

# Tool 0 (Primary Carriage) Positions
variable_tool0_park_x: -30
variable_tool0_pause_position_x: -20
variable_tool0_pause_position_y: 10

# Tool 1 (Dual Carriage) Positions
variable_tool1_park_x: 630
variable_tool1_pause_position_x: 620
variable_tool1_pause_position_y: 10

# Printer Configuration
variable_is_dual_nozzle: 1
variable_ptfe_tube_length: 1500

# Bed Calibration Positions (3-point bed screw locations for 600mm bed)
variable_bed_calibration_x1: 50
variable_bed_calibration_y1: 50
variable_bed_calibration_x2: 550
variable_bed_calibration_y2: 50
variable_bed_calibration_x3: 300
variable_bed_calibration_y3: 550
#variable_bed_calibration_x4: 300
#variable_bed_calibration_y4: 300
gcode:
    G90

########################################
# Printer Kinematics
# Cartesian with dual_carriage for IDEX
########################################
[printer]
kinematics: cartesian
max_velocity: 150 #300 
max_accel: 1000 #3000
max_z_velocity: 20
max_z_accel: 100
square_corner_velocity: 5

########################################
# X Axis Position Settings (Primary Carriage T0)
# Homes to min (left side)
########################################
[stepper_x]
position_endstop: -85
position_min: -85
position_max: 600

########################################
# X Axis Position Settings (Dual Carriage T1)
# Homes to max (right side)
########################################
[dual_carriage]
position_endstop: 640
position_min: 0
position_max: 640

########################################
# Y Axis Position Settings
########################################
[stepper_y]
position_endstop: 620
position_max: 620
position_min: -10

########################################
# Z Axis Position Settings
########################################
[stepper_z]
position_endstop: 597
position_max: 603  # 6mm above endstop to allow for horizontal_move_z lifts after homing
position_min: -2

########################################
# Input Shaping and Resonance
########################################
[input_shaper]
# Tune these after running resonance tests
#shaper_freq_x: 50
#shaper_freq_y: 50
#shaper_type: mzv

########################################
# Bed Mesh for 600mm bed
########################################
[bed_mesh]
mesh_min: 50, 50
mesh_max: 550, 550
probe_count: 5, 5
speed: 200
horizontal_move_z: 5
algorithm: bicubic

########################################
# Bed Screws for Manual Leveling (600mm bed)
########################################
[bed_screws]
screw1: 50, 50
screw1_name: Front Left
screw2: 550, 50
screw2_name: Front Right
screw3: 550, 300 #550
screw3_name: Rear #Right
#screw4: 50, 550
#screw4_name: Rear Left
horizontal_move_z: 5
speed: 50
probe_speed: 5
