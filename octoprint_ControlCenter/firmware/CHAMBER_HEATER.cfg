########################################
# CHAMBER.cfg
# Chamber Heater Control Configuration
# Closed-loop PID controlled heater
########################################

[heater_generic Chamber]
gcode_id: Chamber
heater_pin: PA3  # Change to your chamber heater pin
max_power: 1.0
sensor_type: ATC Semitec 104GT-2  # Change to your thermistor type
sensor_pin: PC4  # Change to your chamber thermistor pin
pwm_cycle_time: 0.005
smooth_time: 2
control: pid_v
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -199
max_temp: 160  # Set appropriate max for your chamber

[verify_heater Chamber]
max_error: 120
check_gain_time: 600  # Long time for slow-heating chamber
hysteresis: 50
heating_gain: 1

########################################
# Chamber Heater Control Macros
########################################

# M141 - Set Chamber Temperature (no wait)
[gcode_macro M141]
gcode:
    {% set S = params.S|default(0)|float %}
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET={S}

# M191 - Wait for Chamber Temperature
[gcode_macro M191]
gcode:
    {% set S = params.S|default(0)|float %}
    {% set TOLERANCE = params.TOLERANCE|default(5)|float %}
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET={S}
    {% if S > 0 %}
        TEMPERATURE_WAIT SENSOR="heater_generic Chamber" MINIMUM={S - TOLERANCE}
    {% endif %}

# Turn off chamber heater
[gcode_macro CHAMBER_OFF]
gcode:
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET=0