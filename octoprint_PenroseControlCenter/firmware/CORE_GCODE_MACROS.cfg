########################################
# CORE_GCODE_MACROS.cfg
# Common G-codes and commands to extend Klipper capability
# Backwards compatible with Marlin for all printer variants
# Also defines the shared custom thermistor used by every pellet heater.
# Author: Vijay Raghav Varada
# Version: 4
########################################

########################################
# Custom thermistor - ALL PELLET HEATERS
#
# Every pellet nozzle and every H0/H1 barrel heater on every Penrose
# variant (Single, Dual, Hybrid) uses this non-standard NTC. It is NOT
# one of Klipper's built-in types.
#
# Calibrated 2026-06-16 against an EPCOS 100K B57560G104F reference
# co-located on the T0 heater block over 50-250 C, max error 0.78 C.
# Derived Steinhart-Hart:
#   A = 6.878132e-04   B = 1.987067e-04   C = 2.595443e-07
#   R(25 C) = 94.3 kOhm, effective beta(25-250) = 3857 K
#   Monotonic and well-behaved out to 480 C.
#
# WHY THIS MATTERS: the stock "ATC Semitec 104GT-2" table is a poor fit
# for this sensor and UNDER-reads it badly - about -61 C at a true 250 C
# and -102 C at a true 400 C. Under-reading makes the PID drive the
# heater HARDER, so the real temperature overshoots far past target. On a
# 480 C AC band heater that is a burn/fire risk, not a print-quality
# issue. Never point a pellet heater at a stock table "just to get it
# running".
#
# Defined here because every SKU includes this file, so there is exactly
# one copy and the variants cannot drift apart.
#
# NOT used by: the heated bed (stock Semitec) or any FILAMENT hotend
# (stock EPCOS, same as every other Fracktal Works filament printer).
#
# LIMITS:
#   * Calibrated only to 250 C. Beyond that the curve is extrapolated -
#     sane and monotonic, but its accuracy is unverified. Recalibrate
#     with points spanning the working range if printing PEEK/PPS above
#     300 C.
#   * With the default 4700 Ohm pullup, ADC discrimination falls below
#     one count per degree past ~350 C (about 6 C per count at 480 C),
#     so max_temp: 480 is optimistic regardless of the table.
#
# The name is historical; kept so it matches sections already present on
# commissioned machines.
########################################

[thermistor new_thermistor_t1]
temperature1: 50.1
resistance1: 38803.5
temperature2: 150.7
resistance2: 2425.1
temperature3: 250.4
resistance3: 359.5

########################################
# Misc
########################################

[force_move]
enable_force_move: True

[save_variables]
filename: ~/.octoprint/data/klipper/variables.cfg

[virtual_sdcard]
path: ~/.octoprint/uploads
on_error_gcode: CANCEL_PRINT

[display_status]

########################################
# Idle Timeout
########################################

[idle_timeout]
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
        {% if printer.extruder.temperature|float >= 150 %}
            M104 T0 S150
        {% endif %}
        {% if "extruder1" in printer and (printer['extruder1'].temperature|default(0)|float) >= 150 %}
            M104 T1 S150
        {% endif %}
    {% else %}
        M107
        M104 T0 S0
        {% if "extruder1" in printer %}M104 T1 S0{% endif %}
        {% if printer["heater_generic H0"] is defined %}M104 H0 S0{% endif %}
        {% if printer["heater_generic H1"] is defined %}M104 H1 S0{% endif %}
        M140 S0
        M84
    {% endif %}
timeout: 2400

########################################
# Bed Screws Adjustment
########################################

[gcode_macro SCREW_ADJUST]
gcode:
    G28
    # Mesh OFF, and AFTER the home: on the Hybrid, homing_override
    # re-loads the stored mesh at the end of every G28. Adjusting bed
    # screws against a mesh-corrected Z defeats the point of adjusting
    # them. No-op on machines that do not auto-load a mesh.
    M420 S0
    BED_SCREWS_ADJUST

########################################
# Bed Mesh Commands
########################################

[gcode_macro M420]
gcode:
    {% if params.S == '1' %}
        {% if printer.bed_mesh.profiles.p1 is defined %}
            RESPOND TYPE=echo MSG="Existing mesh found, loading...";
            BED_MESH_PROFILE LOAD=p1
        {% else %}
            RESPOND TYPE=echo MSG="No existing mesh found";
        {% endif %}
    {% endif %}
    {% if params.S == '0' %}
        BED_MESH_CLEAR
    {% endif %}

########################################
# Settings Related
########################################

[gcode_macro M218]
gcode:
    {% if params.T =='1' %}
        {% if params.X %}
            SAVE_VARIABLE VARIABLE=tool_offset_x VALUE={params.X|float}
        {% endif %}
        {% if params.Y %}
            SAVE_VARIABLE VARIABLE=tool_offset_y VALUE={params.Y|float}
        {% endif %}
        {% if params.Z %}
            SAVE_VARIABLE VARIABLE=tool_offset_z VALUE={params.Z|float}
        {% endif %}
    {% endif %}

[gcode_macro M500]
gcode:
    SAVE_CONFIG NO_RESTART=1

[gcode_macro M503]
gcode:
    {% if "extruder1" in printer %}
        RESPOND TYPE=echo MSG="M218 T1 X{printer.save_variables.variables.tool_offset_x|default(0.0)} Y{printer.save_variables.variables.tool_offset_y|default(0.0)} Z{printer.save_variables.variables.tool_offset_z|default(0.0)}"
    {% endif %}
    {% if 'probe' in printer.configfile.config %}
        RESPOND TYPE=echo MSG="M851 Z{printer.configfile.config.probe.z_offset}"
    {% else %}
        RESPOND TYPE=echo MSG="M851 Z0.000"
    {% endif %}

########################################
# Babystepping
########################################

[gcode_macro M290]
gcode:
    {% set babystep_z = printer.save_variables.variables.babystep_z|default(0.0) %}
    {% set new_babystep = babystep_z + (params.Z|default(0.0)|float) %}
    SAVE_VARIABLE VARIABLE=babystep_z VALUE={new_babystep}
    SET_GCODE_OFFSET Z_ADJUST={params.Z|default(0.0)} MOVE=1
    {% if printer.toolhead.extruder == "extruder" %}
        # Persist the adjustment into [probe] z_offset.
        #
        # This used to be wrong on the hybrid because z_offset was SHARED
        # between the two modes while the filament head is also named
        # 'extruder' (single-extruder config-swap model) - so the guard was
        # always true and filament babysteps drifted the PELLET head's
        # reference, 0.025mm at a time (318 SAVE_CONFIGs on .176,
        # 2026-08-28). Now that [probe] is stored PER MODE, the fold lands
        # in the active head's own z_offset and is correct on either head -
        # which is what gives the Control screen's Z +/- buttons back to
        # filament mode. On non-hybrid machines this still means "T0 only",
        # exactly as before.
        Z_OFFSET_APPLY_PROBE
        # Debounced, NOT immediate. SAVE_CONFIG rewrites the whole of
        # printer.cfg; at one write per 0.025mm press that is how 318 of
        # them happened. Z_OFFSET_APPLY_PROBE recomputes the pending value
        # from the config each time and overwrites it, so re-arming this
        # timer on every press and saving once, 5s after the operator stops,
        # produces the identical result in a single write.
        UPDATE_DELAYED_GCODE ID=_SAVE_Z_OFFSET DURATION=5
    {% endif %}

# Fires 5s after the last M290, re-armed by each press. duration: 0 so it
# never runs on its own at startup.
[delayed_gcode _SAVE_Z_OFFSET]
initial_duration: 0
gcode:
    SAVE_CONFIG NO_RESTART=1

[delayed_gcode CLEAR_BABYSTEP_Z]
initial_duration: 1
gcode:
    SAVE_VARIABLE VARIABLE=babystep_z VALUE=0.0
    SAVE_CONFIG NO_RESTART=1

########################################
# Z Probe Offset
########################################

[gcode_macro M851]
gcode:
    {% if params.Z %}
        SET_GCODE_OFFSET Z=0
        {% set new_offset = params.Z|float %}
        {% set current_probe_offset = printer.configfile.config.probe.z_offset|float %}
        {% set offset_adjustment = current_probe_offset - new_offset %}
        SET_GCODE_OFFSET Z={offset_adjustment}
        RESPOND TYPE=echo MSG="offset adjustment: {offset_adjustment}"
        Z_OFFSET_APPLY_PROBE
        SET_GCODE_OFFSET Z=0
        SAVE_CONFIG
    {% endif %}

########################################
# Position Report
########################################

[gcode_macro M114]
rename_existing: M114.1
gcode:
    RESPOND TYPE=echo MSG="Count {printer.gcode_move.gcode_position}"
    M114.1

########################################
# Temperature Related
########################################

[gcode_macro M190]
rename_existing: M190.1
variable_tolerance: 2.0
gcode:
    {% if params.S %}
        M140 S{params.S}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={params.S|float - tolerance}
    {% elif params.R %}
        M190.1 S{params.R}
    {% else %}
        M140 S0
    {% endif %}

########################################
# Pressure Advance
########################################

[gcode_macro M900]
gcode:
    {% if params.K is defined %}
        {% set K = params.K|float %}
        SET_PRESSURE_ADVANCE ADVANCE={K}
    {% endif %}

########################################
# Pellet Feeder System
# NOTE: Full pellet feeder functionality is in PELLET_RELAY_CONTROL_SINGLE.cfg / PELLET_RELAY_CONTROL_DUAL.cfg
# These are convenience aliases for common operations
########################################

[gcode_macro SET_PELLET_LEVEL_SENSOR]
description: Enable or disable pellet level sensors. S=1 enable, S=0 disable, T=0/1 for specific tool
gcode:
    # Delegate to SET_PELLET_SENSOR in PELLET_RELAY_CONTROL_SINGLE/DUAL.cfg
    {% set enable = params.S|default(1)|int %}
    {% set tool = params.T|default(-1)|int %}
    {% if tool >= 0 %}
        SET_PELLET_SENSOR S={enable} TOOL={tool}
    {% else %}
        SET_PELLET_SENSOR S={enable}
    {% endif %}

[gcode_macro QUERY_PELLET_LEVEL_SENSOR]
description: Query current state of pellet level sensors
gcode:
    # Delegate to QUERY_PELLET_SYSTEM in PELLET_RELAY_CONTROL_SINGLE/DUAL.cfg
    QUERY_PELLET_SYSTEM

[gcode_macro QUERY_LINEVAC_STATUS]
description: Query current state of line vac solenoid valves
gcode:
    # Delegate to QUERY_PELLET_SYSTEM in PELLET_RELAY_CONTROL_SINGLE/DUAL.cfg
    QUERY_PELLET_SYSTEM