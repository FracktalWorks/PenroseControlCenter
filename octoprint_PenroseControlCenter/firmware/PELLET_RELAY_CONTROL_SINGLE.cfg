########################################
# PELLET_RELAY_CONTROL_SINGLE.cfg
# Pellet Feeder System for Penrose Single Nozzle
# Single solenoid valve controls pneumatic line vac for pellet transport
# Capacitive sensor detects pellet level and triggers refill
# Only LEFT (T0) valve - no mutual exclusion needed
# Author: Vijay Raghav Varada
# Version: 2
########################################

#####################################################################
# LINE VAC SOLENOID VALVE (RELAY CONTROL)
# This solenoid actuates the pneumatic valve that controls
# the line vac system for pellet transport to the hopper.
# 
# RELAY LOGIC (Active-LOW with inverted pin):
#   VALUE=1   = Pin LOW  = Relay ON  = Valve OPEN  = Pellets flowing
#   VALUE=0.8 = PWM 80%  = 2s ON / 0.5s OFF pulsing (hardware-level)
#   VALUE=0   = Pin HIGH = Relay OFF = Valve CLOSED = No flow
#
# PWM MODE:
#   pwm=True with cycle_time=2.5 enables MCU-level pulsing.
#   SET_PIN VALUE=0.8  → hardware alternates 2s ON / 0.5s OFF
#   SET_PIN VALUE=1   → continuous ON (manual/force operations)
#   SET_PIN VALUE=0   → OFF
#
# PIN ASSIGNMENTS (verify these match your board!):
#   Tool 0 (Primary/Left): PE9
#####################################################################


# [output_pin pellet_vac_left]
# # LineVac solenoid for Tool 0 (Primary/Left extruder)
# # Active-LOW relay: ! inverts signal so VALUE=1 activates relay
# # PWM Mode: VALUE=0.8 with cycle_time=2.5 gives 2s ON / 0.5s OFF hardware pulsing
# pin: !PE9
# pwm: True
# cycle_time: 2.5    ; 2.5s period: 80% duty = 2s ON, 0.5s OFF hardware pulsing
# value: 0           ; Start with relay OFF (valve closed)
# shutdown_value: 0  ; On shutdown, close valve (safety)

[output_pin pellet_vac_left] For Hisar Penrose Single
# LineVac solenoid for Tool 0 (Primary/Left extruder)
# Active-LOW relay: ! inverts signal so VALUE=1 activates relay
# PWM Mode: VALUE=0.8 with cycle_time=2.5 gives 2s ON / 0.5s OFF hardware pulsing
pin: PA5 #!PE9
pwm: True
cycle_time: 2.5    ; 2.5s period: 80% duty = 2s ON, 0.5s OFF hardware pulsing
value: 0           ; Start with relay OFF (valve closed)
shutdown_value: 0  ; On shutdown, close valve (safety)

# [output_pin pellet_vac_right]
# # Right solenoid channel of 5/2 valve - held permanently OFF for single nozzle
# # MUST be explicitly configured to prevent floating PD15 pin from activating
# # the second solenoid, which would shift the 5/2 valve to the wrong position
# pin: !PD15
# pwm: False
# value: 0           ; Hold relay OFF (solenoid de-energized)
# shutdown_value: 0  ; On shutdown, keep OFF (safety)

#####################################################################
# PELLET LEVEL SENSOR (CAPACITIVE)
# Detects pellet presence in hopper and triggers auto-refill.
#
# Sensor Logic (with inverted pin ^!):
#   Pellets PRESENT = filament_detected = true  → insert_gcode
#   Pellets ABSENT  = filament_detected = false → runout_gcode
#
# PIN ASSIGNMENT:
#   Tool 0 (Left): PF4 (with internal pullup ^ and inverted !)
#####################################################################

[filament_switch_sensor pellet_sensor_left]
switch_pin: ^!PF4
pause_on_runout: False
event_delay: 0.5
debounce_delay: 1.0
runout_gcode:
    # Sensor LOW: Hopper empty - turn ON vac to refill
    _PELLET_CHECK_AND_REFILL TOOL=0
insert_gcode:
    # Sensor HIGH: Hopper full - turn OFF vac
    _PELLET_STOP_REFILL TOOL=0

[delayed_gcode _PELLET_SENSOR_INIT]
initial_duration: 2
gcode:
    SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE=1
    RESPOND TYPE=echo MSG="Pellet Sensor: LEFT (T0) Initialized"

#####################################################################
# AUTO-REFILL LOGIC (Called by pellet sensor)
#
# HYBRID PWM + POLLING ARCHITECTURE:
#   1. Sensor detects LOW (empty) → runout_gcode → this macro
#   2. This macro checks conditions, then starts PWM pulsing:
#      a. SET_PIN VALUE=0.8 → MCU-level 2s ON / 0.5s OFF hardware PWM
#      b. Polling timer checks sensor every 2s
#      c. When sensor shows full → SET_PIN VALUE=0 (stop)
#      d. After 60s (30 polls) with no fill → PAUSE print
#
# Single nozzle: Only Tool 0 logic, no mutual exclusion needed.
#
# VALUE MAPPING:
#   VALUE=0   → OFF (relay off, valve closed)
#   VALUE=0.8  → PULSED (2s on / 0.5s off, hardware PWM, auto-refill)
#   VALUE=1   → CONTINUOUS ON (manual control, force refill)
#
# Smart Refill Conditions:
#   - Only refill when PRINTING (not Idle/Paused)
#   - FORCE=1 bypasses print state checks
#
# Safety Features:
#   - 60s timeout: if hopper doesn't fill, PAUSE print
#   - Sensor checked every 2s via polling timer
#   - Prevents extruder from running dry and damaging print
#   - User must manually refill and resume
#####################################################################

[gcode_macro _PELLET_CHECK_AND_REFILL]
description: Check conditions and turn on vac if appropriate (with safety timeout). Use FORCE=1 to bypass print state checks (still respects sensor).
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set force = params.FORCE|default(0)|int %}
    
    # Single nozzle: only tool 0 is valid
    {% if tool != 0 %}
        RESPOND TYPE=echo MSG="Pellet check: TOOL={tool} ignored (single nozzle, only TOOL=0 available)"
    {% else %}
        # Get current sensor state
        {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
        {% set left_full = left_sensor.filament_detected|default(false) if left_sensor is defined else false %}
        
        RESPOND TYPE=echo MSG="Pellet check: TOOL=0, FORCE={force}"
        
        # If FORCE=1, skip print state checks but still check sensor
        {% if force == 1 %}
            {% if left_full %}
                RESPOND TYPE=echo MSG="Pellet refill skipped: T0 hopper already FULL (sensor detected)"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
                SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
                SET_PIN PIN=pellet_vac_left VALUE=0.8
                UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
                RESPOND TYPE=echo MSG="Pellet refill FORCED: T0 (Left) - PWM pulsing started (2s on/0.5s off)"
            {% endif %}
        {% else %}
            # Normal operation - check print state and sensor
            {% set idle_state = printer.idle_timeout.state|default("Idle") %}
            {% set is_printing = (idle_state == "Printing") %}
            {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
            
            {% if is_printing and not is_paused %}
                {% if left_full %}
                    RESPOND TYPE=echo MSG="Pellet refill skipped: T0 hopper already FULL (sensor detected)"
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
                    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
                    SET_PIN PIN=pellet_vac_left VALUE=0.8
                    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
                    RESPOND TYPE=echo MSG="Pellet refill started: T0 (Left) - PWM pulsing (2s on/0.5s off)"
                {% endif %}
            {% else %}
                RESPOND TYPE=echo MSG="Pellet refill skipped: Not printing (state={idle_state})"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _PELLET_STOP_REFILL]
description: Stop refill - turns OFF vac (PWM or continuous) and cancels poll timer
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    SET_PIN PIN=pellet_vac_left VALUE=0
    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
    RESPOND TYPE=echo MSG="Pellet refill stopped: T0 (Left) - vac OFF, poll cancelled"

#####################################################################
# PWM POLLING MECHANISM
# Hardware PWM handles the 2s ON / 0.5s OFF pulsing at the MCU level.
# This polling timer simply checks the sensor periodically and
# enforces a safety timeout.
#
# Architecture:
#   - SET_PIN VALUE=0.8 starts MCU-level 2s/0.5s pulsing (cycle_time=2.5)
#   - Polling timer fires every 2s to check sensor status
#   - If sensor shows full → SET_PIN VALUE=0 (stop)
#   - If 60s elapsed with no fill → SET_PIN VALUE=0 + PAUSE
#
# Sends "Pellet Outage T0" message for TouchUI dialog detection
#####################################################################

[gcode_macro _PELLET_PULSE_STATE]
description: Internal state holder for PWM-pulsed refill polling
variable_left_elapsed: 0
variable_left_active: 0
gcode:
    M115

[delayed_gcode _PELLET_POLL_LEFT]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    {% set old_elapsed = state.left_elapsed|int %}
    {% set poll_interval = 2 %}
    {% set max_time = 60 %}
    {% set elapsed = old_elapsed + poll_interval %}
    
    # Check sensor
    {% set sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set full = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if full %}
        # Hopper full - stop PWM and report success
        SET_PIN PIN=pellet_vac_left VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet T0: hopper FULL after ~{elapsed}s of pulsed refill"
    {% elif elapsed >= max_time %}
        # Timeout - stop PWM, reset state, pause print
        SET_PIN PIN=pellet_vac_left VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet Outage T0 - {max_time}s of pulsed refill failed, print paused"
        PAUSE
    {% else %}
        # Continue polling - PWM pulsing continues at hardware level
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE={elapsed}
        RESPOND TYPE=echo MSG="Pellet T0: pulsing... ~{elapsed}s/{max_time}s"
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION={poll_interval}
    {% endif %}

#####################################################################
# PRINT START PELLET CHECK
# Call this from your PRINT_START macro to ensure hopper is filled
# before printing begins. This handles the case where hopper is 
# already empty when print starts (sensor won't transition).
#####################################################################

[gcode_macro PELLET_PREPRINT_CHECK]
description: Check pellet level at print start and refill if needed. Call from PRINT_START.
gcode:
    {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set left_full = left_sensor.filament_detected|default(false) if left_sensor is defined else true %}
    
    RESPOND TYPE=echo MSG="Pre-print pellet check..."
    
    {% if not left_full %}
        RESPOND TYPE=echo MSG="T0 hopper empty at print start - starting pulsed refill"
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_left VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
    {% else %}
        RESPOND TYPE=echo MSG="T0 hopper OK"
    {% endif %}

#####################################################################
# VALVE CONTROL MACROS
# Direct control of the line vac solenoid valve
#####################################################################

[gcode_macro PELLET_VAC_LEFT_ON]
description: Open Left (T0) line vac valve
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=1

[gcode_macro PELLET_VAC_LEFT_OFF]
description: Close Left (T0) line vac valve
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=0

[gcode_macro PELLET_VAC_ALL_OFF]
description: Close valve and cancel any pending polls - SAFE STATE
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=0
    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
    RESPOND TYPE=echo MSG="Pellet Vac: OFF (safe state)"

#####################################################################
# UI-FRIENDLY MANUAL REFILL MACROS
# These check sensor state and act accordingly - ideal for UI buttons
#####################################################################

[gcode_macro PELLET_REFILL_LEFT]
description: [UI] Check sensor and refill if needed (PWM pulsed, 60s timeout). FORCE=1 to ignore sensor.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set pellets_ok = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if force or not pellets_ok %}
        RESPOND TYPE=echo MSG="LEFT: {'Force refill requested' if force else 'Pellets LOW - starting pulsed refill'}"
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_left VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
    {% else %}
        RESPOND TYPE=echo MSG="LEFT: Pellets OK - no refill needed"
    {% endif %}

[gcode_macro PELLET_STOP_REFILL]
description: [UI] Stop pellet refill - closes valve and cancels PWM pulsing
gcode:
    _PELLET_STOP_REFILL TOOL=0
    RESPOND TYPE=echo MSG="Pellet refill STOPPED - valve closed, PWM pulsing cancelled"

#####################################################################
# PELLET SENSOR CONTROL MACROS
#####################################################################

[gcode_macro SET_PELLET_SENSOR]
description: Enable or disable pellet level sensor. S=1 enable, S=0 disable, TOOL=0 (only T0 available on single nozzle)
gcode:
    {% set enable = params.S|default(1)|int %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% if tool == 1 %}
        RESPOND TYPE=echo MSG="Pellet Sensor: TOOL=1 not available (single nozzle, only TOOL=0)"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor LEFT (Tool 0): {'ENABLED' if enable else 'DISABLED'}"
    {% endif %}

#####################################################################
# HOPPER AGITATION
# Brief vac pulse to disturb pellets and prevent auger starvation.
# MIX_HOPPER is called from slicer gcode (e.g. layer change).
# It schedules the actual pin work via delayed_gcode so the gcode
# stream returns immediately — no move planner flush, no stall.
#####################################################################

[gcode_macro _MIX_HOPPER_STATE]
description: Internal state for MIX_HOPPER
variable_active_side: -1
gcode:
    M115

[gcode_macro MIX_HOPPER]
description: Schedule a single hopper agitation pulse. Call from slicer gcode — returns instantly, pin work runs async via delayed_gcode.
gcode:
    # Just schedule the pulse and return — no blocking
    UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_PULSE DURATION=0.1

[delayed_gcode _MIX_HOPPER_PULSE]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    # Single nozzle: only left side
    {% if state.left_active|int == 0 %}
        SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=0
        SET_PIN PIN=pellet_vac_left VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_STOP DURATION=1
    {% endif %}

[delayed_gcode _MIX_HOPPER_STOP]
initial_duration: 0
gcode:
    {% set side = printer["gcode_macro _MIX_HOPPER_STATE"].active_side|int %}
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    # Don't kill PWM if a refill took over while we were waiting
    {% if side == 0 and state.left_active|int == 0 %}
        SET_PIN PIN=pellet_vac_left VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=-1

#####################################################################
# SYSTEM STATUS QUERY
#####################################################################

[gcode_macro QUERY_PELLET_SYSTEM]
description: Query current state of pellet feeder system
gcode:
    RESPOND TYPE=echo MSG="========================================="
    RESPOND TYPE=echo MSG="       PELLET FEEDER SYSTEM STATUS       "
    RESPOND TYPE=echo MSG="      (Single Nozzle Configuration)      "
    RESPOND TYPE=echo MSG="========================================="
    
    # Show printer state for auto-refill logic
    {% set idle_state = printer.idle_timeout.state|default("Unknown") %}
    {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
    
    RESPOND TYPE=echo MSG="Printer State: {idle_state} {'(PAUSED)' if is_paused else ''}"
    RESPOND TYPE=echo MSG="Active Tool:   T0 (Single Nozzle)"
    
    {% set auto_enabled = (idle_state == "Printing" and not is_paused) %}
    RESPOND TYPE=echo MSG="Auto-Refill:   {'ENABLED' if auto_enabled else 'DISABLED (only during print)'}"
    RESPOND TYPE=echo MSG="-----------------------------------------"
    
    ; Check if output pin is defined and get its value
    {% if printer["output_pin pellet_vac_left"] is defined %}
        {% set vac_left = printer["output_pin pellet_vac_left"].value|default(0)|float %}
        {% if vac_left >= 1.0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  ON  (continuous, valve open)"
        {% elif vac_left > 0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  PULSING (PWM 2s on/0.5s off, auto-refill active)"
        {% else %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Vac (T0):  NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="-----------------------------------------"
    ; Query sensor state
    {% if printer["filament_switch_sensor pellet_sensor_left"] is defined %}
        {% set left_enabled = printer["filament_switch_sensor pellet_sensor_left"].enabled %}
        {% set left_detected = printer["filament_switch_sensor pellet_sensor_left"].filament_detected %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  {'Enabled' if left_enabled else 'Disabled'} | Pellets: {'OK' if left_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="========================================="