########################################
# T0_PELLET_LEVEL_SENSOR.cfg
# Capacitive Pellet Level Sensor for Tool 0 (LEFT) Hopper
# Automatically controls line vac solenoid for pellet transport
# Author: Vijay Raghav Varada
# Version: 4
########################################

#####################################################################
# PELLET LEVEL SENSOR - LEFT (TOOL 0)
# Capacitive sensor detects pellet presence in the left hopper
#
# Sensor Logic (with inverted pin): 
#   - Pellets PRESENT = filament_detected = true
#   - Pellets ABSENT  = filament_detected = false → triggers runout_gcode
#
# Smart Auto-Refill Logic:
#   - Only refills when PRINTING (not idle/paused)
#   - Only refills when Tool 0 is the ACTIVE tool
#   - Also refills in COPY/MIRROR modes (both tools active)
#
# PIN: PF4 (with internal pullup ^ and inverted ! for active-LOW sensor)
# Sensor outputs LOW when material detected, HIGH when empty
#####################################################################

[filament_switch_sensor pellet_sensor_left]
switch_pin: ^!PF4
pause_on_runout: False
event_delay: 1.0
runout_gcode:
    # Pellet level LOW - check if we should auto-refill
    _PELLET_CHECK_AND_REFILL TOOL=0
insert_gcode:
    # Pellet level OK - always safe to turn off vac
    PELLET_VAC_LEFT_OFF

[delayed_gcode _PELLET_SENSOR_LEFT_INIT]
initial_duration: 2
gcode:
    # Enable pellet sensor after startup
    # Auto-refill logic is handled in the macros based on print state
    SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE=1
    RESPOND TYPE=echo MSG="Pellet Sensor LEFT (Tool 0): Initialized"


