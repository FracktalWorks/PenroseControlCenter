########################################
# PELLET_RELAY_CONTROL.cfg
# Pellet Feeder System for Penrose IDEX
# Solenoid valves control pneumatic line vac for pellet transport
# Capacitive sensors detect pellet level and trigger refill
# Author: Vijay Raghav Varada
# Version: 2
########################################

#####################################################################
# LINE VAC SOLENOID VALVES
# These solenoids actuate the pneumatic valves that control
# the line vac system for pellet transport to each hopper.
# Active-LOW relays: VALUE=0 = OPEN (pellets flowing)
#                    VALUE=1 = CLOSED (no flow)
#####################################################################

[output_pin linevac_T0]
pin: PD14
value: 1
shutdown_value: 1

[output_pin linevac_T1]
pin: PE9
value: 1
shutdown_value: 1

#####################################################################
# LINE VAC CONTROL MACROS
# Called by pellet level sensors to control pellet transport
# Each toolhead has independent line vac control
#####################################################################

[gcode_macro LINEVAC_T0_ON]
description: Open T0 line vac solenoid valve - start pellet transport
gcode:
    SET_PIN PIN=linevac_T0 VALUE=0
    RESPOND TYPE=echo MSG="Line Vac T0: ON - Transporting pellets"

[gcode_macro LINEVAC_T0_OFF]
description: Close T0 line vac solenoid valve - stop pellet transport
gcode:
    SET_PIN PIN=linevac_T0 VALUE=1
    RESPOND TYPE=echo MSG="Line Vac T0: OFF - Hopper full"

[gcode_macro LINEVAC_T1_ON]
description: Open T1 line vac solenoid valve - start pellet transport
gcode:
    SET_PIN PIN=linevac_T1 VALUE=0
    RESPOND TYPE=echo MSG="Line Vac T1: ON - Transporting pellets"

[gcode_macro LINEVAC_T1_OFF]
description: Close T1 line vac solenoid valve - stop pellet transport
gcode:
    SET_PIN PIN=linevac_T1 VALUE=1
    RESPOND TYPE=echo MSG="Line Vac T1: OFF - Hopper full"

[gcode_macro LINEVAC_ALL_ON]
description: Open both line vac solenoid valves
gcode:
    SET_PIN PIN=linevac_T0 VALUE=0
    SET_PIN PIN=linevac_T1 VALUE=0
    RESPOND TYPE=echo MSG="Line Vac ALL: ON"

[gcode_macro LINEVAC_ALL_OFF]
description: Close both line vac solenoid valves (SAFE)
gcode:
    SET_PIN PIN=linevac_T0 VALUE=1
    SET_PIN PIN=linevac_T1 VALUE=1
    RESPOND TYPE=echo MSG="Line Vac ALL: OFF"

#####################################################################
# PELLET SENSOR CONTROL MACROS
#####################################################################

[gcode_macro SET_PELLET_SENSOR]
description: Enable or disable pellet level sensors. S=1 enable, S=0 disable, T=0/1 for specific tool
gcode:
    {% set enable = params.S|default(1)|int %}
    {% set tool = params.T|default(-1)|int %}
    {% if tool == 0 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_level_T0 ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Level Sensor T0: {'ENABLED' if enable else 'DISABLED'}"
    {% elif tool == 1 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_level_T1 ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Level Sensor T1: {'ENABLED' if enable else 'DISABLED'}"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=pellet_level_T0 ENABLE={enable}
        SET_FILAMENT_SENSOR SENSOR=pellet_level_T1 ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Level Sensors: {'ENABLED' if enable else 'DISABLED'}"
    {% endif %}

[gcode_macro QUERY_PELLET_SYSTEM]
description: Query current state of pellet feeder system
gcode:
    {% set vac_t0 = printer["output_pin linevac_T0"].value|default(1) %}
    {% set vac_t1 = printer["output_pin linevac_T1"].value|default(1) %}
    RESPOND TYPE=echo MSG="=== PELLET FEEDER STATUS ==="
    {% if vac_t0 == 0 %}
        RESPOND TYPE=echo MSG="T0 Line Vac: ON (transporting pellets)"
    {% else %}
        RESPOND TYPE=echo MSG="T0 Line Vac: OFF (hopper full or disabled)"
    {% endif %}
    {% if vac_t1 == 0 %}
        RESPOND TYPE=echo MSG="T1 Line Vac: ON (transporting pellets)"
    {% else %}
        RESPOND TYPE=echo MSG="T1 Line Vac: OFF (hopper full or disabled)"
    {% endif %}
    # Query sensor states
    {% if printer["filament_switch_sensor pellet_level_T0"] is defined %}
        {% set t0_enabled = printer["filament_switch_sensor pellet_level_T0"].enabled %}
        {% set t0_detected = printer["filament_switch_sensor pellet_level_T0"].filament_detected %}
        RESPOND TYPE=echo MSG="T0 Sensor: {'Enabled' if t0_enabled else 'Disabled'}, Pellets: {'OK' if t0_detected else 'LOW'}"
    {% endif %}
    {% if printer["filament_switch_sensor pellet_level_T1"] is defined %}
        {% set t1_enabled = printer["filament_switch_sensor pellet_level_T1"].enabled %}
        {% set t1_detected = printer["filament_switch_sensor pellet_level_T1"].filament_detected %}
        RESPOND TYPE=echo MSG="T1 Sensor: {'Enabled' if t1_enabled else 'Disabled'}, Pellets: {'OK' if t1_detected else 'LOW'}"
    {% endif %}

