#####################################################################
# PELLET SENSOR CONTROL MACROS
#####################################################################

[gcode_macro SET_PELLET_SENSOR]
description: Enable or disable pellet level sensors. S=1 enable, S=0 disable, TOOL=0/1 for specific tool (omit for both)
gcode:
    {% set enable = params.S|default(1)|int %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% if tool == 0 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor LEFT (Tool 0): {'ENABLED' if enable else 'DISABLED'}"
    {% elif tool == 1 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor RIGHT (Tool 1): {'ENABLED' if enable else 'DISABLED'}"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensors (Both): {'ENABLED' if enable else 'DISABLED'}"
    {% endif %}

#####################################################################
# HOPPER AGITATION
# Brief vac pulse to disturb pellets and prevent auger starvation.
# MIX_HOPPER is called from slicer gcode (e.g. layer change).
# It schedules the actual pin work via delayed_gcode so the gcode
# stream returns immediately — no move planner flush, no stall.
#####################################################################

[gcode_macro _MIX_HOPPER_STATE]
description: Internal state for MIX_HOPPER
variable_active_side: -1
gcode:
    M115

[gcode_macro MIX_HOPPER]
description: Schedule a single hopper agitation pulse. Call from slicer gcode — returns instantly, pin work runs async via delayed_gcode.
gcode:
    # Just schedule the pulse and return — no blocking
    UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_PULSE DURATION=0.1

[delayed_gcode _MIX_HOPPER_PULSE]
initial_duration: 0
gcode:
    {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    {% if current_extruder == "extruder" %}
        {% if state.left_elapsed|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=0
            SET_PIN PIN=pellet_vac_left VALUE=0.5
            UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_STOP DURATION=1
        {% endif %}
    {% else %}
        {% if state.right_elapsed|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=1
            SET_PIN PIN=pellet_vac_right VALUE=0.5
            UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_STOP DURATION=1
        {% endif %}
    {% endif %}

[delayed_gcode _MIX_HOPPER_STOP]
initial_duration: 0
gcode:
    {% set side = printer["gcode_macro _MIX_HOPPER_STATE"].active_side|int %}
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    # Don't kill PWM if a refill took over while we were waiting
    {% if side == 0 and state.left_elapsed|int == 0 %}
        SET_PIN PIN=pellet_vac_left VALUE=0
    {% elif side == 1 and state.right_elapsed|int == 0 %}
        SET_PIN PIN=pellet_vac_right VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=-1

#####################################################################
# DIAGNOSTIC MACROS
# Use these to test and verify the pellet system is working
#####################################################################

[gcode_macro PELLET_SYSTEM_TEST]
description: Test the pellet vac system - cycles both valves ON then OFF
gcode:
    RESPOND TYPE=echo MSG="=== PELLET SYSTEM TEST ==="
    RESPOND TYPE=echo MSG="Testing LEFT valve (Tool 0)..."
    SET_PIN PIN=pellet_vac_left VALUE=1
    G4 P1000  ; Wait 1 second
    SET_PIN PIN=pellet_vac_left VALUE=0
    RESPOND TYPE=echo MSG="LEFT valve test complete"
    G4 P500
    RESPOND TYPE=echo MSG="Testing RIGHT valve (Tool 1)..."
    SET_PIN PIN=pellet_vac_right VALUE=1
    G4 P1000  ; Wait 1 second
    SET_PIN PIN=pellet_vac_right VALUE=0
    RESPOND TYPE=echo MSG="RIGHT valve test complete"
    RESPOND TYPE=echo MSG="=== TEST COMPLETE ==="

[gcode_macro QUERY_PELLET_SYSTEM]
description: Query current state of entire pellet feeder system
gcode:
    RESPOND TYPE=echo MSG="========================================="
    RESPOND TYPE=echo MSG="       PELLET FEEDER SYSTEM STATUS       "
    RESPOND TYPE=echo MSG="========================================="
    
    # Show printer state for auto-refill logic
    {% set idle_state = printer.idle_timeout.state|default("Unknown") %}
    {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
    {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
    {% set active_tool = "T0 (Left)" if current_extruder == "extruder" else "T1 (Right)" %}
    
    {% set dual_mode = "SINGLE" %}
    {% if printer.dual_carriage is defined %}
        {% set c1_state = printer.dual_carriage.carriage_1|default("INACTIVE") %}
        {% if c1_state == "COPY" %}
            {% set dual_mode = "COPY (both active)" %}
        {% elif c1_state == "MIRROR" %}
            {% set dual_mode = "MIRROR (both active)" %}
        {% endif %}
    {% endif %}
    
    RESPOND TYPE=echo MSG="Printer State: {idle_state} {'(PAUSED)' if is_paused else ''}"
    RESPOND TYPE=echo MSG="Active Tool:   {active_tool}"
    RESPOND TYPE=echo MSG="IDEX Mode:     {dual_mode}"
    
    {% set auto_enabled = (idle_state == "Printing" and not is_paused) %}
    RESPOND TYPE=echo MSG="Auto-Refill:   {'ENABLED' if auto_enabled else 'DISABLED (only during print)'}"
    RESPOND TYPE=echo MSG="-----------------------------------------"
    
    ; Check if output pins are defined and get their values
    {% if printer["output_pin pellet_vac_left"] is defined %}
        {% set vac_left = printer["output_pin pellet_vac_left"].value|default(0)|float %}
        {% if vac_left >= 1.0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  ON  (continuous, valve open)"
        {% elif vac_left > 0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  PULSING (PWM 1s on/1s off, auto-refill active)"
        {% else %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Vac (T0):  NOT CONFIGURED!"
    {% endif %}
    {% if printer["output_pin pellet_vac_right"] is defined %}
        {% set vac_right = printer["output_pin pellet_vac_right"].value|default(0)|float %}
        {% if vac_right >= 1.0 %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): ON  (continuous, valve open)"
        {% elif vac_right > 0 %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): PULSING (PWM 1s on/1s off, auto-refill active)"
        {% else %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT Vac (T1): NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="-----------------------------------------"
    ; Query sensor states
    {% if printer["filament_switch_sensor pellet_sensor_left"] is defined %}
        {% set left_enabled = printer["filament_switch_sensor pellet_sensor_left"].enabled %}
        {% set left_detected = printer["filament_switch_sensor pellet_sensor_left"].filament_detected %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  {'Enabled' if left_enabled else 'Disabled'} | Pellets: {'OK' if left_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  NOT CONFIGURED!"
    {% endif %}
    {% if printer["filament_switch_sensor pellet_sensor_right"] is defined %}
        {% set right_enabled = printer["filament_switch_sensor pellet_sensor_right"].enabled %}
        {% set right_detected = printer["filament_switch_sensor pellet_sensor_right"].filament_detected %}
        RESPOND TYPE=echo MSG="RIGHT Sensor: {'Enabled' if right_enabled else 'Disabled'} | Pellets: {'OK' if right_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT Sensor: NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="========================================="

[gcode_macro DEBUG_PINS]
description: Debug macro to check if pins are correctly configured
gcode:
    RESPOND TYPE=echo MSG="=== PIN DEBUG INFO ==="
    RESPOND TYPE=echo MSG="This macro tests direct pin control"
    RESPOND TYPE=echo MSG="If you see errors, the pin names may be wrong"
    RESPOND TYPE=echo MSG="Expected pins: PE9 (Left/Tool0), PD15 (Right/Tool1)"
    RESPOND TYPE=echo MSG="Attempting to toggle pellet_vac_left..."
    SET_PIN PIN=pellet_vac_left VALUE=0
    RESPOND TYPE=echo MSG="pellet_vac_left set to 0 (OFF) - SUCCESS"
    RESPOND TYPE=echo MSG="Attempting to toggle pellet_vac_right..."
    SET_PIN PIN=pellet_vac_right VALUE=0
    RESPOND TYPE=echo MSG="pellet_vac_right set to 0 (OFF) - SUCCESS"
    RESPOND TYPE=echo MSG="=== PIN DEBUG COMPLETE ==="

#####################################################################
# TEST MACRO - Full refill cycle test without printing
# Use this to verify the complete refill and shutoff logic works
# NOTE: This macro temporarily enables the sensor for testing
#####################################################################

[gcode_macro TEST_PELLET_REFILL]
description: Test pellet refill system without printing. TOOL=0/1, TIMEOUT_TEST=1 to test timeout (runs full 30s PWM pulsing)
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set timeout_test = params.TIMEOUT_TEST|default(0)|int %}
    {% set sensor_name = "pellet_sensor_left" if tool == 0 else "pellet_sensor_right" %}
    
    RESPOND TYPE=echo MSG="============================================"
    RESPOND TYPE=echo MSG="    PELLET REFILL TEST - Tool {tool}        "
    RESPOND TYPE=echo MSG="============================================"
    
    # Check if sensor is currently enabled
    {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set right_sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set sensor = left_sensor if tool == 0 else right_sensor %}
    {% set was_enabled = sensor.enabled|default(false) if sensor is defined else false %}
    {% set detected = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    RESPOND TYPE=echo MSG="Sensor: {sensor_name}"
    RESPOND TYPE=echo MSG="Sensor was: {'ENABLED' if was_enabled else 'DISABLED (will enable for test)'}"
    RESPOND TYPE=echo MSG="Pellet state: {'FULL (pellets detected)' if detected else 'EMPTY (no pellets)'}"
    
    # Enable the sensor for testing (required for insert_gcode to trigger!)
    {% if not was_enabled %}
        RESPOND TYPE=echo MSG=""
        RESPOND TYPE=echo MSG="*** ENABLING SENSOR FOR TEST ***"
        SET_FILAMENT_SENSOR SENSOR={sensor_name} ENABLE=1
    {% endif %}
    
    {% if detected and timeout_test == 0 %}
        RESPOND TYPE=echo MSG=""
        RESPOND TYPE=echo MSG="Hopper is already FULL - no refill needed"
        RESPOND TYPE=echo MSG="To test anyway, empty the hopper first or use TIMEOUT_TEST=1"
        # Re-disable if it was disabled before
        {% if not was_enabled %}
            SET_FILAMENT_SENSOR SENSOR={sensor_name} ENABLE=0
            RESPOND TYPE=echo MSG="Sensor disabled (was disabled before test)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG=""
        RESPOND TYPE=echo MSG="Starting refill test..."
        RESPOND TYPE=echo MSG="- Sensor is now ENABLED (will detect pellets)"
        RESPOND TYPE=echo MSG="- PWM pulsed refill: 1s ON, 1s OFF (hardware-level)"
        RESPOND TYPE=echo MSG="- Polling timer checks sensor every 2s"
        RESPOND TYPE=echo MSG="- Max 30s before timeout"
        RESPOND TYPE=echo MSG="- When sensor detects pellets, vac will turn OFF"
        RESPOND TYPE=echo MSG=""
        RESPOND TYPE=echo MSG="Watch for these messages:"
        RESPOND TYPE=echo MSG="  1. 'Pellet refill FORCED: T{tool}... PWM pulsing started'"
        RESPOND TYPE=echo MSG="  2. 'Pellet T{tool}: hopper FULL after ~Ns'"
        RESPOND TYPE=echo MSG=""
        
        {% if timeout_test == 1 %}
            RESPOND TYPE=echo MSG="*** TIMEOUT TEST MODE ***"
            RESPOND TYPE=echo MSG="Will run full 30s PWM pulsing to test timeout behavior"
        {% endif %}
        
        RESPOND TYPE=echo MSG="To manually stop: TEST_PELLET_STOP TOOL={tool}"
        RESPOND TYPE=echo MSG=""
        
        # Start the refill
        _PELLET_CHECK_AND_REFILL TOOL={tool} FORCE=1
        
        RESPOND TYPE=echo MSG="Test started! Fill the hopper and watch for shutoff."
    {% endif %}
    RESPOND TYPE=echo MSG="============================================"

[gcode_macro TEST_PELLET_STOP]
description: Stop pellet test and optionally disable the sensor. TOOL=0/1
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% set sensor_left = "pellet_sensor_left" %}
    {% set sensor_right = "pellet_sensor_right" %}
    
    RESPOND TYPE=echo MSG="=== STOPPING PELLET TEST ==="
    
    # Stop any active refill
    PELLET_STOP_REFILL
    
    # Disable sensors (return to non-printing state)
    {% if tool == 0 %}
        SET_FILAMENT_SENSOR SENSOR={sensor_left} ENABLE=0
        RESPOND TYPE=echo MSG="Sensor pellet_sensor_left DISABLED"
    {% elif tool == 1 %}
        SET_FILAMENT_SENSOR SENSOR={sensor_right} ENABLE=0
        RESPOND TYPE=echo MSG="Sensor pellet_sensor_right DISABLED"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR={sensor_left} ENABLE=0
        SET_FILAMENT_SENSOR SENSOR={sensor_right} ENABLE=0
        RESPOND TYPE=echo MSG="Both sensors DISABLED"
    {% endif %}
    
    RESPOND TYPE=echo MSG="Test stopped. Sensors returned to disabled state."