########################################
# PELLET_RELAY_CONTROL.cfg
# Pellet Feeder System for Penrose IDEX
# Solenoid valves control pneumatic line vac for pellet transport
# Capacitive sensors detect pellet level and trigger refill
# Author: Vijay Raghav Varada
# Version: 4
########################################

#####################################################################
# LINE VAC SOLENOID VALVES (RELAY CONTROL)
# These solenoids actuate the pneumatic valves that control
# the line vac system for pellet transport to each hopper.
# 
# RELAY LOGIC (Active-LOW):
#   VALUE=0 = Relay ON = Valve OPEN = Pellets flowing
#   VALUE=1 = Relay OFF = Valve CLOSED = No flow
#
# PIN ASSIGNMENTS (verify these match your board!):
#   Tool 0 (Primary/Left): PD14
#   Tool 1 (Secondary/Right): PE9
#####################################################################

[output_pin pellet_vac_left]
# LineVac solenoid for Tool 0 (Primary/Left extruder)
pin: PD14
value: 1           ; Start with relay OFF (valve closed)
shutdown_value: 1  ; On shutdown, close valve (safety)

[output_pin pellet_vac_right]
# LineVac solenoid for Tool 1 (Secondary/Right extruder)
pin: PE9
value: 1           ; Start with relay OFF (valve closed)
shutdown_value: 1  ; On shutdown, close valve (safety)

#####################################################################
# SMART AUTO-REFILL LOGIC
# Core intelligence for pellet refill system
#
# Rules:
#   1. Only refill when printer is PRINTING (not Idle/Ready/Paused)
#   2. Only refill the ACTIVE tool (the one currently extruding)
#   3. In COPY/MIRROR mode, both tools are active - refill both
#   4. Manual override always works regardless of state
#####################################################################

[gcode_macro _PELLET_CHECK_AND_REFILL]
description: Internal macro - checks conditions before enabling auto-refill
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    
    # Get printer state
    {% set idle_state = printer.idle_timeout.state|default("Idle") %}
    {% set is_printing = (idle_state == "Printing") %}
    {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
    
    # Get active tool info
    {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
    {% set tool0_active = (current_extruder == "extruder") %}
    {% set tool1_active = (current_extruder == "extruder1") %}
    
    # Check for COPY/MIRROR mode (both tools active)
    {% set dual_mode = false %}
    {% if printer.dual_carriage is defined %}
        {% set c1_state = printer.dual_carriage.carriage_1|default("INACTIVE") %}
        {% if c1_state == "COPY" or c1_state == "MIRROR" %}
            {% set dual_mode = true %}
        {% endif %}
    {% endif %}
    
    # Determine if this tool should refill
    {% set should_refill = false %}
    {% if is_printing and not is_paused %}
        {% if dual_mode %}
            # In COPY/MIRROR mode, both tools are active
            {% set should_refill = true %}
        {% elif tool == 0 and tool0_active %}
            {% set should_refill = true %}
        {% elif tool == 1 and tool1_active %}
            {% set should_refill = true %}
        {% endif %}
    {% endif %}
    
    # Execute refill or log why not
    {% if should_refill %}
        {% if tool == 0 %}
            PELLET_VAC_LEFT_ON
        {% else %}
            PELLET_VAC_RIGHT_ON
        {% endif %}
    {% else %}
        # Log why we're not refilling (for debugging)
        {% if not is_printing %}
            RESPOND TYPE=echo MSG="Pellet refill skipped (not printing, state={idle_state})"
        {% elif is_paused %}
            RESPOND TYPE=echo MSG="Pellet refill skipped (print paused)"
        {% elif tool == 0 and not tool0_active %}
            RESPOND TYPE=echo MSG="Pellet refill T0 skipped (T1 is active)"
        {% elif tool == 1 and not tool1_active %}
            RESPOND TYPE=echo MSG="Pellet refill T1 skipped (T0 is active)"
        {% endif %}
    {% endif %}

#####################################################################
# LINE VAC CONTROL MACROS (MANUAL OVERRIDE)
# These macros directly control the valves - NO state checking
# Use for manual testing, setup, or emergency override
#
# Naming Convention: PELLET_VAC_<SIDE>_<ACTION>
# - SIDE: LEFT (Tool 0) or RIGHT (Tool 1) or ALL
# - ACTION: ON or OFF
#####################################################################

[gcode_macro PELLET_VAC_LEFT_ON]
description: [MANUAL] Open Left (T0) line vac valve - bypasses auto-refill logic
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=0
    RESPOND TYPE=echo MSG="Pellet Vac LEFT: ON (manual)"

[gcode_macro PELLET_VAC_LEFT_OFF]
description: Close Left (T0) line vac valve
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=1
    RESPOND TYPE=echo MSG="Pellet Vac LEFT: OFF"

[gcode_macro PELLET_VAC_RIGHT_ON]
description: [MANUAL] Open Right (T1) line vac valve - bypasses auto-refill logic
gcode:
    SET_PIN PIN=pellet_vac_right VALUE=0
    RESPOND TYPE=echo MSG="Pellet Vac RIGHT: ON (manual)"

[gcode_macro PELLET_VAC_RIGHT_OFF]
description: Close Right (T1) line vac valve
gcode:
    SET_PIN PIN=pellet_vac_right VALUE=1
    RESPOND TYPE=echo MSG="Pellet Vac RIGHT: OFF"

[gcode_macro PELLET_VAC_ALL_ON]
description: [MANUAL] Open both valves - bypasses auto-refill logic
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=0
    SET_PIN PIN=pellet_vac_right VALUE=0
    RESPOND TYPE=echo MSG="Pellet Vac ALL: ON (manual)"

[gcode_macro PELLET_VAC_ALL_OFF]
description: Close both valves - SAFE STATE
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=1
    SET_PIN PIN=pellet_vac_right VALUE=1
    RESPOND TYPE=echo MSG="Pellet Vac ALL: OFF"

[gcode_macro PELLET_FORCE_REFILL]
description: Force refill a specific tool regardless of print state. TOOL=0/1, DURATION=seconds (default 10)
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set duration = params.DURATION|default(10)|int %}
    {% set duration_ms = duration * 1000 %}
    
    RESPOND TYPE=echo MSG="Force refilling Tool {tool} for {duration} seconds..."
    {% if tool == 0 %}
        SET_PIN PIN=pellet_vac_left VALUE=0
        G4 P{duration_ms}
        SET_PIN PIN=pellet_vac_left VALUE=1
    {% else %}
        SET_PIN PIN=pellet_vac_right VALUE=0
        G4 P{duration_ms}
        SET_PIN PIN=pellet_vac_right VALUE=1
    {% endif %}
    RESPOND TYPE=echo MSG="Force refill complete"

#####################################################################
# UI-FRIENDLY MANUAL REFILL MACROS
# These check sensor state and act accordingly - ideal for UI buttons
#####################################################################

[gcode_macro PELLET_REFILL_LEFT]
description: [UI] Check left sensor and refill if needed. FORCE=1 to ignore sensor.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set pellets_ok = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if force %}
        RESPOND TYPE=echo MSG="LEFT: Force refill requested"
        SET_PIN PIN=pellet_vac_left VALUE=0
    {% elif not pellets_ok %}
        RESPOND TYPE=echo MSG="LEFT: Pellets LOW - starting refill"
        SET_PIN PIN=pellet_vac_left VALUE=0
    {% else %}
        RESPOND TYPE=echo MSG="LEFT: Pellets OK - no refill needed"
    {% endif %}

[gcode_macro PELLET_REFILL_RIGHT]
description: [UI] Check right sensor and refill if needed. FORCE=1 to ignore sensor.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set pellets_ok = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if force %}
        RESPOND TYPE=echo MSG="RIGHT: Force refill requested"
        SET_PIN PIN=pellet_vac_right VALUE=0
    {% elif not pellets_ok %}
        RESPOND TYPE=echo MSG="RIGHT: Pellets LOW - starting refill"
        SET_PIN PIN=pellet_vac_right VALUE=0
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT: Pellets OK - no refill needed"
    {% endif %}

[gcode_macro PELLET_REFILL_BOTH]
description: [UI] Check both sensors and refill any that need it. FORCE=1 to ignore sensors.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set right_sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set left_ok = left_sensor.filament_detected|default(false) if left_sensor is defined else false %}
    {% set right_ok = right_sensor.filament_detected|default(false) if right_sensor is defined else false %}
    
    RESPOND TYPE=echo MSG="Checking pellet levels..."
    
    {% if force or not left_ok %}
        RESPOND TYPE=echo MSG="LEFT: {'Force refill' if force else 'Pellets LOW'} - starting"
        SET_PIN PIN=pellet_vac_left VALUE=0
    {% else %}
        RESPOND TYPE=echo MSG="LEFT: Pellets OK"
    {% endif %}
    
    {% if force or not right_ok %}
        RESPOND TYPE=echo MSG="RIGHT: {'Force refill' if force else 'Pellets LOW'} - starting"
        SET_PIN PIN=pellet_vac_right VALUE=0
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT: Pellets OK"
    {% endif %}

[gcode_macro PELLET_STOP_REFILL]
description: [UI] Stop all pellet refill - closes both valves
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=1
    SET_PIN PIN=pellet_vac_right VALUE=1
    RESPOND TYPE=echo MSG="Pellet refill STOPPED - both valves closed"

#####################################################################
# LEGACY ALIAS MACROS (for backwards compatibility)
# These call the new macros to maintain compatibility with
# existing sensor configs and scripts
#####################################################################

[gcode_macro LINEVAC_TOOL0_ON]
description: [LEGACY] Alias for PELLET_VAC_LEFT_ON
gcode:
    PELLET_VAC_LEFT_ON

[gcode_macro LINEVAC_TOOL0_OFF]
description: [LEGACY] Alias for PELLET_VAC_LEFT_OFF
gcode:
    PELLET_VAC_LEFT_OFF

[gcode_macro LINEVAC_TOOL1_ON]
description: [LEGACY] Alias for PELLET_VAC_RIGHT_ON
gcode:
    PELLET_VAC_RIGHT_ON

[gcode_macro LINEVAC_TOOL1_OFF]
description: [LEGACY] Alias for PELLET_VAC_RIGHT_OFF
gcode:
    PELLET_VAC_RIGHT_OFF

[gcode_macro LINEVAC_ALL_ON]
description: [LEGACY] Alias for PELLET_VAC_ALL_ON
gcode:
    PELLET_VAC_ALL_ON

[gcode_macro LINEVAC_ALL_OFF]
description: [LEGACY] Alias for PELLET_VAC_ALL_OFF
gcode:
    PELLET_VAC_ALL_OFF

#####################################################################
# PELLET SENSOR CONTROL MACROS
#####################################################################

[gcode_macro SET_PELLET_SENSOR]
description: Enable or disable pellet level sensors. S=1 enable, S=0 disable, TOOL=0/1 for specific tool (omit for both)
gcode:
    {% set enable = params.S|default(1)|int %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% if tool == 0 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor LEFT (Tool 0): {'ENABLED' if enable else 'DISABLED'}"
    {% elif tool == 1 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor RIGHT (Tool 1): {'ENABLED' if enable else 'DISABLED'}"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensors (Both): {'ENABLED' if enable else 'DISABLED'}"
    {% endif %}

#####################################################################
# DIAGNOSTIC MACROS
# Use these to test and verify the pellet system is working
#####################################################################

[gcode_macro PELLET_SYSTEM_TEST]
description: Test the pellet vac system - cycles both valves ON then OFF
gcode:
    RESPOND TYPE=echo MSG="=== PELLET SYSTEM TEST ==="
    RESPOND TYPE=echo MSG="Testing LEFT valve (Tool 0)..."
    SET_PIN PIN=pellet_vac_left VALUE=0
    G4 P1000  ; Wait 1 second
    SET_PIN PIN=pellet_vac_left VALUE=1
    RESPOND TYPE=echo MSG="LEFT valve test complete"
    G4 P500
    RESPOND TYPE=echo MSG="Testing RIGHT valve (Tool 1)..."
    SET_PIN PIN=pellet_vac_right VALUE=0
    G4 P1000  ; Wait 1 second
    SET_PIN PIN=pellet_vac_right VALUE=1
    RESPOND TYPE=echo MSG="RIGHT valve test complete"
    RESPOND TYPE=echo MSG="=== TEST COMPLETE ==="

[gcode_macro QUERY_PELLET_SYSTEM]
description: Query current state of entire pellet feeder system
gcode:
    RESPOND TYPE=echo MSG="========================================="
    RESPOND TYPE=echo MSG="       PELLET FEEDER SYSTEM STATUS       "
    RESPOND TYPE=echo MSG="========================================="
    
    # Show printer state for auto-refill logic
    {% set idle_state = printer.idle_timeout.state|default("Unknown") %}
    {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
    {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
    {% set active_tool = "T0 (Left)" if current_extruder == "extruder" else "T1 (Right)" %}
    
    {% set dual_mode = "SINGLE" %}
    {% if printer.dual_carriage is defined %}
        {% set c1_state = printer.dual_carriage.carriage_1|default("INACTIVE") %}
        {% if c1_state == "COPY" %}
            {% set dual_mode = "COPY (both active)" %}
        {% elif c1_state == "MIRROR" %}
            {% set dual_mode = "MIRROR (both active)" %}
        {% endif %}
    {% endif %}
    
    RESPOND TYPE=echo MSG="Printer State: {idle_state} {'(PAUSED)' if is_paused else ''}"
    RESPOND TYPE=echo MSG="Active Tool:   {active_tool}"
    RESPOND TYPE=echo MSG="IDEX Mode:     {dual_mode}"
    
    {% set auto_enabled = (idle_state == "Printing" and not is_paused) %}
    RESPOND TYPE=echo MSG="Auto-Refill:   {'ENABLED' if auto_enabled else 'DISABLED (only during print)'}"
    RESPOND TYPE=echo MSG="-----------------------------------------"
    
    ; Check if output pins are defined and get their values
    {% if printer["output_pin pellet_vac_left"] is defined %}
        {% set vac_left = printer["output_pin pellet_vac_left"].value|default(1) %}
        {% if vac_left == 0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  ON  (valve open, pellets flowing)"
        {% else %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Vac (T0):  NOT CONFIGURED!"
    {% endif %}
    {% if printer["output_pin pellet_vac_right"] is defined %}
        {% set vac_right = printer["output_pin pellet_vac_right"].value|default(1) %}
        {% if vac_right == 0 %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): ON  (valve open, pellets flowing)"
        {% else %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT Vac (T1): NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="-----------------------------------------"
    ; Query sensor states
    {% if printer["filament_switch_sensor pellet_sensor_left"] is defined %}
        {% set left_enabled = printer["filament_switch_sensor pellet_sensor_left"].enabled %}
        {% set left_detected = printer["filament_switch_sensor pellet_sensor_left"].filament_detected %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  {'Enabled' if left_enabled else 'Disabled'} | Pellets: {'OK' if left_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  NOT CONFIGURED!"
    {% endif %}
    {% if printer["filament_switch_sensor pellet_sensor_right"] is defined %}
        {% set right_enabled = printer["filament_switch_sensor pellet_sensor_right"].enabled %}
        {% set right_detected = printer["filament_switch_sensor pellet_sensor_right"].filament_detected %}
        RESPOND TYPE=echo MSG="RIGHT Sensor: {'Enabled' if right_enabled else 'Disabled'} | Pellets: {'OK' if right_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT Sensor: NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="========================================="

[gcode_macro DEBUG_PINS]
description: Debug macro to check if pins are correctly configured
gcode:
    RESPOND TYPE=echo MSG="=== PIN DEBUG INFO ==="
    RESPOND TYPE=echo MSG="This macro tests direct pin control"
    RESPOND TYPE=echo MSG="If you see errors, the pin names may be wrong"
    RESPOND TYPE=echo MSG="Expected pins: PD14 (Left/Tool0), PE9 (Right/Tool1)"
    RESPOND TYPE=echo MSG="Attempting to toggle pellet_vac_left..."
    SET_PIN PIN=pellet_vac_left VALUE=1
    RESPOND TYPE=echo MSG="pellet_vac_left set to 1 (OFF) - SUCCESS"
    RESPOND TYPE=echo MSG="Attempting to toggle pellet_vac_right..."
    SET_PIN PIN=pellet_vac_right VALUE=1
    RESPOND TYPE=echo MSG="pellet_vac_right set to 1 (OFF) - SUCCESS"
    RESPOND TYPE=echo MSG="=== PIN DEBUG COMPLETE ==="