########################################
# MODE_PELLET.cfg
# Penrose 600 Hybrid IDEX - PELLET extruder mode
#
# The machine prints with the LEFT carriage (pellet auger) and Klipper
# sees a SINGLE extruder. The right (filament) carriage is held parked
# at its endstop by a [manual_stepper] - it is physically on the same X
# rail and must stay powered, or it can drift into the printing head.
#
# TWO HEATERS ARE ACTIVE IN THIS MODE:
#   [extruder]           nozzle heater  PA1 / PC5   (OctoPrint tool0)
#   [heater_generic H0]  barrel heater  PA0 / PB0   (OctoPrint "H0")
# Both must be shown in the UI and both must be cooled down at the end
# of a print. Filament mode has only the nozzle heater and no H0 -
# macros therefore guard H0 with `printer["heater_generic H0"] is defined`.
#
# Swap with MODE_FILAMENT.cfg via the include in printer.cfg. The
# Material/Nozzle screen does this, restores the mode's SAVE_CONFIG
# calibration block and restarts Klipper.
#
# Author: Vijay Raghav Varada
# Version: 3
########################################

########################################
# Mode Variables
# Read by the shared macros in BASE_PENROSE_HYBRID.cfg so they do not
# need to know which mode they are running in.
########################################

[gcode_macro EXTRUDER_MODE_VARIABLES]
variable_mode: 'pellet'
# Part cooling fans for this mode (empty entries are skipped by M106)
variable_fan_0: 'extruder_CF_0'
variable_fan_1: 'extruder_CF_1'
# 1 = an H0 barrel heater exists in this mode
variable_has_barrel: 1
# Gentler corners for melt-pressure stability on the auger
variable_square_corner_velocity: 4
gcode:
    # No-op: this macro exists only to carry the variables above

########################################
# X Stepper - Motor M1 (Pellet carriage, LEFT)
# This is the printing carriage in pellet mode.
########################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
endstop_pin: ^PF0
# Carried over UNCHANGED from the IDEX [stepper_x] section. These are
# the pellet carriage's physical soft limits - the rail did not move
# just because Klipper now sees one carriage, so the travel envelope
# and the park position are identical to the proven configuration.
#   -85 = park / home (clear of the 0..600 bed on the left)
#   600 = far edge of the bed
position_endstop: -85
position_min: -85
position_max: 600
homing_speed: 60
homing_retract_dist: 10.0

# ---------------------------------------------------------------------
# CARRIAGE SEPARATION - replaces [dual_carriage] safe_distance: 60
#
# The old config had Klipper enforce a 60mm dynamic gap between the two
# carriages on every move. With no [dual_carriage] there is no dynamic
# check, so separation is now purely static:
#
#     this carriage travels to ....... 600 (position_max above)
#     filament carriage is HELD at ... 640 (its own endstop)
#     nominal gap .................... 40mm
#
# 40mm is the geometry the machine already had at full travel. It is
# smaller than the old 60mm dynamic limit, which means the previous
# config would have REJECTED pellet moves past X=580 while the filament
# carriage sat parked at 640.
#
# COMMISSIONING CHECK (one measurement settles it): jog the pellet
# carriage to X=600 with the filament carriage parked and measure the
# clearance between the two carriage bodies. If they foul, reduce
# position_max to 580 to restore the old effective ceiling. Left at 600
# here so the printable area matches the machine's stated 600x600.
# ---------------------------------------------------------------------

########################################
# Parked carriage - Motor M2 (Filament carriage, RIGHT)
#
# Not part of the kinematic X axis in this mode, but physically on the
# same rail. Declared as a manual_stepper so the motor stays ENERGISED
# and holds station at its endstop (X=640).
#
# NOTE: X and Y are BALL SCREW driven, so the parked carriage cannot
# drift on its own - the screw plus the stepper's detent torque holds it
# mechanically even with the driver powered down. That is what makes the
# brief unpowered window during FIRMWARE_RESTART safe. This section is
# therefore belt-and-braces (it also resists an accidental shove), not
# the sole thing keeping the carriages apart.
#
# It is NOT homed here (no endstop is attached to a manual_stepper).
# Its position is whatever PREPARE_EXTRUDER_MODE_SWITCH's G28 left it
# at, which is why that macro homes before the config is swapped.
########################################

[manual_stepper parked_carriage]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 8
rotation_distance: 20
velocity: 40
accel: 200

[delayed_gcode HOLD_PARKED_CARRIAGE]
initial_duration: 2
gcode:
    MANUAL_STEPPER STEPPER=parked_carriage ENABLE=1
    MANUAL_STEPPER STEPPER=parked_carriage SET_POSITION=0
    RESPOND TYPE=echo MSG="Filament carriage parked and holding"

########################################
# Extruder - Motor M6 (Pellet Auger)
# Nozzle heater is the AC band heater on PA1, limited to 50% power.
########################################

[extruder]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 2
rotation_distance: 35.0  # Calibrated: 28.0 / 0.8 (was 80% flow in slicer)
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA1
max_power: 0.5  # Limit AC heater to 50% power
sensor_pin: PC5
# Custom NTC, NOT a stock Klipper type - defined in BASE_PENROSE_HYBRID.cfg.
# A stock table under-reads this sensor by ~60-100 C at working
# temperature, which makes the PID overdrive the heater. Do not substitute.
sensor_type: new_thermistor_t1
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_extrude_temp: -100
max_extrude_only_distance: 5000
max_extrude_cross_section: 8.0
min_temp: -200
max_temp: 300
# Pellet auger motion limits
max_extrude_only_velocity: 25
max_extrude_only_accel: 400
instantaneous_corner_velocity: 1.0
pressure_advance: 0
pressure_advance_smooth_time: 0.06

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 40
heating_gain: 3

########################################
# H0 - Secondary Heater (Pellet Barrel)
#
# The SECOND of this mode's two heaters. gcode_id H0 is what puts it
# into M105 output, which is how it reaches OctoPrint's temperature
# stream and from there the touchscreen (websocket_client parses the
# "H0" key). Do not rename it without updating both.
#
# Does not exist in filament mode - M104/M109 H0 error there.
########################################

[heater_generic H0]
gcode_id: H0
heater_pin: PA0
max_power: 0.5  # Limit AC heater to 50% power
sensor_pin: PB0
# Same custom NTC as the pellet nozzle - see BASE_PENROSE_HYBRID.cfg
sensor_type: new_thermistor_t1
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -200
max_temp: 480

[verify_heater H0]
max_error: 240
check_gain_time: 60
hysteresis: 40
heating_gain: 3

########################################
# Part Cooling Fans - two mainboard fans on the pellet head
########################################

[fan_generic extruder_CF_0]
pin: PF7

[fan_generic extruder_CF_1]
pin: PF9

########################################
# Pellet Feeder System (line vac, hopper sensor, auto-refill)
# Pellet mode only - the macros it defines (PELLET_PREPRINT_CHECK,
# MIX_HOPPER, QUERY_PELLET_SYSTEM) do not exist in filament mode, so
# the OctoPrint beforePrintStarted script is generated per mode.
########################################

[include PELLET_RELAY_CONTROL_HYBRID.cfg]
