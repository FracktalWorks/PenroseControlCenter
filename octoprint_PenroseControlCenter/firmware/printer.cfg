########################################
# printer.cfg
# Main configuration used by Klipper.
# This is the only file to be modified for
# every printer variant/SKU
# Author: Vijay Raghav Varada
# Version: 10
########################################

########################################
# Include .cfg Files
# Order in which files included is important
# for function overrides & references downstream
########################################

########################################
# Select Any One Printer Configuration
# Only ONE printer should be uncommented at a time
# Penrose Series - Single Nozzle (Hybrid: Pellet/Filament swappable head)
[include PRINTER_PENROSE_600_SINGLE.cfg]
#[include PRINTER_PENROSE_400.cfg]
#[include PRINTER_PENROSE_800.cfg]
########################################

########################################
# Select Extruder Head Configuration
# The Penrose Hybrid supports swapping between a pellet auger
# toolhead and a filament drive toolhead. Uncomment ONE.
[include EXTRUDER_PELLET.cfg]
#[include EXTRUDER_FILAMENT.cfg]
########################################

########################################
# MCU Config
# This section is PRESERVED across printer / extruder head swaps.
# Fill in the CAN UUID(s) once, the UI will keep them across changes.
# Discover UUIDs with:
#   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
########################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_41002C000651323235363233-if00
restart_method: command

# CAN toolhead - used only by the Filament extruder head.
# The Printer Setup UI auto-comments/uncomments this block when
# you switch between Pellet and Filament heads. Just fill the UUID
# once and the UI will preserve it across all future changes.
#[mcu toolhead0]
#canbus_uuid: XXXXXXXXXXXX

########################################


