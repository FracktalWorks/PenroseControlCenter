########################################
# printer.cfg
# Main configuration used by Klipper.
# This is the only file to be modified for
# every printer variant/SKU
# Author: Vijay Raghav Varada
# Version: 15
########################################

########################################
# Include .cfg Files
# Order in which files included is important
# for function overrides & references downstream
########################################

########################################
# Select Any One Printer Configuration
# Only ONE printer should be uncommented at a time
# Penrose Series - Pellet IDEX 3D Printers
[include PRINTER_PENROSE_600_DUAL.cfg]
#[include PRINTER_PENROSE_400.cfg]
#[include PRINTER_PENROSE_800.cfg]
# Penrose Series - Single Nozzle
#[include PRINTER_PENROSE_600_SINGLE.cfg]
# Penrose Series - Hybrid IDEX (T0 Pellet / T1 Filament CAN toolhead)
#[include PRINTER_PENROSE_600_HYBRID.cfg]
########################################

########################################
# MCU Config
########################################

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_20001D000A51313339373836-if00
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_41002C000651323235363233-if00
restart_method: command

# Hybrid IDEX wiring note: on that machine the mainboard is itself a
# CAN node, not a USB device. Comment out the 'serial:' and
# 'restart_method:' lines above and replace them with the mainboard's
# own UUID line:   canbus_uuid: <mainboard UUID>
# Leave the USB serial form active for all other Penrose variants.

# CAN toolhead (E1) - used only by the Hybrid IDEX filament head (T1).
# The Printer Setup UI auto-comments/uncomments this block when you
# switch printer variants. Fill the UUID in once and it is preserved
# across all future printer changes and firmware updates.
#   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
#[mcu E1]
#canbus_uuid: XXXXXXXXXXXX


