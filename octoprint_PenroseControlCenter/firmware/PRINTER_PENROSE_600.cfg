########################################
# PRINTER_PENROSE_600.cfg
# Printer specific configurations for Penrose 600
# Cartesian IDEX Pellet 3D Printer 600x600x600mm
# Author: Vijay Raghav Varada
# Version: 3
########################################


########################################
# Core Configs, Common to all printers
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Select Printer Family Series
# Penrose uses cartesian IDEX kinematics
[include BASE_PENROSE.cfg]
#[include BASE_DRAGON.cfg]
########################################

########################################
# Include Add-Ons
# ----------------------------------------
# Pellet Feeder System (Line Vac Solenoid Valves)
# Solenoids control pneumatic valves for pellet transport
# ----------------------------------------
[include PELLET_RELAY_CONTROL.cfg]
# ----------------------------------------
# Pellet Level Sensors (Capacitive)
# Automatically trigger line vac when pellets are low
# ----------------------------------------
[include T0_PELLET_LEVEL_SENSOR.cfg]
[include T1_PELLET_LEVEL_SENSOR.cfg]
########################################

########################################
# Printer Kinematics
# Cartesian with dual_carriage for IDEX
########################################

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 2500
max_z_velocity: 20
max_z_accel: 100
# Pellet extrusion optimizations
square_corner_velocity: 4      # Reduced from 5 - smoother pressure at corners
minimum_cruise_ratio: 0.5      # Prevents short accel-decel pressure spikes

########################################
# IDEX Config
########################################

[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage (T1 offset relative to T0)
variable_offset_x: 0
variable_offset_y: 0
variable_offset_z: 0

# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 300  # mm/s
variable_feedrate: 18000  # mm/min

# HeatBed size (600x600x625)
variable_bed_x_min: 0
variable_bed_x_max: 600
variable_bed_y_min: 0
variable_bed_y_max: 600
variable_bed_z_min: 0
variable_bed_z_max: 625

# Print cooling fans names (4 fans total for dual toolheads)
variable_fan0_0: 'extruder_CF_0'
variable_fan0_1: 'extruder_CF_1'
variable_fan1_0: 'extruder1_CF_0'
variable_fan1_1: 'extruder1_CF_1'

# Extruders temp offset (for COPY/MIRROR modes)
variable_offset_temp: 4

# Tool 0 (Primary Carriage) Pause/Purge Position
variable_tool0_pause_position_x: -20
variable_tool0_pause_position_y: 10

# Tool 1 (Dual Carriage) Pause/Purge Position
variable_tool1_pause_position_x: 620
variable_tool1_pause_position_y: 10

# Printer Configuration
variable_is_dual_nozzle: 1
variable_ptfe_tube_length: 1500

# Heater Configuration
# has_heater_ring: ALF ring heater (Volterra ALF specific) - 0=no, 1=yes
variable_has_heater_ring: 0
# has_heated_chamber: Heated enclosure/chamber - 0=no, 1=yes
variable_has_heated_chamber: 0
# has_spool_heater: Filament spool heater/dryer - 0=no, 1=yes
variable_has_spool_heater: 0

# Bed Calibration Positions (3-point for 600mm bed)
variable_bed_calibration_x1: 50
variable_bed_calibration_y1: 50
variable_bed_calibration_x2: 550
variable_bed_calibration_y2: 50
variable_bed_calibration_x3: 300
variable_bed_calibration_y3: 550
variable_bed_calibration_x4: 300
variable_bed_calibration_y4: 300
gcode:
    G90

########################################
# X Axis (Primary Carriage T0)
########################################

[stepper_x]
position_endstop: -85
position_min: -85
position_max: 600

########################################
# IDEX Axis (Dual Carriage T1)
########################################

[dual_carriage]
position_endstop: 640
position_min: 0
position_max: 640

########################################
# Y Axis
########################################

[stepper_y]
position_endstop: 600
position_max: 605
position_min: -10

########################################
# Z Axis
########################################

[stepper_z]
position_endstop: 618
position_max: 625
position_min: -5

########################################
# Bed Mesh
########################################

[bed_mesh]
mesh_min: 70, 70
mesh_max: 530, 530
probe_count: 5, 5
horizontal_move_z: 5
speed: 200
algorithm: bicubic

########################################
# Bed Screws for Manual Leveling (600mm bed)
########################################

[bed_screws]
screw1: 50, 50
screw1_name: Front Left
screw2: 550, 50
screw2_name: Front Right
screw3: 550, 300
screw3_name: Rear
horizontal_move_z: 5
speed: 50
probe_speed: 5

########################################
# Input Shaping and Resonance
########################################

[input_shaper]
# Tune these after running resonance tests
#shaper_freq_x: 50
#shaper_freq_y: 50
#shaper_type: mzv
