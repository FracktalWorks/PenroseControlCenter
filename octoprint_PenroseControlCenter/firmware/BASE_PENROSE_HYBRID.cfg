########################################
# BASE_PENROSE_HYBRID.cfg
# SHARED hardware + macros for the Penrose 600 Hybrid IDEX.
#
# This machine has two carriages on one X rail: a pellet auger (left)
# and a TD-01 CAN filament toolhead (right). Only one prints at a time.
#
# ARCHITECTURE: the printing head is selected by INCLUDING one of
#   MODE_PELLET.cfg    - X = left carriage,  [extruder] = auger + H0 barrel
#   MODE_FILAMENT.cfg  - X = right carriage, [extruder] = TD-01 hotend
# in printer.cfg. Klipper therefore always sees a SINGLE-EXTRUDER
# printer, and there is no [dual_carriage] anywhere. The mode file also
# holds the non-printing carriage energised via [manual_stepper].
#
# This file contains only what is common to both modes: Y/Z motion,
# bed, probe, and the macros that adapt themselves via
# [gcode_macro EXTRUDER_MODE_VARIABLES] (defined in each mode file).
#
# HEATERS DIFFER BY MODE. Pellet mode has TWO ([extruder] nozzle and
# [heater_generic H0] barrel); filament mode has ONE. Every macro that
# touches H0 guards it with `printer["heater_generic H0"] is defined`,
# so the same macro text is valid in both modes.
#
# BED LEVELLING: only the pellet nozzle triggers the probe, so G29
# works in pellet mode only. The mesh is shared across modes via the
# SAVE_CONFIG block (see Documentation/DESIGN_HYBRID_IDEX_CONFIG_SWAP.md).
#
# Z ZERO IS PER MODE. The two nozzle tips do not hang the same
# distance below the gantry, so each head keeps its OWN Z reference:
#     [stepper_z] position_endstop  gantry, SHARED - same for both
#     [bed_mesh]                    bed shape, SHARED - pellet-probed
#     [probe] z_offset              PER MODE, in saveconfig_<mode>.cfg
# The pellet value comes from the bed probe. The filament value cannot
# (the TD-01 does not trigger the probe), so it is set by hand - the
# Control screen's Z +/- buttons, the Nozzle Offset page (M851), or
# Z_ZERO_CALIBRATE below. Sign convention: a LARGER probe z_offset puts
# the nozzle CLOSER to the bed, as does a NEGATIVE gcode Z offset.
#
# CONSEQUENCE: tool_offset_z is NOT applied. Z is entirely the active
# mode's z_offset; applying the head offset in Z as well would correct a
# machine migrated from IDEX twice over. tool_offset_x/y still ARE
# applied - those are head-mounting offsets, unrelated to the probe.
#
# CONSEQUENCE: re-levelling in pellet mode does NOT carry to filament.
# The two zeros are independent, so re-check the filament first layer
# after any pellet re-zero.
#
# CAN NOTE: [mcu E1] is defined in printer.cfg so its UUID survives
# mode and SKU changes. It is uncommented for filament mode only.
#
# Author: Vijay Raghav Varada
# Version: 7
########################################

########################################
# Y Stepper - Motor M4 (Primary Y)
########################################

[stepper_y]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
endstop_pin: ^PF2
homing_speed: 60
homing_retract_dist: 10.0

########################################
# Y1 Stepper - Motor M5 (Secondary Y)
########################################

[stepper_y1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
endstop_pin: ^PF2

########################################
# Z Stepper - Motor M3
########################################

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
endstop_pin: ^PF1
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 10

########################################
# Heater Bed
########################################

[heater_bed]
heater_pin: PA4
sensor_pin: PB1
sensor_type: ATC Semitec 104GT-2
control: watermark
min_temp: 0
max_temp: 150

# The 600x600 bed gains temperature slowly, especially above 80C -
# Klipper's default check (2C gain per 60s window) can false-trigger
# "Heater heater_bed not heating at expected rate" mid-approach.
# Relaxed like the pellet heaters; a dead/shorted thermistor still
# faults, just with more patience.
[verify_heater heater_bed]
max_error: 240
check_gain_time: 120
hysteresis: 10
heating_gain: 1

########################################
# Probe and ABL
#
# Bed-side probe. ONLY THE PELLET NOZZLE TRIGGERS IT - confirmed on
# hardware. G29 therefore refuses to run in filament mode rather than
# driving the TD-01 into the bed with no trigger.
########################################

[probe]
pin: PD8
x_offset: 0
y_offset: 0
#z_offset: -0.55  # IMPORTANT: z_offset is managed by SAVE_CONFIG - do not set here!
sample_retract_dist: 2.0
speed: 4
lift_speed: 10
samples_tolerance: 0.05
samples: 1
samples_result: average
samples_tolerance_retries: 8

########################################
# Host Temperature Monitoring
########################################

[temperature_sensor CM4]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

########################################
# G-Code Arc Support
# Smoother curves = steadier flow for pellet extrusion
########################################

[gcode_arcs]
resolution: 0.5    # Balanced arc interpolation - reduces MCU load vs 0.1

########################################
# Console Responses
########################################

[respond]
default_type: echo

[pause_resume]

########################################
# Startup
########################################

[delayed_gcode STARTUP]
initial_duration: 1
gcode:
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    RESPOND TYPE=echo MSG="Penrose 600 Hybrid ready - {m.mode|upper} extruder"
    # SET_VELOCITY_LIMIT is runtime-only state and reverts to the
    # [printer] section values on every restart, so re-apply the mode's
    # limits here. Also announces the mode to the touchscreen, which
    # parses the "EXTRUDER_MODE:" prefix (websocket_client.py).
    _EXTRUDER_MODE_LIMITS
    _APPLY_HEAD_OFFSET
    RESPOND TYPE=echo MSG="EXTRUDER_MODE:{m.mode|upper}"

########################################
# Extruder Mode
#
# The mode is now a CONFIG-LEVEL property: it is decided by which
# MODE_*.cfg printer.cfg includes, not by a runtime variable. These
# macros report and guard it; the actual switch is performed by the
# touchscreen (Material/Nozzle screen), which rewrites the include,
# swaps the SAVE_CONFIG calibration block and restarts Klipper.
########################################

[gcode_macro _EXTRUDER_MODE_LIMITS]
description: Apply the active mode's motion limits
gcode:
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={m.square_corner_velocity} MINIMUM_CRUISE_RATIO=0.5

[gcode_macro _APPLY_HEAD_OFFSET]
description: Re-apply the filament head's XYZ offset. MUST run after every home.
gcode:
    # WHY THIS EXISTS
    # The two heads are not mounted at the same point on their carriages.
    # Under the old IDEX config that was corrected by SET_GCODE_OFFSET
    # every time T1 was activated, using tool_offset_x/y/z from
    # variables.cfg (written by the IDEX XY calibration wizard and the
    # manual Z tool-offset wizard).
    #
    # In the config-swap model there is no tool activation to hang that
    # on - so without this macro a filament print would be shifted by
    # the head offset in X and Y. The pellet head is the XY reference and
    # takes a zero offset; only filament mode is corrected.
    #
    # Z IS DELIBERATELY NOT PART OF THIS. Each mode owns its own
    # [probe] z_offset (see the Z ZERO note in this file's header), so
    # applying tool_offset_z here as well would correct a machine
    # migrated from IDEX - which carries a real tool_offset_z from the
    # old T1 wizards - twice over. Only babystep rides along in Z.
    #
    # homing_override clears gcode offsets, so this must be re-applied
    # after EVERY home - see the end of [homing_override].
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% set v = printer.save_variables.variables %}
    {% set baby = v.babystep_z|default(0.0)|float %}
    {% if m.mode == 'filament' %}
        SET_GCODE_OFFSET X={v.tool_offset_x|default(0)} Y={v.tool_offset_y|default(0)} Z={baby}
    {% else %}
        SET_GCODE_OFFSET X=0 Y=0 Z={baby}
    {% endif %}

[gcode_macro SET_HEAD_OFFSET]
description: Set the filament head's offset from the pellet head. X= Y= Z= in mm, persisted.
gcode:
    # The IDEX XY/camera calibration wizards used M605 COPY/MIRROR, which
    # do not exist on a single-carriage config, so they are hidden on this
    # machine. This is the supported way to set the head offset instead.
    #
    # On a machine migrated from the IDEX configuration the existing
    # tool_offset_* values in variables.cfg are already correct and carry
    # over untouched - you only need this when commissioning a new head or
    # correcting a measured error.
    #
    # Measure: print a small single-wall square in PELLET mode, then the
    # same file in FILAMENT mode, and measure how far the second is
    # displaced. Enter that displacement here.
    {% set v = printer.save_variables.variables %}
    {% if params.X is defined %}
        SAVE_VARIABLE VARIABLE=tool_offset_x VALUE={params.X|float}
    {% endif %}
    {% if params.Y is defined %}
        SAVE_VARIABLE VARIABLE=tool_offset_y VALUE={params.Y|float}
    {% endif %}
    {% if params.Z is defined %}
        # Z is no longer applied from here - it belongs to the active
        # mode's [probe] z_offset. Stored so an IDEX-migrated value is not
        # thrown away, but say plainly that it does nothing.
        SAVE_VARIABLE VARIABLE=tool_offset_z VALUE={params.Z|float}
        RESPOND TYPE=error MSG="SET_HEAD_OFFSET Z stored but NOT applied - each head keeps its own Z. Use M851, the Control screen Z +/- buttons, or Z_ZERO_CALIBRATE instead."
    {% endif %}
    _APPLY_HEAD_OFFSET
    RESPOND TYPE=echo MSG="Head offset X={params.X|default(v.tool_offset_x|default(0))} Y={params.Y|default(v.tool_offset_y|default(0))} - XY only, applied in FILAMENT mode. Z is per mode, see M851."

[gcode_macro QUERY_HEAD_OFFSET]
description: Report the stored head offset and the whole Z zero chain
gcode:
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% set v = printer.save_variables.variables %}
    {% set p = printer.configfile.config.probe.z_offset|float %}
    RESPOND TYPE=echo MSG="Head offset (XY only) X={v.tool_offset_x|default(0)} Y={v.tool_offset_y|default(0)}"
    RESPOND TYPE=echo MSG="Z zero for the ACTIVE mode ({m.mode|upper}): probe z_offset {p} - stored per mode, the other head has its own"
    RESPOND TYPE=echo MSG="Stored tool_offset_z {v.tool_offset_z|default(0.0)} is NOT applied (kept from the IDEX configuration only)"
    RESPOND TYPE=echo MSG="Live gcode offset X={printer.gcode_move.homing_origin.x} Y={printer.gcode_move.homing_origin.y} Z={printer.gcode_move.homing_origin.z}"

[gcode_macro Z_ZERO_CALIBRATE]
description: Probe-free first-layer touch-off for the ACTIVE head. Paper test at bed centre.
gcode:
    # WHY A MANUAL TOUCH-OFF
    # The bed probe is triggered by the pellet nozzle only, so there is
    # no automated way to find Z zero for the filament head. This puts
    # the active nozzle at the machine's current believed Z=0 over the
    # centre of the bed, so the operator can feel the gap with a sheet
    # of paper and correct it with the Control screen's Z +/- buttons.
    #
    # Those buttons send M290, which folds the adjustment into the ACTIVE
    # mode's own [probe] z_offset and saves it 5s after the last press -
    # so there is no separate save step, and the result survives homing
    # and restarts. It applies to this head only; the other head keeps
    # its own z_offset in its saveconfig_<mode>.cfg.
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% set pv = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.idle_timeout.state == "Printing" or printer['pause_resume'].is_paused|int == 1 %}
        RESPOND TYPE=error MSG="Z_ZERO_CALIBRATE: the printer is busy. Finish or cancel the print first."
    {% else %}
        G28
        # The mesh MUST be off. With it loaded, the bed's local deviation
        # at the centre point is folded into whatever gap the operator
        # feels, and the number they dial in is then wrong everywhere else.
        BED_MESH_CLEAR
        G90
        G1 Z10 F600
        G1 X{(pv.bed_x_min|float + pv.bed_x_max|float) / 2} Y{(pv.bed_y_min|float + pv.bed_y_max|float) / 2} F9000
        G1 Z0 F300
        M400
        RESPOND TYPE=echo MSG="Z zero touch-off ({m.mode|upper} head) - the nozzle is at the current Z=0 over bed centre."
        RESPOND TYPE=echo MSG="Slide a sheet of paper under the nozzle and use the Z +/- buttons on the Control screen until it just drags. Every press is saved for THIS extruder automatically."
        RESPOND TYPE=echo MSG="When it feels right: G29 to re-probe and re-load the mesh (pellet mode), or M420 S1 to re-load the stored mesh (filament mode)."
    {% endif %}

[gcode_macro QUERY_EXTRUDER_MODE]
description: Report which extruder mode this configuration is
gcode:
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    RESPOND TYPE=echo MSG="EXTRUDER_MODE:{m.mode|upper}"
    {% if printer["heater_generic H0"] is defined %}
        RESPOND TYPE=echo MSG="Heaters: nozzle + H0 barrel"
    {% else %}
        RESPOND TYPE=echo MSG="Heaters: nozzle only"
    {% endif %}

[gcode_macro ASSERT_EXTRUDER_MODE]
description: Slicer-profile guard. MODE=PELLET|FILAMENT - cancels the print when the sliced file does not match the machine's extruder mode.
gcode:
    {% set want = params.MODE|default('')|lower %}
    {% set have = printer["gcode_macro EXTRUDER_MODE_VARIABLES"].mode %}
    {% if want not in ['pellet', 'filament'] %}
        RESPOND TYPE=error MSG="ASSERT_EXTRUDER_MODE: MODE must be PELLET or FILAMENT"
    {% elif want != have %}
        RESPOND TYPE=error MSG="Extruder mode mismatch: file is sliced for {want|upper} but the printer is configured for {have|upper}. Cancelling print - change the Extruder Type on the Material/Nozzle screen and reprint."
        CANCEL_PRINT
    {% else %}
        RESPOND TYPE=echo MSG="Extruder mode check OK ({have|upper})"
    {% endif %}

[gcode_macro SET_EXTRUDER_MODE]
description: Deprecated - switching modes now swaps config files. Use the Material/Nozzle screen.
gcode:
    RESPOND TYPE=error MSG="SET_EXTRUDER_MODE is no longer supported: the extruder mode is now a config file (MODE_PELLET.cfg / MODE_FILAMENT.cfg). Change it on the Material/Nozzle screen, which swaps the config and restarts Klipper."

[gcode_macro PREPARE_EXTRUDER_MODE_SWITCH]
description: Leave the machine in a safe state for a config swap. Run by the UI before rewriting printer.cfg.
gcode:
    {% if printer.idle_timeout.state == "Printing" or printer['pause_resume'].is_paused|int == 1 %}
        RESPOND TYPE=error MSG="Cannot switch extruder mode while the printer is busy. Finish or cancel the print first."
    {% else %}
        RESPOND TYPE=echo MSG="Preparing extruder mode switch - homing both carriages"
        # BOTH carriages must be on their own endstops before the swap,
        # and that takes TWO homing operations, because they live in
        # different worlds:
        #
        #   G28                     homes the kinematic axes - which is
        #                           only the PRINTING carriage, plus Y/Z.
        #   _HOME_PARKED_CARRIAGE   homes the OTHER carriage, which is a
        #                           manual_stepper and invisible to G28.
        #
        # Doing only the first would leave the incoming carriage at an
        # assumed position: after the swap it becomes [stepper_x] and
        # Klipper would have no idea where it actually is.
        #
        # G28 leaves X at position_endstop (-85 pellet / 640 filament).
        # Do NOT add a move to axis_minimum here: in filament mode that
        # is X=0, mid-rail, which would park the filament carriage
        # directly in the pellet head's print area.
        G28
        _HOME_PARKED_CARRIAGE
        # Both heaters off - the mode taking over may not have an H0 at
        # all, and a heater left on would have no readout anywhere.
        M104 S0
        {% if printer["heater_generic H0"] is defined %}
            M104 H0 S0
        {% endif %}
        M107
        M400
        # Flush live calibration (PID, probe offset, mesh) to the
        # SAVE_CONFIG block so the UI can split and store it per mode.
        SAVE_CONFIG NO_RESTART=1
        RESPOND TYPE=echo MSG="EXTRUDER_MODE_SWITCH_READY"
    {% endif %}

########################################
# Heater Management
#
# H0 exists in PELLET MODE ONLY. Every H0 path is guarded so the same
# macro text works in both configs.
########################################

[gcode_macro M104]
rename_existing: M104.1
description: Override "M104" - S sets the nozzle, H0 sets the pellet barrel heater
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set sec = params.H|default(-1)|int %}
    {% if sec == 0 %}
        {% if printer["heater_generic H0"] is defined %}
            SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
        {% else %}
            RESPOND TYPE=error MSG="M104 H0 ignored: no barrel heater in FILAMENT mode"
        {% endif %}
    {% elif sec >= 1 %}
        RESPOND TYPE=error MSG="M104 H{sec} ignored: this machine has only H0 (pellet mode)"
    {% else %}
        # T parameter is accepted and ignored - there is only one tool
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Override "M109" - as M104 but waits for temperature
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% set sec = params.H|default(-1)|int %}
    {% if sec == 0 %}
        {% if printer["heater_generic H0"] is defined %}
            SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
            TEMPERATURE_WAIT SENSOR="heater_generic H0" MINIMUM={temp - 2}
        {% else %}
            RESPOND TYPE=error MSG="M109 H0 ignored: no barrel heater in FILAMENT mode"
        {% endif %}
    {% elif sec >= 1 %}
        RESPOND TYPE=error MSG="M109 H{sec} ignored: this machine has only H0 (pellet mode)"
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp}
    {% endif %}

########################################
# Part Cooling Fans
# Fan names come from the mode file, so the same macro drives the two
# mainboard fans in pellet mode and the single toolhead fan in filament
# mode. P is accepted and ignored (single tool).
########################################

[gcode_macro M106]
description: Override "M106" - drives the active mode's part cooling fan(s)
gcode:
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% set fan_speed = (params.S|default(0)|float / 255.0)|round(2) %}
    {% if m.fan_0 %}SET_FAN_SPEED FAN={m.fan_0} SPEED={fan_speed}{% endif %}
    {% if m.fan_1 %}SET_FAN_SPEED FAN={m.fan_1} SPEED={fan_speed}{% endif %}

[gcode_macro M107]
description: Override "M107" - all part cooling fans off
gcode:
    M106 S0

########################################
# Purge / Clean positions
# Uses the PRINTER_VARIABLES entry matching the active carriage.
########################################

[gcode_macro PURGE_POSITION]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=echo MSG="PURGE_POSITION skipped (axes not homed)"
    {% else %}
        G90
        {% if m.mode == 'filament' %}
            G1 X{printer_var.tool1_pause_position_x} Y{printer_var.tool1_pause_position_y} F9000
        {% else %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F9000
        {% endif %}
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=echo MSG="CLEAN_NOZZLE skipped (axes not homed)"
    {% else %}
        G90
        {% if m.mode == 'filament' %}
            {% set px = printer_var.tool1_pause_position_x|float %}
            {% set py = printer_var.tool1_pause_position_y|float %}
            {% set wipe = -40 %}
        {% else %}
            {% set px = printer_var.tool0_pause_position_x|float %}
            {% set py = printer_var.tool0_pause_position_y|float %}
            {% set wipe = 40 %}
        {% endif %}
        G1 X{px} Y{py} F7000
        G1 X{px + wipe} F7000
        G1 X{px}
        G1 X{px + wipe}
        G1 X{px}
    {% endif %}

########################################
# Bed Mesh Calibration
#
# PELLET MODE ONLY. The bed probe is triggered by the pellet nozzle;
# the TD-01 cannot trigger it (confirmed on hardware), so probing in
# filament mode would drive the head into the bed with no trigger.
# Level in pellet mode - the resulting mesh is carried across the mode
# swap in the shared part of the SAVE_CONFIG block and loaded by
# M420 S1 in either mode.
########################################

[gcode_macro G29]
gcode:
    {% set m = printer["gcode_macro EXTRUDER_MODE_VARIABLES"] %}
    {% if m.mode != 'pellet' %}
        RESPOND TYPE=error MSG="G29 skipped: bed levelling requires PELLET mode (only the pellet nozzle triggers the bed probe). The saved mesh from pellet mode is already loaded for this print."
        # Deliberately NOT an error/cancel: a filament print whose start
        # gcode calls G29 should carry on with the stored mesh rather
        # than abort. M420 S1 below re-asserts it.
        M420 S1
    {% else %}
        BED_MESH_CLEAR
        CLEAR_PAUSE
        # Pre-probe nozzle heat: conditions the tip and normalises
        # thermal expansion before a contact probe.
        {% if printer.extruder.temperature|float <= 150 %}
            M109 S150
        {% endif %}
        BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE=p1
        SAVE_CONFIG NO_RESTART=1
        M420 S1
    {% endif %}

########################################
# Homing
#
# Single carriage - no IDEX unsync/park dance. The other carriage is
# held by [manual_stepper] in the mode file and is not homed here.
########################################

[homing_override]
gcode:
    BED_MESH_CLEAR
    SAVE_VARIABLE VARIABLE=babystep_z VALUE=0.0
    SAVE_CONFIG NO_RESTART=1
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% if params.X and not params.Y and not params.Z %}
        G28 X0
    {% endif %}
    {% if not params.X and params.Y and not params.Z %}
        G28 Y0
    {% endif %}
    {% if not params.X and not params.Y and params.Z %}
        G28 Z0
        G91
        G0 Z-4
        G90
    {% endif %}
    {% if params.Y and params.X and not params.Z %}
        G28 Y0
        G28 X
    {% endif %}
    {% if not params.X and not params.Y and not params.Z %}
        G28 Z0
        G28 Y0
        G28 X0
        G91
        G0 Z-4
        G90
    {% endif %}
    {% if params.X and params.Y and params.Z %}
        G28 Z0
        G28 Y0
        G28 X0
        G91
        G0 Z-4
        G90
    {% endif %}
    # Re-apply the head offset that SET_GCODE_OFFSET X=0 Y=0 Z=0 above
    # just cleared. Without this every filament print lands shifted by
    # the head mounting offset - in Z as well as X/Y.
    _APPLY_HEAD_OFFSET
    # Put the stored mesh back. BED_MESH_CLEAR at the top of this macro is
    # required (homing and probing must not be mesh-corrected), but leaving
    # it cleared meant a plain G28 silently dropped bed compensation until
    # something called G29 or M420 S1. On a 600x600 bed that is the
    # difference between a first layer that sticks and one that does not.
    # Harmless when no mesh is stored - M420 S1 just reports that.
    M420 S1

########################################
# Pause / Resume
# Single extruder: one nozzle temperature to save and restore, plus the
# H0 barrel target in pellet mode.
########################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(2.5)|float %}
    {% set r = params.R|default(2.0)|float %}
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target|default(0)|int}
        {% if printer["heater_generic H0"] is defined %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=btemp VALUE={printer["heater_generic H0"].target|default(0)|int}
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=btemp VALUE=0
        {% endif %}

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE

        {% if printer.toolhead.homed_axes == "xyz" %}
            G91
            G1 E-{r} F600
            G90
            {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
                G91
                G1 Z{z} F900
                G90
            {% else %}
                RESPOND TYPE=echo MSG="Pause zhop exceeds maximum Z height."
            {% endif %}
        {% else %}
            RESPOND TYPE=echo MSG="Pause movement skipped (axes not homed)"
            G91
            G1 E-{r} F600
            G90
        {% endif %}
        PURGE_POSITION
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_etemp: 0
variable_btemp: 0
gcode:
    {% set e = params.E|default(20)|float %}
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        # Restore the barrel first (slowest to recover), then the nozzle
        {% if btemp > 0 and printer["heater_generic H0"] is defined %}
            M104 H0 S{btemp|int}
        {% endif %}
        {% if etemp > 0 %}
            RESPOND TYPE=echo MSG="Reheating nozzle .."
            M109 S{etemp|int}
        {% endif %}
        {% if btemp > 0 and printer["heater_generic H0"] is defined %}
            RESPOND TYPE=echo MSG="Reheating H0 barrel .."
            M109 H0 S{btemp|int}
        {% endif %}
        PURGE_POSITION
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% if printer.extruder.temperature|float >= min_temp %}
            G91
            G1 E{e} F600
            G90
        {% else %}
            RESPOND TYPE=echo MSG="Prime skipped (nozzle below minimum extrude temperature)"
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150
        BASE_RESUME
    {% endif %}
