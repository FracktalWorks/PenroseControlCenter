########################################
# BASE_PENROSE_HYBRID.cfg
# Hardware Configuration for Penrose Hybrid IDEX Printers
# Dual X carriages, Dual Y motors
# T0 (Left/Primary): Pellet auger extruder - M6 external driver,
#   H0 barrel heater, mainboard part fans
# T1 (Right/Dual Carriage): Filament extruder - TD-01 CAN toolhead
#   (canbus alias toolhead0) + redundant side motor on M7 (TMC5160)
#
# Only one nozzle prints at a time. IDEX COPY/MIRROR modes are
# blocked (M605 S2/S3 -> error); the second carriage exists so the
# operator can switch between pellet and filament printing on the
# fly with T0/T1 instead of physically swapping the extruder head.
#
# CAN NOTE: [mcu toolhead0] is defined in printer.cfg (MCU Config
# section) so the UUID is preserved across printer switches and
# firmware updates. Selecting a HYBRID printer in the Printer Setup
# UI auto-uncomments it.
#   Find UUID: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
#
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# X Stepper - Motor M1 (Primary Carriage / T0)
# Cartesian IDEX configuration
########################################

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3µs - safe margin over DM542T 2.5µs minimum
endstop_pin: ^PF0
homing_speed: 60
homing_retract_dist: 10.0

########################################
# X Dual Carriage - Motor M2 (Secondary Carriage / T1)
# IDEX second toolhead
########################################

[dual_carriage]
axis: x
safe_distance: 60
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3µs - safe margin over DM542T 2.5µs minimum
endstop_pin: ^PF3
homing_speed: 60
homing_retract_dist: 10.0

########################################
# Y Stepper - Motor M4 (Primary Y)
########################################

[stepper_y]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3µs - safe margin over DM542T 2.5µs minimum
endstop_pin: ^PF2
homing_speed: 60
homing_retract_dist: 10.0

########################################
# Y1 Stepper - Motor M5 (Secondary Y)
########################################

[stepper_y1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3µs - safe margin over DM542T 2.5µs minimum
endstop_pin: ^PF2

########################################
# Z Stepper - Motor M3
########################################

[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3µs - safe margin over DM542T 2.5µs minimum
endstop_pin: ^PF1
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 10

########################################
# Extruder 0 - Motor M6 (Primary Toolhead / Left)
# Penrose Pellet Auger Configuration
########################################

[extruder]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 2
rotation_distance: 35.0  # Calibrated: 28.0 / 0.8 (was 80% flow in slicer)
step_pulse_duration: 0.000005  # 3µs - safe margin over DM542T 2.5µs minimum
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA1
max_power: 0.5  # Limit AC heater to 50% power
sensor_pin: PC5
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_extrude_temp: -100
max_extrude_only_distance: 5000
max_extrude_cross_section: 8.0
min_temp: -200
max_temp: 300
# Pellet auger motion limits
max_extrude_only_velocity: 25
max_extrude_only_accel: 400
instantaneous_corner_velocity: 1.0
pressure_advance: 0
pressure_advance_smooth_time: 0.06

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 40
heating_gain: 3

########################################
# Extruder 1 - CAN Toolhead Drive Motor (Dual Carriage / Right)
# Filament extruder on TD-01 CAN toolhead board (RP2040 + TMC2209)
# rotation_distance matches FracktalWorks Dragon TD-01
########################################

[extruder1]
step_pin: toolhead0: gpio24
dir_pin: !toolhead0: gpio21
enable_pin: !toolhead0: gpio28
microsteps: 8
rotation_distance: 4.7158  # Matches Dragon TD-01 toolhead (FracktalWorks/ControlCenter)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead0: gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: toolhead0: gpio26
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960  # Retune with PID_CALIBRATE HEATER=extruder1 on hardware
min_temp: -130
max_temp: 310
min_extrude_temp: -130  # Ported from Hybrid-Penrose-600; review before production
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 4.0
pressure_advance: 0.05
pressure_advance_smooth_time: 0.04

[verify_heater extruder1]
max_error: 120
check_gain_time: 20
hysteresis: 40
heating_gain: 6

[tmc2209 extruder1]
uart_pin: toolhead0: gpio25
run_current: 0.850

########################################
# extruder_side - Redundant Side Extruder Motor for T1
# Wired to the M7 stepper slot on the BTT Manta M8P V2.0 mainboard
# (M6 is used by the T0 pellet auger; M7 is dedicated to the
# filament side so both extruders coexist on this machine).
# Assigned to [extruder1] so Klipper keeps it in lock-step with the
# primary CAN toolhead drive motor.
# rotation_distance and TMC settings match Dragon extruder_side0
# (FracktalWorks/ControlCenter).
########################################

[extruder_stepper extruder_side]
extruder: extruder1
step_pin: PD4               # M8P V2.0 Motor7 STEP
dir_pin: PD3                # M8P V2.0 Motor7 DIR
enable_pin: !PD6            # M8P V2.0 Motor7 EN
microsteps: 16
rotation_distance: 7.710   # Matches Dragon extruder_side0 (FracktalWorks/ControlCenter)

[tmc5160 extruder_stepper extruder_side]
cs_pin: PD5                 # M8P V2.0 Motor7 CS (SPI)
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
interpolate: False
run_current: 1.00
hold_current: 0.40
sense_resistor: 0.075

########################################
# Heater Bed
########################################

[heater_bed]
heater_pin: PA4
sensor_pin: PB1
sensor_type: ATC Semitec 104GT-2
control: watermark
min_temp: 0
max_temp: 150

########################################
# H0 - Secondary Heater for T0 (Pellet Barrel)
# NOTE: There is no H1 on the Hybrid IDEX - the filament head has
# no barrel heater. PA3/PC4 (former H1 heater/sensor) are unused.
########################################

[heater_generic H0]
gcode_id: H0
heater_pin: PA0
max_power: 0.5  # Limit AC heater to 50% power
sensor_pin: PB0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -200
max_temp: 480

[verify_heater H0]
max_error: 240
check_gain_time: 60
hysteresis: 40
heating_gain: 3

########################################
# Probe and ABL
########################################

[probe]
pin: PD8
x_offset: 0
y_offset: 0
#z_offset: -0.55  # IMPORTANT: z_offset is managed by SAVE_CONFIG - do not set here!
sample_retract_dist: 2.0
speed: 4
lift_speed: 10
samples_tolerance: 0.05
samples: 1
samples_result: average
samples_tolerance_retries: 8

########################################
# Host Temperature Monitoring
########################################

[temperature_sensor CM4]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

########################################
# Part Cooling Fans
# T0 (pellet): two mainboard fans
# T1 (filament): one fan on the CAN toolhead
# (former extruder1_CF_0/PF6 and extruder1_CF_1/PF8 are unused)
########################################

[fan_generic extruder_CF_0]
pin: PF7

[fan_generic extruder_CF_1]
pin: PF9

[fan_generic extruder_CF]
pin: toolhead0: gpio10

########################################
# Always-On Hotend Cooling Fan for T1 (on CAN toolhead)
########################################

[heater_fan extruder_AOF]
pin: toolhead0: gpio8
heater: extruder1
heater_temp: 50.0

########################################
# Toolhead LED (T1 CAN toolhead)
# Single-channel green PWM LED, turned on at STARTUP below.
########################################

[led toolhead0]
green_pin: toolhead0: gpio2

########################################
# ADXL345 IMU (on T1 CAN toolhead - for input shaping)
# Run SHAPER_CALIBRATE with T1 active so the accelerometer moves
# with the carriage being excited.
########################################

[adxl345 toolhead0]
cs_pin: toolhead0: gpio13
spi_software_sclk_pin: toolhead0: gpio14
spi_software_mosi_pin: toolhead0: gpio15
spi_software_miso_pin: toolhead0: gpio12
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345 toolhead0
probe_points: 300, 300, 20

########################################
# Filament Runout Sensor (T1)
# PLACEHOLDER(PINS-TBD): switch_pin below is a placeholder - the
# real right-side sensor wiring will be supplied later. DO NOT use
# PF3 (dual_carriage X endstop on this IDEX machine - the hybrid
# single-nozzle branch used PF3, which is NOT available here).
# pause_on_runout stays False until the real pin is confirmed so a
# floating input cannot pause a print; flip it to True in the
# pin-confirmation commit.
########################################

[filament_switch_sensor extruder_runout]
switch_pin: ^PF5  # PLACEHOLDER(PINS-TBD): confirm actual runout switch pin
pause_on_runout: False  # PLACEHOLDER(PINS-TBD): set True once pin confirmed
runout_gcode:
    M117 Filament runout detected
    RESPOND TYPE=echo MSG="Filament Runout T1"
insert_gcode:
    M117 Filament inserted

########################################
# Filament Flow / Motion Sensor (T1)
# Pulse-counting motion sensor (e.g. BTT Smart Filament Sensor) that
# verifies filament is actually moving while extruder1 is commanded
# to extrude. Adjust 'detection_length' to match your sensor.
# PLACEHOLDER(PINS-TBD): PC15 (M6-STOP) was freed by removing the
# right pellet level sensor and matches the hybrid single-nozzle
# wiring - confirm against the actual harness.
########################################

[filament_motion_sensor extruder_flow]
switch_pin: ^PC15  # PLACEHOLDER(PINS-TBD): confirm actual flow sensor pin
detection_length: 7.0        # mm of expected extrusion per pulse - TUNE for your sensor
extruder: extruder1
pause_on_runout: False  # PLACEHOLDER(PINS-TBD): set True once pin confirmed
runout_gcode:
    M117 Filament flow stalled
    RESPOND TYPE=echo MSG="Filament Flow Stall T1"
insert_gcode:
    M117 Filament flow resumed

########################################
# G-Code Arc Support
# Smoother curves = steadier flow for pellet extrusion
########################################

[gcode_arcs]
resolution: 0.5    # Balanced arc interpolation - reduces MCU load vs 0.1

########################################
# IDEX Configuration
# Klipper v0.12.0+ IDEX Config
########################################

[respond]
default_type: echo

########################################
# Misc.
########################################

[delayed_gcode STARTUP]
initial_duration: 1
gcode:
    RESPOND TYPE=echo MSG="Penrose Hybrid IDEX Ready (T0: Pellet / T1: Filament)"
    # Belt-and-braces: the 'extruder: extruder1' line in
    # [extruder_stepper extruder_side] sets this at config-parse
    # time; re-sync in case a prior session left it detached.
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side MOTION_QUEUE=extruder1
    SET_FILAMENT_SENSOR SENSOR=extruder_runout ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=extruder_flow ENABLE=1
    SET_LED LED=toolhead0 GREEN=1.0

[gcode_macro IDEX_STATUS]
gcode:
    RESPOND MSG="{printer.dual_carriage.carriage_0}"
    RESPOND MSG="{printer.dual_carriage.carriage_1}"

[gcode_macro PARK_TOOL]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.dual_carriage is defined %}
        {% if 'x' not in printer.toolhead.homed_axes %}
            RESPOND TYPE=echo MSG="PARK_TOOL skipped (X not homed)"
        {% else %}
            SET_GCODE_OFFSET X=0 Y=0 Z=0
            G90
            {% if printer.toolhead.extruder == 'extruder' %}
                {% set XPOS = printer.configfile.config.stepper_x.position_min|float %}
                G1 X{XPOS} F{printer_var.feedrate}
            {% elif (printer.toolhead.extruder) == 'extruder1' %}
                {% set XPOS = printer.configfile.config.dual_carriage.position_max|float %}
                G1 X{XPOS} F{printer_var.feedrate}
            {% else %}
                RESPOND TYPE=error MSG="Unknown extruder: {printer.toolhead.extruder}"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro PURGE_POSITION]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.dual_carriage is not defined %}
        RESPOND TYPE=echo MSG="PURGE_POSITION skipped (no dual_carriage)"
    {% elif printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=echo MSG="PURGE_POSITION skipped (axes not homed)"
    {% else %}
        G90
        {% if printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "INACTIVE" %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F9000
            RESPOND TYPE=echo MSG="T0 PURGE POSITION"
        {% elif printer.dual_carriage.carriage_0 == "INACTIVE" and printer.dual_carriage.carriage_1 == "PRIMARY" %}
            G1 X{printer_var.tool1_pause_position_x} Y{printer_var.tool1_pause_position_y} F9000
            RESPOND TYPE=echo MSG="T1 PURGE POSITION"
        {% else %}
            RESPOND TYPE=echo MSG="PURGE_POSITION: No matching carriage state"
        {% endif %}
    {% endif %}

########################################
# T0/T1 Tool Switching
########################################

[gcode_macro _IDEX_SAFE_Z_HOP]
description: Internal helper to perform a ceiling-safe Z hop up or down
variable_last: 0
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set dir = params.DIR|default('UP')|upper %}
    {% set hop = params.HOP|default(printer_var.z_hop)|float %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        RESPOND TYPE=echo MSG="_IDEX_SAFE_Z_HOP skipped (axes not homed)"
    {% else %}
        {% if dir == 'UP' %}
            {% if hop > 0 %}
                {% set max_z = printer.toolhead.axis_maximum.z|float %}
                {% set cur_z = printer.toolhead.position.z|float %}
                {% set lift = hop if cur_z < (max_z - hop) else (max_z - cur_z) %}
                {% if lift > 0 %}
                    G91
                    G1 Z{lift} F900
                    G90
                    SET_GCODE_VARIABLE MACRO=_IDEX_SAFE_Z_HOP VARIABLE=last VALUE={lift}
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_IDEX_SAFE_Z_HOP VARIABLE=last VALUE=0
                {% endif %}
            {% endif %}
        {% elif dir == 'DOWN' %}
            {% set lift = printer["gcode_macro _IDEX_SAFE_Z_HOP"].last|default(0)|float %}
            {% if lift > 0 %}
                G91
                G1 Z-{lift} F900
                G90
                SET_GCODE_VARIABLE MACRO=_IDEX_SAFE_Z_HOP VARIABLE=last VALUE=0
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _IDEX_SWITCH_TOOL]
description: Internal helper to switch active IDEX tool with optional autopark/z-hop
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set target = params.TOOL|int %}
    {% if printer.dual_carriage is not defined %}
        RESPOND TYPE=echo MSG="IDEX not enabled"
    {% else %}
        {% set c0 = printer.dual_carriage.carriage_0 %}
        {% set c1 = printer.dual_carriage.carriage_1 %}
        {% set current_tool = 0 if (c0 == 'PRIMARY' and printer.toolhead.extruder == 'extruder') else (1 if (c1 == 'PRIMARY' and printer.toolhead.extruder == 'extruder1') else -1) %}
        {% if current_tool == target %}
            RESPOND TYPE=echo MSG="Tool T{target} already active"
        {% else %}
            M400
            {% set do_autopark = (printer_var.autopark|int == 1 and printer.toolhead.homed_axes == 'xyz') %}

            # Check position bounds for autopark
            {% set can_autopark = true %}
            {% if do_autopark %}
                {% if target == 0 and printer.gcode_move.gcode_position.x > printer_var.bed_x_max|float %}
                    {% set can_autopark = false %}
                {% elif target == 1 and printer.gcode_move.gcode_position.x < printer_var.bed_x_min|float %}
                    {% set can_autopark = false %}
                {% endif %}
            {% endif %}

            {% if do_autopark and can_autopark %}
                _IDEX_SAFE_Z_HOP DIR=UP
                SAVE_GCODE_STATE NAME=toolhead_state
                PARK_TOOL
            {% endif %}

            {% if target == 0 %}
                ACTIVATE_EXTRUDER EXTRUDER=extruder
                SET_DUAL_CARRIAGE CARRIAGE=0
                RESPOND TYPE=echo MSG="Active Extruder: 0"
            {% else %}
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                SET_DUAL_CARRIAGE CARRIAGE=1
                RESPOND TYPE=echo MSG="Active Extruder: 1"
            {% endif %}

            {% if do_autopark and can_autopark %}
                RESTORE_GCODE_STATE NAME=toolhead_state MOVE=1 MOVE_SPEED={printer_var.movespeed}
                _IDEX_SAFE_Z_HOP DIR=DOWN
            {% endif %}

            # Apply tool offsets AFTER restoring state
            {% if target == 0 %}
                {% if printer.gcode_move.gcode_position.x > printer_var.bed_x_max|float %}
                    SET_GCODE_OFFSET X=0 Y=0 Z={printer.save_variables.variables.babystep_z|default(0.0)}
                {% else %}
                    SET_GCODE_OFFSET X=0 Y=0 Z={printer.save_variables.variables.babystep_z|default(0.0)} MOVE=1 MOVE_SPEED={printer_var.movespeed}
                {% endif %}
            {% else %}
                {% if printer.gcode_move.gcode_position.x < printer_var.bed_x_min|float %}
                    SET_GCODE_OFFSET X={printer.save_variables.variables.tool_offset_x|default(0)} Y={printer.save_variables.variables.tool_offset_y|default(0)} Z={printer.save_variables.variables.tool_offset_z|default(0) + printer.save_variables.variables.babystep_z|default(0.0)}
                {% else %}
                    SET_GCODE_OFFSET X={printer.save_variables.variables.tool_offset_x|default(0)} Y={printer.save_variables.variables.tool_offset_y|default(0)} Z={printer.save_variables.variables.tool_offset_z|default(0) + printer.save_variables.variables.babystep_z|default(0.0)} MOVE=1 MOVE_SPEED={printer_var.movespeed}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro T0]
description: Activate T0 (Pellet) in "FULL_CONTROL" or "AUTO-PARK"
gcode:
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_1 == 'PRIMARY' %}
        _IDEX_SWITCH_TOOL TOOL=0
    {% elif printer.dual_carriage is defined and printer.dual_carriage.carriage_0 == 'PRIMARY' %}
        RESPOND TYPE=echo MSG="T0 already active"
    {% endif %}

[gcode_macro T1]
description: Activate T1 (Filament) in "FULL_CONTROL" or "AUTO-PARK"
gcode:
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_0 == 'PRIMARY' %}
        _IDEX_SWITCH_TOOL TOOL=1
    {% elif printer.dual_carriage is defined and printer.dual_carriage.carriage_1 == 'PRIMARY' %}
        RESPOND TYPE=echo MSG="T1 already active"
    {% endif %}

########################################
# Temperature & Fans
########################################

## HYBRID IDEX : FAN MANAGEMENT
# T0 (pellet) has two mainboard fans, T1 (filament) has a single
# CAN toolhead fan. Empty fan-name variables are skipped.

[gcode_macro M106]
description: Override "M106" - P=0 routes to T0 pellet fans, P=1 to T1 toolhead fan.
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set raw_speed = params.S|default(0)|float %}
    {% set fan_speed = (raw_speed / 255.0)|round(2) %}
    {% if (params.P) is defined %}
        # Specific tool fan control: P=0 for T0 fans, P=1 for T1 fan
        {% if (params.P)|int == 0 %}
            {% if printer_var.fan0_0 %}SET_FAN_SPEED FAN={printer_var.fan0_0} SPEED={fan_speed}{% endif %}
            {% if printer_var.fan0_1 %}SET_FAN_SPEED FAN={printer_var.fan0_1} SPEED={fan_speed}{% endif %}
        {% else %}
            {% if printer_var.fan1_0 %}SET_FAN_SPEED FAN={printer_var.fan1_0} SPEED={fan_speed}{% endif %}
            {% if printer_var.fan1_1 %}SET_FAN_SPEED FAN={printer_var.fan1_1} SPEED={fan_speed}{% endif %}
        {% endif %}
    {% elif printer.dual_carriage is defined %}
        # Control all fans simultaneously
        {% if printer_var.fan0_0 %}SET_FAN_SPEED FAN={printer_var.fan0_0} SPEED={fan_speed}{% endif %}
        {% if printer_var.fan0_1 %}SET_FAN_SPEED FAN={printer_var.fan0_1} SPEED={fan_speed}{% endif %}
        {% if printer_var.fan1_0 %}SET_FAN_SPEED FAN={printer_var.fan1_0} SPEED={fan_speed}{% endif %}
        {% if printer_var.fan1_1 %}SET_FAN_SPEED FAN={printer_var.fan1_1} SPEED={fan_speed}{% endif %}
    {% endif %}

[gcode_macro M107]
description: Override "M107" to allow multiple extruders.
gcode:
    M106 S0

## HYBRID IDEX : HEATERS MANAGEMENT
# H0 = T0 pellet barrel heater. There is NO H1 on this machine
# (the filament head has no barrel heater) - M104/M109 H1 errors.

[gcode_macro M104]
rename_existing: M104.1
description: Override "M104" for Hybrid IDEX (T0 pellet / T1 filament).
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(-1)|int %}
    {% set sec = params.H|default(-1)|int %}

    # Handle secondary heater (H0 only - no H1 on Hybrid IDEX)
    {% if sec == 0 %}
        SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
    {% elif sec == 1 %}
        RESPOND TYPE=error MSG="M104 H1 ignored: no barrel heater on the T1 filament head (Hybrid IDEX)"
    {% elif tool == -1 %}
        M104.1 S{temp}
    {% else %}
        M104.1 T{tool} S{temp}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Override "M109" for Hybrid IDEX (T0 pellet / T1 filament).
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(-1)|int %}
    {% set sec = params.H|default(-1)|int %}

    # Handle secondary heater (H0 only - no H1 on Hybrid IDEX)
    {% if sec == 0 %}
        SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
        TEMPERATURE_WAIT SENSOR="heater_generic H0" MINIMUM={temp - 2}
    {% elif sec == 1 %}
        RESPOND TYPE=error MSG="M109 H1 ignored: no barrel heater on the T1 filament head (Hybrid IDEX)"
    {% elif tool == -1 %}
        SET_HEATER_TEMPERATURE HEATER={printer.toolhead.extruder} TARGET={temp}
        TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={temp - printer_var.offset_temp}
    {% else %}
        {% if params.T == '0' %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp}
        {% elif params.T == '1' %}
            SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp - printer_var.offset_temp}
        {% endif %}
    {% endif %}

########################################
# IDEX Modes
# COPY (S2) and MIRROR (S3) are NOT supported on the Hybrid IDEX:
# the pellet auger (T0) and filament extruder (T1) cannot print
# paired (different materials, flow rates and nozzle sizes).
# Only one nozzle prints at a time - use T0/T1 to switch.
########################################

[gcode_macro M605]
description: Set the dual-carriages mode (S0/S1 only on Hybrid IDEX)
gcode:
    {% set mode = params.S|default(1)|int %}
    {% if printer.dual_carriage is defined %}
        {% if mode == 0 or mode == 1 %}
            # S0: FULL_CONTROL autopark off, S1: FULL_CONTROL autopark on
            SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=autopark VALUE={1 if mode == 1 else 0}
            FULL_CONTROL
        {% elif mode == 2 or mode == 3 %}
            RESPOND TYPE=error MSG="M605 S{mode} ({'COPY' if mode == 2 else 'MIRROR'}) not supported on Penrose Hybrid IDEX - pellet (T0) and filament (T1) heads cannot print paired. Use T0/T1 to switch tools."
        {% else %}
            RESPOND TYPE=error MSG="Unsupported M605 S{mode} (valid: 0,1)"
        {% endif %}
        G1 F3000
    {% endif %}

[gcode_macro FULL_CONTROL]
description: Set the dual-carriages mode to "FULL_CONTROL"
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.dual_carriage is defined %}
        # unsync both carriages
        {% if 'x' not in printer.toolhead.homed_axes %}
            G28 X0
        {% endif %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        SET_DUAL_CARRIAGE CARRIAGE=1
        G1 X{printer.configfile.config.dual_carriage.position_max|float} F{printer_var.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=0
        G1 X{printer.configfile.config.stepper_x.position_min|float} F{printer_var.feedrate}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side MOTION_QUEUE=extruder1
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}

########################################
# IDEX Bed Mesh Calibration
########################################

[gcode_macro G29]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    BED_MESH_CLEAR
    CLEAR_PAUSE
    {% if printer.dual_carriage.carriage_1 == "PRIMARY" %}
        # T1 active
        {% if printer.extruder.temperature|float <= 150 %}
            M109 T1 S150
        {% endif %}
        BED_MESH_CALIBRATE
    {% else %}
        # T0 active
        {% if printer.extruder.temperature|float <= 150 %}
            M109 T0 S150
        {% endif %}
        BED_MESH_CALIBRATE
    {% endif %}
    BED_MESH_PROFILE SAVE=p1
    SAVE_CONFIG NO_RESTART=1
    M420 S1

########################################
# IDEX Homing Sequence
########################################

[homing_override]
gcode:
    {% if printer.dual_carriage is defined %}
        # unsync both carriages
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side MOTION_QUEUE=extruder1
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}
    BED_MESH_CLEAR
    SAVE_VARIABLE VARIABLE=babystep_z VALUE=0.0
    SAVE_CONFIG NO_RESTART=1
    {% if params.X and not params.Y and not params.Z %}
        G28 X0
    {% endif %}
    {% if not params.X and params.Y and not params.Z %}
        G28 Y0
    {% endif %}
    {% if not params.X and not params.Y and params.Z %}
        G28 Z0
        G91
        G0 Z-4
        G90
    {% endif %}
    {% if params.Y and params.X and not params.Z %}
        G28 Y0
        G28 X
    {% endif %}
    {% if not params.X and not params.Y and not params.Z %}
        G28 Z0
        G28 Y0
        G28 X0
        G91
        G0 Z-4
        G90
    {% endif %}
    {% if params.X and params.Y and params.Z %}
        G28 Z0
        G28 Y0
        G28 X0
        G91
        G0 Z-4
        G90
    {% endif %}

########################################
# PAUSE & Resume Functionality for IDEX
########################################

[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set z = params.Z|default(2.5)|float %}
    {% set r = params.R|default(2.0)|float %}
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target|default(0)|int}
        {% if printer['extruder1'] is defined %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp1 VALUE={printer['extruder1'].target|default(0)|int}
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp1 VALUE=0
        {% endif %}

        SAVE_GCODE_STATE NAME=PAUSE

        BASE_PAUSE

        {% if printer.toolhead.homed_axes == "xyz" %}
            G91
            G1 E-{r} F600
            G90

            {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
                G91
                G1 Z{z} F900
                G90
            {% else %}
                RESPOND TYPE=echo MSG="Pause zhop exceeds maximum Z height."
            {% endif %}
        {% else %}
            RESPOND TYPE=echo MSG="Pause movement skipped (axes not homed)"
            G91
            G1 E-{r} F600
            G90
        {% endif %}

        # Determine and store current IDEX state (0=T0, 1=T1)
        {% if printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "INACTIVE" %}
            SAVE_VARIABLE VARIABLE=idex_status VALUE=0
        {% elif printer.dual_carriage.carriage_0 == "INACTIVE" and printer.dual_carriage.carriage_1 == "PRIMARY" %}
            SAVE_VARIABLE VARIABLE=idex_status VALUE=1
        {% endif %}
        PURGE_POSITION
    {% endif %}

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.toolhead.homed_axes == "xyz" %}
        {% if printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "INACTIVE" %}
            G90
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F7000
            G1 X{printer_var.tool0_pause_position_x + 40} F7000
            G1 X{printer_var.tool0_pause_position_x}
            G1 X{printer_var.tool0_pause_position_x + 40}
            G1 X{printer_var.tool0_pause_position_x}
        {% elif printer.dual_carriage.carriage_0 == "INACTIVE" and printer.dual_carriage.carriage_1 == "PRIMARY" %}
            G90
            G1 X{printer_var.tool1_pause_position_x} Y{printer_var.tool1_pause_position_y} F7000
            G1 X{printer_var.tool1_pause_position_x - 40} F7000
            G1 X{printer_var.tool1_pause_position_x}
            G1 X{printer_var.tool1_pause_position_x - 40}
            G1 X{printer_var.tool1_pause_position_x}
        {% else %}
            G90
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F7000
            G1 X{printer_var.tool0_pause_position_x + 40} F7000
            G1 X{printer_var.tool0_pause_position_x}
            G1 X{printer_var.tool0_pause_position_x + 40}
            G1 X{printer_var.tool0_pause_position_x}
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="CLEAN_NOZZLE skipped (axes not homed)"
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_etemp: 0
variable_etemp1: 0
variable_activetool: 0
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set e = params.E|default(20)|float %}
    {% set r = params.R|default(1)|float %}
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        # Restore temps (non-blocking first)
        {% if etemp > 0 %} M104 T0 S{etemp|int} {% endif %}
        {% if etemp1 > 0 %} M104 T1 S{etemp1|int} {% endif %}
        {% if etemp > 0 %}
            RESPOND TYPE=echo MSG="Heating extruder 0 .."
            M109 T0 S{etemp|int}
        {% endif %}
        {% if etemp1 > 0 %}
            RESPOND TYPE=echo MSG="Heating extruder 1 .."
            M109 T1 S{etemp1|int}
        {% endif %}
        {% set status = printer.save_variables.variables.idex_status|default(0)|int %}
        # status: 0=T0, 1=T1 (no paired modes on Hybrid IDEX)
        {% if status == 1 %}
            M605 S1
            T1
            PURGE_POSITION
            {% set restore_cmd = 'RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150' %}
        {% else %}
            M605 S1
            T0
            PURGE_POSITION
            {% set restore_cmd = 'RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150' %}
        {% endif %}
        # Determine if we can safely prime
        {% set active_tool = printer.toolhead.extruder %}
        {% if active_tool == 'extruder1' and printer.configfile.settings.extruder1 is defined %}
            {% set min_temp = printer.configfile.settings.extruder1.min_extrude_temp|float %}
        {% else %}
            {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% endif %}
        {% set can_prime = (printer[active_tool].temperature|float >= min_temp) %}
        {% if can_prime %}
            G91
            G1 E{e} F400
            G1 E-{r} F600
            G90
        {% endif %}
        CLEAN_NOZZLE
        M420 S1
        {% if printer.toolhead.homed_axes == "xyz" %}
            { restore_cmd }
        {% else %}
            RESPOND TYPE=echo MSG="RESUME position restore skipped (axes not homed)"
        {% endif %}
        {% if can_prime %}
            G91
            G1 E{r} F600
            G90
        {% endif %}
        BASE_RESUME VELOCITY=150
    {% endif %}
