########################################
# PELLET_RELAY_CONTROL_DUAL.cfg
# Pellet Feeder System for Penrose IDEX (Dual Nozzle)
# Solenoid valves control pneumatic line vac for pellet transport
# Capacitive sensors detect pellet level and trigger refill
# Both LEFT (T0) and RIGHT (T1) valves with mutual exclusion
# Author: Vijay Raghav Varada
# Version: 10
########################################

#####################################################################
# LINE VAC SOLENOID VALVES (RELAY CONTROL)
# These solenoids actuate the pneumatic valves that control
# the line vac system for pellet transport to each hopper.
# 
# RELAY LOGIC (Active-LOW with inverted pin):
#   VALUE=1   = Pin LOW  = Relay ON  = Valve OPEN  = Pellets flowing
#   VALUE=0.8 = PWM 80%  = 2s ON / 0.5s OFF pulsing (hardware-level)
#   VALUE=0   = Pin HIGH = Relay OFF = Valve CLOSED = No flow
#
# PWM MODE:
#   pwm=True with cycle_time=2.5 enables MCU-level pulsing.
#   SET_PIN VALUE=0.8  → hardware alternates 2s ON / 0.5s OFF
#   SET_PIN VALUE=1   → continuous ON (manual/force operations)
#   SET_PIN VALUE=0   → OFF
#
# PIN ASSIGNMENTS (verify these match your board!):
#   Tool 0 (Primary/Left): PE9
#   Tool 1 (Secondary/Right): PD15
#####################################################################


[output_pin pellet_vac_left]
# LineVac solenoid for Tool 0 (Primary/Left extruder)
# Active-LOW relay: ! inverts signal so VALUE=1 activates relay
# PWM Mode: VALUE=0.8 with cycle_time=2.5 gives 2s ON / 0.5s OFF at MCU level
pin: !PE9
pwm: True
cycle_time: 2.5    ; 2.5s period: 80% duty = 2s ON, 0.5s OFF hardware pulsing
value: 0           ; Start with relay OFF (valve closed)
shutdown_value: 0  ; On shutdown, close valve (safety)

[output_pin pellet_vac_right]
# LineVac solenoid for Tool 1 (Secondary/Right extruder)
# Active-LOW relay: ! inverts signal so VALUE=1 activates relay
# PWM Mode: VALUE=0.8 with cycle_time=2.5 gives 2s ON / 0.5s OFF at MCU level
pin: !PD15
pwm: True
cycle_time: 2.5    ; 2.5s period: 80% duty = 2s ON, 0.5s OFF hardware pulsing
value: 0           ; Start with relay OFF (valve closed)
shutdown_value: 0  ; On shutdown, close valve (safety)

#####################################################################
# PELLET LEVEL SENSORS (CAPACITIVE)
# Detect pellet presence in hoppers and trigger auto-refill.
#
# Sensor Logic (with inverted pin ^!):
#   Pellets PRESENT = filament_detected = true  → insert_gcode
#   Pellets ABSENT  = filament_detected = false → runout_gcode
#
# PIN ASSIGNMENTS:
#   Tool 0 (Left):  PF4  (with internal pullup ^ and inverted !)
#   Tool 1 (Right): PC15 (with internal pullup ^ and inverted !)
#####################################################################

[filament_switch_sensor pellet_sensor_left]
switch_pin: ^!PF4
pause_on_runout: False
event_delay: 0.5
debounce_delay: 1.0
runout_gcode:
    # Sensor LOW: Hopper empty - turn ON vac to refill
    _PELLET_CHECK_AND_REFILL TOOL=0
insert_gcode:
    # Sensor HIGH: Hopper full - turn OFF vac
    _PELLET_STOP_REFILL TOOL=0

[filament_switch_sensor pellet_sensor_right]
switch_pin: ^!PC15
pause_on_runout: False
event_delay: 0.5
debounce_delay: 1.0
runout_gcode:
    # Sensor LOW: Hopper empty - turn ON vac to refill
    _PELLET_CHECK_AND_REFILL TOOL=1
insert_gcode:
    # Sensor HIGH: Hopper full - turn OFF vac
    _PELLET_STOP_REFILL TOOL=1

[delayed_gcode _PELLET_SENSOR_INIT]
initial_duration: 2
gcode:
    SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE=1
    RESPOND TYPE=echo MSG="Pellet Sensors: LEFT (T0) and RIGHT (T1) Initialized"

#####################################################################
# AUTO-REFILL LOGIC (Called by pellet sensors)
#
# HYBRID PWM + POLLING ARCHITECTURE:
#   1. Sensor detects LOW (empty) → runout_gcode → this macro
#   2. This macro checks conditions, then starts PWM pulsing:
#      a. SET_PIN VALUE=0.8 → MCU-level 2s ON / 0.5s OFF hardware PWM
#      b. Polling timer checks sensor every 2s
#      c. When sensor shows full → SET_PIN VALUE=0 (stop)
#      d. After 60s (30 polls) with no fill → PAUSE print
#
# WHY PWM + POLLING (instead of gcode-driven pulsing):
#   - PWM pulsing runs at the MCU level, independent of gcode queue
#   - Timing is precise even when the move planner is busy
#   - Polling only checks the sensor — timing inaccuracy harmless
#   - Simpler code: no phase tracking, no ON/OFF state machine
#
# VALUE MAPPING:
#   VALUE=0   → OFF (relay off, valve closed)
#   VALUE=0.8  → PULSED (2s on / 0.5s off, hardware PWM, auto-refill)
#   VALUE=1   → CONTINUOUS ON (manual control, force refill)
#
# Smart Refill Conditions:
#   - Only refill when PRINTING (not Idle/Paused)
#   - Only refill the ACTIVE tool (the one extruding)
#   - In COPY/MIRROR mode, both tools are considered active
#
# Safety Features:
#   - 60s timeout: if hopper doesn't fill, PAUSE print
#   - Sensor checked every 2s via polling timer
#   - Prevents extruder from running dry and damaging print
#   - User must manually refill and resume
#####################################################################

[gcode_macro _PELLET_CHECK_AND_REFILL]
description: Check conditions and turn on vac if appropriate (with safety timeout and mutual exclusion). Use FORCE=1 to bypass print state checks (still respects sensor and mutual exclusion).
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set force = params.FORCE|default(0)|int %}
    
    # Get current sensor state
    {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set right_sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set left_full = left_sensor.filament_detected|default(false) if left_sensor is defined else false %}
    {% set right_full = right_sensor.filament_detected|default(false) if right_sensor is defined else false %}
    
    # MUTUAL EXCLUSION: Check if the other vac is already running
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    {% set other_active = state.right_active|int if tool == 0 else state.left_active|int %}
    
    RESPOND TYPE=echo MSG="Pellet check: TOOL={tool}, FORCE={force}"
    
    {% if other_active %}
        # Other vac is running - defer to avoid running both simultaneously
        # Chain-refill in the poll timer will start this side when the other finishes
        RESPOND TYPE=echo MSG="Pellet refill deferred: T{tool} waiting for T{'1' if tool == 0 else '0'} to finish (chain-refill will handle)"
    {% elif force == 1 %}
        # FORCE=1: skip print state checks but still check sensor
        {% if tool == 0 %}
            {% if left_full %}
                RESPOND TYPE=echo MSG="Pellet refill skipped: T0 hopper already FULL (sensor detected)"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
                SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
                SET_PIN PIN=pellet_vac_left VALUE=0.8
                UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
                RESPOND TYPE=echo MSG="Pellet refill FORCED: T0 (Left) - PWM pulsing started (2s on/0.5s off)"
            {% endif %}
        {% elif tool == 1 %}
            {% if right_full %}
                RESPOND TYPE=echo MSG="Pellet refill skipped: T1 hopper already FULL (sensor detected)"
            {% else %}
                SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=1
                SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
                SET_PIN PIN=pellet_vac_right VALUE=0.8
                UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=2
                RESPOND TYPE=echo MSG="Pellet refill FORCED: T1 (Right) - PWM pulsing started (2s on/0.5s off)"
            {% endif %}
        {% endif %}
    {% else %}
        # Normal operation - check print state, active tool, and sensor
        {% set idle_state = printer.idle_timeout.state|default("Idle") %}
        {% set is_printing = (idle_state == "Printing") %}
        {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
        
        {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
        {% set tool0_active = (current_extruder == "extruder") %}
        {% set tool1_active = (current_extruder == "extruder1") %}
        
        # Check for COPY/MIRROR mode
        {% set dual_mode = false %}
        {% if printer.dual_carriage is defined %}
            {% set c1_state = printer.dual_carriage.carriage_1|default("INACTIVE") %}
            {% if c1_state == "COPY" or c1_state == "MIRROR" %}
                {% set dual_mode = true %}
            {% endif %}
        {% endif %}
        
        {% if is_printing and not is_paused %}
            {% if tool == 0 and (dual_mode or tool0_active) %}
                {% if left_full %}
                    RESPOND TYPE=echo MSG="Pellet refill skipped: T0 hopper already FULL (sensor detected)"
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
                    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
                    SET_PIN PIN=pellet_vac_left VALUE=0.8
                    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
                    RESPOND TYPE=echo MSG="Pellet refill started: T0 (Left) - PWM pulsing (2s on/0.5s off)"
                {% endif %}
            {% elif tool == 1 and (dual_mode or tool1_active) %}
                {% if right_full %}
                    RESPOND TYPE=echo MSG="Pellet refill skipped: T1 hopper already FULL (sensor detected)"
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=1
                    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
                    SET_PIN PIN=pellet_vac_right VALUE=0.8
                    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=2
                    RESPOND TYPE=echo MSG="Pellet refill started: T1 (Right) - PWM pulsing (2s on/0.5s off)"
                {% endif %}
            {% else %}
                RESPOND TYPE=echo MSG="Pellet refill skipped: Tool {tool} not active (extruder={current_extruder})"
            {% endif %}
        {% else %}
            RESPOND TYPE=echo MSG="Pellet refill skipped: Not printing (state={idle_state})"
        {% endif %}
    {% endif %}

[gcode_macro _PELLET_STOP_REFILL]
description: Stop refill for a tool - turns OFF vac (PWM or continuous) and cancels poll timer
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% if tool == 0 %}
        SET_PIN PIN=pellet_vac_left VALUE=0
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet refill stopped: T0 (Left) - vac OFF, poll cancelled"
    {% else %}
        SET_PIN PIN=pellet_vac_right VALUE=0
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet refill stopped: T1 (Right) - vac OFF, poll cancelled"
    {% endif %}

#####################################################################
# PWM POLLING MECHANISM
# Hardware PWM handles the 2s ON / 0.5s OFF pulsing at the MCU level.
# This polling timer simply checks the sensor periodically and
# enforces a safety timeout.
#
# Architecture:
#   - SET_PIN VALUE=0.8 starts MCU-level 2s/0.5s pulsing (cycle_time=2.5)
#   - Polling timer fires every 2s to check sensor status
#   - If sensor shows full → SET_PIN VALUE=0 (stop)
#   - If 60s elapsed with no fill → SET_PIN VALUE=0 + PAUSE
#
# Sends "Pellet Outage T0/T1" message for TouchUI dialog detection
#####################################################################

[gcode_macro _PELLET_PULSE_STATE]
description: Internal state holder for PWM-pulsed refill polling
variable_left_elapsed: 0
variable_right_elapsed: 0
variable_left_active: 0
variable_right_active: 0
gcode:
    M115

[delayed_gcode _PELLET_POLL_LEFT]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    {% set old_elapsed = state.left_elapsed|int %}
    {% set poll_interval = 2 %}
    {% set max_time = 60 %}
    {% set elapsed = old_elapsed + poll_interval %}
    
    # Check sensor
    {% set sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set full = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if full %}
        # Hopper full - stop PWM and report success
        SET_PIN PIN=pellet_vac_left VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet T0: hopper FULL after ~{elapsed}s of pulsed refill"
        # Chain-refill: if right hopper is empty and not already active, start it
        {% set right_sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
        {% set right_full = right_sensor.filament_detected|default(true) if right_sensor is defined else true %}
        {% if not right_full and state.right_active|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=1
            SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
            SET_PIN PIN=pellet_vac_right VALUE=0.8
            UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=2
            RESPOND TYPE=echo MSG="Pellet T1: chained refill started after T0 completed"
        {% endif %}
    {% elif elapsed >= max_time %}
        # Timeout - stop PWM, reset state, pause print
        SET_PIN PIN=pellet_vac_left VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet Outage T0 - {max_time}s of pulsed refill failed, print paused"
        PAUSE
    {% else %}
        # Continue polling - PWM pulsing continues at hardware level
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE={elapsed}
        RESPOND TYPE=echo MSG="Pellet T0: pulsing... ~{elapsed}s/{max_time}s"
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION={poll_interval}
    {% endif %}

[delayed_gcode _PELLET_POLL_RIGHT]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    {% set old_elapsed = state.right_elapsed|int %}
    {% set poll_interval = 2 %}
    {% set max_time = 60 %}
    {% set elapsed = old_elapsed + poll_interval %}
    
    # Check sensor
    {% set sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set full = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if full %}
        # Hopper full - stop PWM and report success
        SET_PIN PIN=pellet_vac_right VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet T1: hopper FULL after ~{elapsed}s of pulsed refill"
        # Chain-refill: if left hopper is empty and not already active, start it
        {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
        {% set left_full = left_sensor.filament_detected|default(true) if left_sensor is defined else true %}
        {% if not left_full and state.left_active|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
            SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
            SET_PIN PIN=pellet_vac_left VALUE=0.8
            UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
            RESPOND TYPE=echo MSG="Pellet T0: chained refill started after T1 completed"
        {% endif %}
    {% elif elapsed >= max_time %}
        # Timeout - stop PWM, reset state, pause print
        SET_PIN PIN=pellet_vac_right VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        RESPOND TYPE=echo MSG="Pellet Outage T1 - {max_time}s of pulsed refill failed, print paused"
        PAUSE
    {% else %}
        # Continue polling - PWM pulsing continues at hardware level
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE={elapsed}
        RESPOND TYPE=echo MSG="Pellet T1: pulsing... ~{elapsed}s/{max_time}s"
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION={poll_interval}
    {% endif %}

#####################################################################
# PRINT START PELLET CHECK
# Call this from your PRINT_START macro to ensure hoppers are filled
# before printing begins. This handles the case where hoppers are 
# already empty when print starts (sensor won't transition).
#####################################################################

[gcode_macro PELLET_PREPRINT_CHECK]
description: Check pellet levels at print start and refill if needed (mutual exclusion: left first). Call from PRINT_START.
gcode:
    {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set right_sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set left_full = left_sensor.filament_detected|default(false) if left_sensor is defined else true %}
    {% set right_full = right_sensor.filament_detected|default(false) if right_sensor is defined else true %}
    
    RESPOND TYPE=echo MSG="Pre-print pellet check..."
    
    # MUTUAL EXCLUSION: Only one vac at a time. Prioritize LEFT.
    # If both empty, LEFT fills first; _PELLET_POLL_LEFT will chain-start RIGHT when done.
    {% if not left_full %}
        RESPOND TYPE=echo MSG="T0 hopper empty at print start - starting pulsed refill"
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_left VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
        {% if not right_full %}
            RESPOND TYPE=echo MSG="T1 hopper also empty - will refill after T0 completes"
        {% endif %}
    {% elif not right_full %}
        RESPOND TYPE=echo MSG="T0 hopper OK"
        RESPOND TYPE=echo MSG="T1 hopper empty at print start - starting pulsed refill"
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_right VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=2
    {% else %}
        RESPOND TYPE=echo MSG="T0 hopper OK"
        RESPOND TYPE=echo MSG="T1 hopper OK"
    {% endif %}

#####################################################################
# VALVE CONTROL MACROS
# Direct control of the line vac solenoid valves
#####################################################################

[gcode_macro PELLET_VAC_LEFT_ON]
description: Open Left (T0) line vac valve (turns off right - mutual exclusion)
gcode:
    # MUTUAL EXCLUSION: Turn off right vac first
    SET_PIN PIN=pellet_vac_right VALUE=0
    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
    SET_PIN PIN=pellet_vac_left VALUE=1

[gcode_macro PELLET_VAC_LEFT_OFF]
description: Close Left (T0) line vac valve
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=0

[gcode_macro PELLET_VAC_RIGHT_ON]
description: Open Right (T1) line vac valve (turns off left - mutual exclusion)
gcode:
    # MUTUAL EXCLUSION: Turn off left vac first
    SET_PIN PIN=pellet_vac_left VALUE=0
    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
    SET_PIN PIN=pellet_vac_right VALUE=1

[gcode_macro PELLET_VAC_RIGHT_OFF]
description: Close Right (T1) line vac valve
gcode:
    SET_PIN PIN=pellet_vac_right VALUE=0

[gcode_macro PELLET_VAC_ALL_OFF]
description: Close both valves and cancel any pending polls - SAFE STATE
gcode:
    SET_PIN PIN=pellet_vac_left VALUE=0
    SET_PIN PIN=pellet_vac_right VALUE=0
    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
    UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
    SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
    RESPOND TYPE=echo MSG="Pellet Vac ALL: OFF (safe state)"

#####################################################################
# UI-FRIENDLY MANUAL REFILL MACROS
# These check sensor state and act accordingly - ideal for UI buttons
#####################################################################

[gcode_macro PELLET_REFILL_LEFT]
description: [UI] Check left sensor and refill if needed (PWM pulsed, 60s timeout). FORCE=1 to ignore sensor.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set pellets_ok = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if force or not pellets_ok %}
        RESPOND TYPE=echo MSG="LEFT: {'Force refill requested' if force else 'Pellets LOW - starting pulsed refill'}"
        # MUTUAL EXCLUSION: Cancel right poll and turn off right vac
        SET_PIN PIN=pellet_vac_right VALUE=0
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        # Start PWM pulsed refill for left
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_left VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
    {% else %}
        RESPOND TYPE=echo MSG="LEFT: Pellets OK - no refill needed"
    {% endif %}

[gcode_macro PELLET_REFILL_RIGHT]
description: [UI] Check right sensor and refill if needed (PWM pulsed, 60s timeout). FORCE=1 to ignore sensor.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set pellets_ok = sensor.filament_detected|default(false) if sensor is defined else false %}
    
    {% if force or not pellets_ok %}
        RESPOND TYPE=echo MSG="RIGHT: {'Force refill requested' if force else 'Pellets LOW - starting pulsed refill'}"
        # MUTUAL EXCLUSION: Cancel left poll and turn off left vac
        SET_PIN PIN=pellet_vac_left VALUE=0
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        # Start PWM pulsed refill for right
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_right VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=2
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT: Pellets OK - no refill needed"
    {% endif %}

[gcode_macro PELLET_REFILL_BOTH]
description: [UI] Check both sensors and refill LEFT first if needed (mutual exclusion - one at a time, PWM pulsed). FORCE=1 to ignore sensors.
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% set left_sensor = printer["filament_switch_sensor pellet_sensor_left"] %}
    {% set right_sensor = printer["filament_switch_sensor pellet_sensor_right"] %}
    {% set left_ok = left_sensor.filament_detected|default(false) if left_sensor is defined else false %}
    {% set right_ok = right_sensor.filament_detected|default(false) if right_sensor is defined else false %}
    
    RESPOND TYPE=echo MSG="Checking pellet levels (mutual exclusion - one at a time)..."
    
    # MUTUAL EXCLUSION: Only one vac can run at a time
    # Priority: LEFT first, then RIGHT (use PELLET_REFILL_RIGHT to prioritize right)
    {% if force or not left_ok %}
        RESPOND TYPE=echo MSG="LEFT: {'Force refill' if force else 'Pellets LOW'} - starting (right vac will wait)"
        SET_PIN PIN=pellet_vac_right VALUE=0
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_left VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=2
        {% if not right_ok %}
            RESPOND TYPE=echo MSG="RIGHT: Pellets LOW - will refill after LEFT completes"
        {% endif %}
    {% elif force or not right_ok %}
        RESPOND TYPE=echo MSG="LEFT: Pellets OK"
        RESPOND TYPE=echo MSG="RIGHT: {'Force refill' if force else 'Pellets LOW'} - starting"
        SET_PIN PIN=pellet_vac_left VALUE=0
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_LEFT DURATION=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=left_elapsed VALUE=0
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_PELLET_PULSE_STATE VARIABLE=right_elapsed VALUE=0
        SET_PIN PIN=pellet_vac_right VALUE=0.8
        UPDATE_DELAYED_GCODE ID=_PELLET_POLL_RIGHT DURATION=2
    {% else %}
        RESPOND TYPE=echo MSG="LEFT: Pellets OK"
        RESPOND TYPE=echo MSG="RIGHT: Pellets OK"
    {% endif %}

[gcode_macro PELLET_STOP_REFILL]
description: [UI] Stop all pellet refill - closes both valves and cancels PWM pulsing
gcode:
    _PELLET_STOP_REFILL TOOL=0
    _PELLET_STOP_REFILL TOOL=1
    RESPOND TYPE=echo MSG="Pellet refill STOPPED - both valves closed, PWM pulsing cancelled"

#####################################################################
# PELLET SENSOR CONTROL MACROS
#####################################################################

[gcode_macro SET_PELLET_SENSOR]
description: Enable or disable pellet level sensors. S=1 enable, S=0 disable, TOOL=0/1 for specific tool (omit for both)
gcode:
    {% set enable = params.S|default(1)|int %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% if tool == 0 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor LEFT (Tool 0): {'ENABLED' if enable else 'DISABLED'}"
    {% elif tool == 1 %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensor RIGHT (Tool 1): {'ENABLED' if enable else 'DISABLED'}"
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_left ENABLE={enable}
        SET_FILAMENT_SENSOR SENSOR=pellet_sensor_right ENABLE={enable}
        RESPOND TYPE=echo MSG="Pellet Sensors (Both): {'ENABLED' if enable else 'DISABLED'}"
    {% endif %}

#####################################################################
# HOPPER AGITATION
# Brief vac pulse to disturb pellets and prevent auger starvation.
# MIX_HOPPER is called from slicer gcode (e.g. layer change).
# It schedules the actual pin work via delayed_gcode so the gcode
# stream returns immediately — no move planner flush, no stall.
#####################################################################

[gcode_macro _MIX_HOPPER_STATE]
description: Internal state for MIX_HOPPER
variable_active_side: -1
gcode:
    M115

[gcode_macro MIX_HOPPER]
description: Schedule a single hopper agitation pulse. Call from slicer gcode — returns instantly, pin work runs async via delayed_gcode.
gcode:
    # Just schedule the pulse and return — no blocking
    UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_PULSE DURATION=0.1

[delayed_gcode _MIX_HOPPER_PULSE]
initial_duration: 0
gcode:
    {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    {% if current_extruder == "extruder" %}
        {% if state.left_active|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=0
            SET_PIN PIN=pellet_vac_left VALUE=0.8
            UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_STOP DURATION=1
        {% endif %}
    {% else %}
        {% if state.right_active|int == 0 %}
            SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=1
            SET_PIN PIN=pellet_vac_right VALUE=0.8
            UPDATE_DELAYED_GCODE ID=_MIX_HOPPER_STOP DURATION=1
        {% endif %}
    {% endif %}

[delayed_gcode _MIX_HOPPER_STOP]
initial_duration: 0
gcode:
    {% set side = printer["gcode_macro _MIX_HOPPER_STATE"].active_side|int %}
    {% set state = printer["gcode_macro _PELLET_PULSE_STATE"] %}
    # Don't kill PWM if a refill took over while we were waiting
    {% if side == 0 and state.left_active|int == 0 %}
        SET_PIN PIN=pellet_vac_left VALUE=0
    {% elif side == 1 and state.right_active|int == 0 %}
        SET_PIN PIN=pellet_vac_right VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_MIX_HOPPER_STATE VARIABLE=active_side VALUE=-1

#####################################################################
# SYSTEM STATUS QUERY
#####################################################################

[gcode_macro QUERY_PELLET_SYSTEM]
description: Query current state of entire pellet feeder system
gcode:
    RESPOND TYPE=echo MSG="========================================="
    RESPOND TYPE=echo MSG="       PELLET FEEDER SYSTEM STATUS       "
    RESPOND TYPE=echo MSG="========================================="
    
    # Show printer state for auto-refill logic
    {% set idle_state = printer.idle_timeout.state|default("Unknown") %}
    {% set is_paused = printer['pause_resume'].is_paused|default(0)|int == 1 %}
    {% set current_extruder = printer.toolhead.extruder|default("extruder") %}
    {% set active_tool = "T0 (Left)" if current_extruder == "extruder" else "T1 (Right)" %}
    
    {% set dual_mode = "SINGLE" %}
    {% if printer.dual_carriage is defined %}
        {% set c1_state = printer.dual_carriage.carriage_1|default("INACTIVE") %}
        {% if c1_state == "COPY" %}
            {% set dual_mode = "COPY (both active)" %}
        {% elif c1_state == "MIRROR" %}
            {% set dual_mode = "MIRROR (both active)" %}
        {% endif %}
    {% endif %}
    
    RESPOND TYPE=echo MSG="Printer State: {idle_state} {'(PAUSED)' if is_paused else ''}"
    RESPOND TYPE=echo MSG="Active Tool:   {active_tool}"
    RESPOND TYPE=echo MSG="IDEX Mode:     {dual_mode}"
    
    {% set auto_enabled = (idle_state == "Printing" and not is_paused) %}
    RESPOND TYPE=echo MSG="Auto-Refill:   {'ENABLED' if auto_enabled else 'DISABLED (only during print)'}"
    RESPOND TYPE=echo MSG="-----------------------------------------"
    
    ; Check if output pins are defined and get their values
    {% if printer["output_pin pellet_vac_left"] is defined %}
        {% set vac_left = printer["output_pin pellet_vac_left"].value|default(0)|float %}
        {% if vac_left >= 1.0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  ON  (continuous, valve open)"
        {% elif vac_left > 0 %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  PULSING (PWM 2s on/0.5s off, auto-refill active)"
        {% else %}
            RESPOND TYPE=echo MSG="LEFT Vac (T0):  OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Vac (T0):  NOT CONFIGURED!"
    {% endif %}
    {% if printer["output_pin pellet_vac_right"] is defined %}
        {% set vac_right = printer["output_pin pellet_vac_right"].value|default(0)|float %}
        {% if vac_right >= 1.0 %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): ON  (continuous, valve open)"
        {% elif vac_right > 0 %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): PULSING (PWM 2s on/0.5s off, auto-refill active)"
        {% else %}
            RESPOND TYPE=echo MSG="RIGHT Vac (T1): OFF (valve closed)"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT Vac (T1): NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="-----------------------------------------"
    ; Query sensor states
    {% if printer["filament_switch_sensor pellet_sensor_left"] is defined %}
        {% set left_enabled = printer["filament_switch_sensor pellet_sensor_left"].enabled %}
        {% set left_detected = printer["filament_switch_sensor pellet_sensor_left"].filament_detected %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  {'Enabled' if left_enabled else 'Disabled'} | Pellets: {'OK' if left_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="LEFT Sensor:  NOT CONFIGURED!"
    {% endif %}
    {% if printer["filament_switch_sensor pellet_sensor_right"] is defined %}
        {% set right_enabled = printer["filament_switch_sensor pellet_sensor_right"].enabled %}
        {% set right_detected = printer["filament_switch_sensor pellet_sensor_right"].filament_detected %}
        RESPOND TYPE=echo MSG="RIGHT Sensor: {'Enabled' if right_enabled else 'Disabled'} | Pellets: {'OK' if right_detected else 'LOW!'}"
    {% else %}
        RESPOND TYPE=echo MSG="RIGHT Sensor: NOT CONFIGURED!"
    {% endif %}
    RESPOND TYPE=echo MSG="========================================="