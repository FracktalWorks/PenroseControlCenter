########################################
# MODE_FILAMENT.cfg
# Penrose 600 Hybrid IDEX - FILAMENT extruder mode
#
# The machine prints with the RIGHT carriage (TD-01 CAN toolhead) and
# Klipper sees a SINGLE extruder. The left (pellet) carriage is held
# parked at its endstop by a [manual_stepper] - it is physically on the
# same X rail and must stay powered, or it can drift into the printing
# head.
#
# ONE HEATER IS ACTIVE IN THIS MODE:
#   [extruder]  TD-01 hotend  E1:gpio20 / E1:gpio26  (OctoPrint tool0)
# There is NO H0 barrel heater here (that is pellet-only hardware), so
# M104/M109 H0 error and the UI hides the H0 rows.
#
# NOTE ON NAMING: the drive motor is [extruder] (index 0), not
# [extruder1]. In this mode it is the only extruder Klipper has. The
# side feed motor binds to it by that name.
#
# BED LEVELLING IS NOT POSSIBLE IN THIS MODE - only the pellet nozzle
# can trigger the bed probe. Level in pellet mode; the mesh is carried
# across the swap in the shared part of the SAVE_CONFIG block.
#
# [mcu E1] in printer.cfg MUST be uncommented for this mode (the config
# manager does it). In pellet mode it must be commented out, because
# Klipper errors on an MCU that no config section references.
#
# Author: Vijay Raghav Varada
# Version: 2
########################################

########################################
# Mode Variables
########################################

[gcode_macro EXTRUDER_MODE_VARIABLES]
variable_mode: 'filament'
# Part cooling fan for this mode (one fan on the CAN toolhead)
variable_fan_0: 'extruder1_CF'
variable_fan_1: ''
# 0 = no H0 barrel heater in this mode
variable_has_barrel: 0
# Standard corner limits - no melt-pressure constraint on a filament hotend
variable_square_corner_velocity: 5
gcode:
    # No-op: this macro exists only to carry the variables above

########################################
# X Stepper - Motor M2 (Filament carriage, RIGHT)
# This is the printing carriage in filament mode. It uses the pins and
# endstop that [dual_carriage] used on the old IDEX config.
########################################

[stepper_x]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 8
rotation_distance: 20
full_steps_per_rotation: 200
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
endstop_pin: ^PF3
# Carried over UNCHANGED from the IDEX [dual_carriage] section - same
# physical envelope and park position as the proven configuration.
#   640 = park / home (clear of the 0..600 bed on the right)
#     0 = near edge of the bed
position_endstop: 640
position_min: 0
position_max: 640
homing_speed: 60
homing_retract_dist: 10.0

# ---------------------------------------------------------------------
# CARRIAGE SEPARATION - see the matching note in MODE_PELLET.cfg.
#     this carriage travels down to ... 0 (position_min above)
#     pellet carriage is HELD at ..... -85 (its own endstop)
#     gap ............................ 85mm
# Comfortably beyond the old 60mm safe_distance, so this direction needs
# no adjustment. Do not lower position_min below -25.
# ---------------------------------------------------------------------

########################################
# Parked carriage - Motor M1 (Pellet carriage, LEFT)
# Held energised at its endstop (X=-85) so it cannot drift into the
# filament head. See MODE_PELLET.cfg for the full rationale.
########################################

[manual_stepper parked_carriage]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 8
rotation_distance: 20
velocity: 40
accel: 200

[delayed_gcode HOLD_PARKED_CARRIAGE]
initial_duration: 2
gcode:
    MANUAL_STEPPER STEPPER=parked_carriage ENABLE=1
    MANUAL_STEPPER STEPPER=parked_carriage SET_POSITION=0
    RESPOND TYPE=echo MSG="Pellet carriage parked and holding"

########################################
# Extruder - TD-01 CAN Toolhead Drive Motor
# rotation_distance matches the FracktalWorks Dragon TD-01
########################################

[extruder]
step_pin: E1: gpio24
dir_pin: !E1: gpio21
enable_pin: !E1: gpio28
microsteps: 8
rotation_distance: 4.7158
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: E1: gpio20
# Stock EPCOS - UNCHANGED, and deliberately so. The filament hotend uses
# the same sensor as every other Fracktal Works filament printer. Only the
# PELLET heaters use the custom new_thermistor_t1 table.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: E1: gpio26
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -130
max_temp: 310
min_extrude_temp: -130
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 4.0

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 40
heating_gain: 6

[tmc2209 extruder]
uart_pin: E1: gpio25
run_current: 0.850
stealthchop_threshold: 0

########################################
# extruder_side1 - Side Feed Motor (mainboard M7, TMC5160)
# Bound to [extruder] at config-parse time so the side feeder is in
# lock-step with the CAN drive motor from the moment Klipper starts.
# (In this mode the drive motor IS [extruder] - there is no extruder1.)
########################################

[extruder_stepper extruder_side1]
extruder: extruder
step_pin: PD4               # M8P V2.0 Motor7 STEP
dir_pin: PD3                # M8P V2.0 Motor7 DIR
enable_pin: !PD6            # M8P V2.0 Motor7 EN
microsteps: 16
rotation_distance: 7.710

[tmc5160 extruder_stepper extruder_side1]
cs_pin: PD5                 # M8P V2.0 Motor7 CS (SPI)
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
interpolate: False
run_current: 1.00
hold_current: 0.40
sense_resistor: 0.075

[delayed_gcode SYNC_SIDE_EXTRUDER]
initial_duration: 2
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side1 MOTION_QUEUE=extruder
    SET_FILAMENT_SENSOR SENSOR=switch_sensor_E1 ENABLE=1

########################################
# Part Cooling Fan + Always-On Hotend Fan (both on the CAN toolhead)
########################################

[fan_generic extruder1_CF]
pin: E1: gpio10

[heater_fan extruder1_AOF]
pin: E1: gpio8
heater: extruder
heater_temp: 50.0

########################################
# Filament Runout Sensor - M6-STOP (PC15)
#
# Only meaningful in this mode, so it lives here. Unlike the IDEX
# config there is no tool guard needed in runout_gcode: if this mode is
# active then the filament head IS the printing head.
#
# pause_on_runout stays False and PAUSE is issued explicitly, matching
# the pattern used by every pellet sensor in PELLET_RELAY_CONTROL_*.cfg.
# [pause_resume] is declared in BASE_PENROSE_HYBRID.cfg, which matters
# because the sensor module only auto-loads it when pause_on_runout is True.
########################################

[filament_switch_sensor switch_sensor_E1]
switch_pin: ^PC15
pause_on_runout: False
runout_gcode:
    {% if printer.toolhead.homed_axes == 'xyz' %}
        RESPOND TYPE=echo MSG="Filament Runout T1"
        PAUSE
    {% endif %}
insert_gcode:
    RESPOND TYPE=echo MSG="Filament Inserted T1"

########################################
# 5/2 Valve Solenoids - HELD LOW
#
# The pellet feeder config is NOT included in this mode, but the valve
# hardware is still wired. Both solenoid pins must still be declared and
# driven LOW: a floating PE9/PD15 energises a solenoid and shifts the
# 5/2 valve to the wrong position. Do not delete these because "there is
# no pellet system in filament mode" - that is exactly when they float.
########################################

[output_pin pellet_vac_left]
pin: !PE9
value: 0
shutdown_value: 0

[output_pin pellet_vac_right]
pin: !PD15
value: 0
shutdown_value: 0

########################################
# T1 Filament Load / Unload
# Kept on the M701/M702 names the UI wizard already sends. In this mode
# the CAN motor and the side feeder are already synced, so a single
# extrude drives both.
########################################

[gcode_macro M701]
description: Load filament into the nozzle using the side feeder
gcode:
    {% set LOAD_TEMP = params.S|default(200)|int %}
    {% set LOAD_LENGTH = params.L|default(100)|int %}
    {% set LOAD_SPEED = params.F|default(1200)|int %}

    RESPOND TYPE=echo MSG="M701: Loading filament - heating to {LOAD_TEMP}C"
    M109 S{LOAD_TEMP}
    RESPOND TYPE=echo MSG="M701: Pushing {LOAD_LENGTH}mm of filament"
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side1 MOTION_QUEUE=extruder
    G91
    G1 E{LOAD_LENGTH} F{LOAD_SPEED}
    G90
    RESPOND TYPE=echo MSG="M701: Load complete"

[gcode_macro M702]
description: Unload filament from the nozzle
gcode:
    {% set UNLOAD_TEMP = params.S|default(200)|int %}
    {% set UNLOAD_LENGTH = params.L|default(100)|int %}
    {% set UNLOAD_SPEED = params.F|default(1200)|int %}

    RESPOND TYPE=echo MSG="M702: Unloading filament - heating to {UNLOAD_TEMP}C"
    M109 S{UNLOAD_TEMP}
    RESPOND TYPE=echo MSG="M702: Retracting {UNLOAD_LENGTH}mm of filament"
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side1 MOTION_QUEUE=extruder
    G91
    G1 E-{UNLOAD_LENGTH} F{UNLOAD_SPEED}
    G90
    M104 S0
    RESPOND TYPE=echo MSG="M702: Unload complete - heater off"

[gcode_macro LOAD_FILAMENT]
description: Alias for M701
gcode:
    M701 {rawparams}

[gcode_macro UNLOAD_FILAMENT]
description: Alias for M702
gcode:
    M702 {rawparams}
