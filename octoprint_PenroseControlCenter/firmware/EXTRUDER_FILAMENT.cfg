########################################
# EXTRUDER_FILAMENT.cfg
# Filament Extruder Head configuration for Penrose Hybrid 600.
#
# Toolhead: TD-01 CAN toolhead board (RP2040 + TMC2209, canbus alias toolhead0)
# Side motor: extruder_side - redundant drive motor on main board (DM542T, M6 slot)
#
# Architecture:
#   The primary filament drive lives on the CAN toolhead.
#   The existing M6 stepper slot (previously the pellet auger motor) is
#   reconfigured as extruder_side - a secondary/redundant feed motor that
#   stays in lock-step with the toolhead extruder.
#
# To switch from pellet head to filament head:
#   1. Use the Printer Setup screen in the UI to select "Filament Extruder".
#      The UI will toggle [include EXTRUDER_*.cfg] in printer.cfg and
#      auto-uncomment [mcu toolhead0] inside printer.cfg's MCU Config block.
#   2. Fill in the actual CAN UUID into [mcu toolhead0] in printer.cfg
#      (run: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0)
#      This only needs to be done ONCE - the value is preserved across
#      future printer/extruder head switches.
#   3. Calibrate rotation_distance for your specific filament drive gear
#
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# CAN Toolhead MCU
# NOTE: [mcu toolhead0] is defined in printer.cfg (MCU Config
# section) so the UUID is preserved across printer / head swaps.
# The Printer Setup UI auto-uncomments it when this head is active.
########################################

########################################
# ADXL345 IMU (on CAN toolhead - for input shaping)
########################################

[adxl345 toolhead0]
cs_pin: toolhead0: gpio13
spi_software_sclk_pin: toolhead0: gpio14
spi_software_mosi_pin: toolhead0: gpio15
spi_software_miso_pin: toolhead0: gpio12
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345 toolhead0
probe_points: 300, 300, 20

########################################
# Extruder 0 - CAN Toolhead Drive Motor (TD-01)
########################################

[extruder]
step_pin: toolhead0: gpio24
dir_pin: !toolhead0: gpio21
enable_pin: !toolhead0: gpio28
microsteps: 8
rotation_distance: 4.7158  # TODO: calibrate for your specific filament drive gear
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead0: gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: toolhead0: gpio26
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -130
max_temp: 310
min_extrude_temp: -130
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 4.0
pressure_advance: 0.05
pressure_advance_smooth_time: 0.04

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 40
heating_gain: 6

[tmc2209 extruder]
uart_pin: toolhead0: gpio25
run_current: 0.850

########################################
# extruder_side - Redundant Side Extruder Motor
# Reuses the M6 stepper slot (same pins as the pellet auger motor).
# Assigned to [extruder] so Klipper keeps it in lock-step with the
# primary CAN toolhead drive.
# rotation_distance MUST be calibrated to produce the same mm/step
# as the CAN extruder.
########################################

[extruder_stepper extruder_side]
extruder: extruder
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 2
rotation_distance: 22.6    # TODO: calibrate to match CAN toolhead effective feed rate
step_pulse_duration: 0.000005  # 3us safe margin for DM542T (2.5us minimum pulse)

########################################
# NOTE: X axis endstop stays on the mainboard (^PF0) as defined
# in BASE_PENROSE_SINGLE.cfg. No override needed here.
########################################

########################################
# Part Cooling Fan (on CAN toolhead)
########################################

[fan_generic extruder_CF]
pin: toolhead0: gpio10

########################################
# Always-On Hotend Cooling Fan (on CAN toolhead)
########################################

[heater_fan extruder_AOF]
pin: toolhead0: gpio8
heater: extruder
heater_temp: 50.0

########################################
# Toolhead LED
########################################

[led toolhead0]
green_pin: toolhead0: gpio2

########################################
# Temperature Macros (Filament Head - no H0 barrel heater)
########################################

[gcode_macro M104]
rename_existing: M104.1
description: Override "M104" for filament extruder.
gcode:
    {% set temp = params.S|default(0)|float %}
    M104.1 S{temp}

[gcode_macro M109]
rename_existing: M109.1
description: Override "M109" for filament extruder.
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% if params.R is defined %}
        M109.1 S{params.R}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp}
    {% endif %}

########################################
# Startup: remap fan variable for filament head
# The filament head has one CAN toolhead fan (extruder_CF).
# Overrides the pellet defaults (extruder_CF_0 / extruder_CF_1)
# set in PRINTER_PENROSE_600_SINGLE.cfg.
########################################

[delayed_gcode FILAMENT_HEAD_INIT]
initial_duration: 0.5
gcode:
    SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=fan0_0 VALUE="'extruder_CF'"
    SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=fan0_1 VALUE="''"
    RESPOND TYPE=echo MSG="Filament Head (TD-01 CAN): active - fan remapped to extruder_CF"
