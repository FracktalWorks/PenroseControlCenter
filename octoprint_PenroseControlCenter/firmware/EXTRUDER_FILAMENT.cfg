########################################
# EXTRUDER_FILAMENT.cfg
# Filament Extruder Head configuration for Penrose Hybrid 600.
#
# Toolhead: TD-01 CAN toolhead board (RP2040 + TMC2209, canbus alias toolhead0)
# Side motor: extruder_side - redundant drive motor on main board (TMC5160, M7 slot)
# Sensors:
#   - Filament runout switch on M6-STOP (PC15)
#   - Filament flow / motion sensor on M2-STOP (PF3)
#
# Architecture:
#   The primary filament drive lives on the CAN toolhead.
#   A secondary/redundant feed motor is wired to the M7 stepper slot
#   on the BTT Manta M8P V2.0 mainboard. It is assigned to [extruder]
#   via [extruder_stepper] so both stay in lock-step.
#   (The pellet head uses M6 for its auger; M7 is dedicated to the
#   filament head so both heads can stay wired in parallel.)
#
# To switch from pellet head to filament head:
#   1. Use the Printer Setup screen in the UI to select "Filament Extruder".
#      The UI will toggle [include EXTRUDER_*.cfg] in printer.cfg and
#      auto-uncomment [mcu toolhead0] inside printer.cfg's MCU Config block.
#   2. Fill in the actual CAN UUID into [mcu toolhead0] in printer.cfg
#      (run: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0)
#      This only needs to be done ONCE - the value is preserved across
#      future printer/extruder head switches.
#   3. rotation_distance values match FracktalWorks/ControlCenter Dragon
#      printer (4.7158 for [extruder], 7.710 for [extruder_stepper extruder_side]);
#      fine-tune only if drive gears differ.
#
# Author: Vijay Raghav Varada
# Version: 3
########################################

########################################
# CAN Toolhead MCU
# NOTE: [mcu toolhead0] is defined in printer.cfg (MCU Config
# section) so the UUID is preserved across printer / head swaps.
# The Printer Setup UI auto-uncomments it when this head is active.
########################################

########################################
# ADXL345 IMU (on CAN toolhead - for input shaping)
########################################

[adxl345 toolhead0]
cs_pin: toolhead0: gpio13
spi_software_sclk_pin: toolhead0: gpio14
spi_software_mosi_pin: toolhead0: gpio15
spi_software_miso_pin: toolhead0: gpio12
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345 toolhead0
probe_points: 300, 300, 20

########################################
# Extruder 0 - CAN Toolhead Drive Motor (TD-01)
########################################

[extruder]
step_pin: toolhead0: gpio24
dir_pin: !toolhead0: gpio21
enable_pin: !toolhead0: gpio28
microsteps: 8
rotation_distance: 4.7158  # Matches Dragon TD-01 toolhead (FracktalWorks/ControlCenter)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: toolhead0: gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: toolhead0: gpio26
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -130
max_temp: 310
min_extrude_temp: -130
max_extrude_only_distance: 5000.0
max_extrude_cross_section: 4.0
pressure_advance: 0.05
pressure_advance_smooth_time: 0.04

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 40
heating_gain: 6

[tmc2209 extruder]
uart_pin: toolhead0: gpio25
run_current: 0.850

########################################
# extruder_side - Redundant Side Extruder Motor
# Wired to the M7 stepper slot on the BTT Manta M8P V2.0 mainboard
# (separate from M6, which the pellet head uses for the auger).
# Assigned to [extruder] so Klipper keeps it in lock-step with the
# primary CAN toolhead drive.
# rotation_distance and TMC settings match Dragon extruder_side0
# (FracktalWorks/ControlCenter).
########################################

[extruder_stepper extruder_side]
extruder: extruder
step_pin: PD4               # M8P V2.0 Motor7 STEP
dir_pin: PD3                # M8P V2.0 Motor7 DIR
enable_pin: !PD6            # M8P V2.0 Motor7 EN
microsteps: 16
rotation_distance: 7.710   # Matches Dragon extruder_side0 (FracktalWorks/ControlCenter)

[tmc5160 extruder_stepper extruder_side]
cs_pin: PD5                 # M8P V2.0 Motor7 CS (SPI)
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
interpolate: False
run_current: 1.00
hold_current: 0.40
sense_resistor: 0.075

########################################
# Filament Runout Sensor (M6-STOP / PC15 on BTT Manta M8P V2.0)
# Mechanical/optical switch on the filament path - triggers when
# filament is no longer detected.
########################################

[filament_switch_sensor extruder_runout]
switch_pin: ^PC15
pause_on_runout: True
runout_gcode:
    M117 Filament runout detected
    PAUSE
insert_gcode:
    M117 Filament inserted

########################################
# Filament Flow / Motion Sensor (M2-STOP / PF3 on BTT Manta M8P V2.0)
# Pulse-counting motion sensor (e.g. BTT Smart Filament Sensor) that
# verifies filament is actually moving while the extruder is commanded
# to extrude. Triggers a pause if filament stops moving (clog/jam).
# Adjust 'detection_length' to match your sensor's pulse spacing.
########################################

[filament_motion_sensor extruder_flow]
switch_pin: ^PF3
detection_length: 7.0        # mm of expected extrusion per pulse - TUNE for your sensor
extruder: extruder
pause_on_runout: True
runout_gcode:
    M117 Filament flow stalled
    PAUSE
insert_gcode:
    M117 Filament flow resumed

########################################
# NOTE: X axis endstop stays on the mainboard (^PF0) as defined
# in BASE_PENROSE_SINGLE.cfg. No override needed here.
########################################

########################################
# Part Cooling Fan (on CAN toolhead)
########################################

[fan_generic extruder_CF]
pin: toolhead0: gpio10

########################################
# Always-On Hotend Cooling Fan (on CAN toolhead)
########################################

[heater_fan extruder_AOF]
pin: toolhead0: gpio8
heater: extruder
heater_temp: 50.0

########################################
# Toolhead LED
# Single-channel green PWM LED on the CAN toolhead. Turned on
# at startup by the FILAMENT_HEAD_INIT delayed_gcode below via
# SET_LED LED=toolhead0 GREEN=1.0 (mirrors Dragon BASE_DRAGON.cfg
# STARTUP behaviour).
########################################

[led toolhead0]
green_pin: toolhead0: gpio2

########################################
# Temperature Macros (Filament Head - no H0 barrel heater)
########################################

[gcode_macro M104]
rename_existing: M104.1
description: Override "M104" for filament extruder.
gcode:
    {% set temp = params.S|default(0)|float %}
    M104.1 S{temp}

[gcode_macro M109]
rename_existing: M109.1
description: Override "M109" for filament extruder.
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% if params.R is defined %}
        M109.1 S{params.R}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp}
    {% endif %}

########################################
# Startup: remap fan variable for filament head, turn on the
# toolhead LED (Dragon-style), and confirm extruder_side is
# synced to [extruder] so it always rotates with the primary
# CAN drive motor. The 'extruder: extruder' line in the
# [extruder_stepper extruder_side] section above sets this at
# config-parse time; SYNC_EXTRUDER_MOTION here is a belt-and-
# braces guarantee in case a prior session left it detached.
#
# The filament head has one CAN toolhead fan (extruder_CF).
# Overrides the pellet defaults (extruder_CF_0 / extruder_CF_1)
# set in PRINTER_PENROSE_600_SINGLE.cfg.
########################################

[delayed_gcode FILAMENT_HEAD_INIT]
initial_duration: 1.0
gcode:
    SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=fan0_0 VALUE="'extruder_CF'"
    SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=fan0_1 VALUE="''"
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side MOTION_QUEUE=extruder
    SET_LED LED=toolhead0 GREEN=1.0
    RESPOND TYPE=echo MSG="Filament Head (TD-01 CAN): active - fan=extruder_CF, side motor synced, LED on"
