########################################
# PRINTER_PENROSE_600_HYBRID.cfg
# Printer specific configurations for Penrose 600 Hybrid
# Cartesian 3D Printer 600x600x625mm
#
# Two carriages share one X rail - a pellet auger (left) and a TD-01
# CAN filament toolhead (right) - but only ONE is configured as the
# printing head at a time. Klipper sees a SINGLE-EXTRUDER printer.
#
# The printing head is chosen by the MODE_PELLET.cfg / MODE_FILAMENT.cfg
# include in printer.cfg, which also carries:
#   - [stepper_x]              (the printing carriage's motor + endstop)
#   - [manual_stepper parked_carriage]  (holds the other carriage)
#   - [extruder] and its heater(s)
#   - the mode's part cooling fans
# Nothing mode-specific belongs in THIS file.
#
# Author: Vijay Raghav Varada
# Version: 2
########################################


########################################
# Core Configs, Common to all printers
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Shared hardware + macros for this machine
# (Y/Z motion, bed, probe, mode-adaptive macros)
[include BASE_PENROSE_HYBRID.cfg]
########################################

# NOTE: the pellet feeder (PELLET_RELAY_CONTROL_HYBRID.cfg) is included
# by MODE_PELLET.cfg, not here - in filament mode there is no pellet
# system, and its macros must not exist. MODE_FILAMENT.cfg still
# declares both 5/2 valve solenoid pins and holds them LOW.

########################################
# Printer Kinematics
# Plain cartesian - no dual_carriage. The non-printing carriage is a
# manual_stepper held at its endstop by the active mode file.
########################################

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 20
max_z_accel: 100
# Pellet extrusion optimizations. The active mode re-applies its own
# square_corner_velocity at startup via _EXTRUDER_MODE_LIMITS
# (pellet 4 / filament 5), so this is just the safe default.
square_corner_velocity: 4
minimum_cruise_ratio: 0.5      # Prevents short accel-decel pressure spikes

########################################
# Machine Variables
########################################

[gcode_macro PRINTER_VARIABLES]
# Autopark parameters (retained for macro compatibility; there is no
# tool changing on a single-extruder configuration)
variable_z_hop: 0.6
variable_movespeed: 300  # mm/s
variable_feedrate: 18000  # mm/min

# HeatBed size (600x600x625)
variable_bed_x_min: 0
variable_bed_x_max: 600
variable_bed_y_min: 0
variable_bed_y_max: 600
variable_bed_z_min: 0
variable_bed_z_max: 625

# Extruders temp offset (TEMPERATURE_WAIT tolerance)
variable_offset_temp: 4

# Purge / pause park positions, per carriage. PURGE_POSITION and
# CLEAN_NOZZLE pick the one matching the active mode.
variable_tool0_pause_position_x: -20
variable_tool0_pause_position_y: 10
variable_tool1_pause_position_x: 620
variable_tool1_pause_position_y: 10

# Printer Configuration
# SINGLE EXTRUDER in both modes - Klipper only ever has one [extruder].
# This drives OctoPrint's extruder count and hides every tool1 row in
# the touchscreen UI.
variable_is_dual_nozzle: 0
# Hybrid: the machine can be reconfigured between a pellet head and a
# filament head. Drives the Extruder Type selector on the
# Material/Nozzle screen and the mode-aware UI skinning.
variable_is_hybrid: 1
# Filament path from the side feeder to the hotend. The load/unload
# wizard traverses it in 150mm steps (floor(length / 150) of them), so
# any remainder is picked up by the purge loop on load and by the extra
# lead-in retract on unload. Filament mode only.
variable_ptfe_tube_length: 2500

# Heater Configuration
# has_heater_ring: ALF ring heater (Volterra ALF specific) - 0=no, 1=yes
variable_has_heater_ring: 0
# has_heated_chamber: Heated enclosure/chamber - 0=no, 1=yes
variable_has_heated_chamber: 0
# has_spool_heater: Filament spool heater/dryer - 0=no, 1=yes
variable_has_spool_heater: 0

# Bed Calibration Positions (3-point for 600mm bed)
variable_bed_calibration_x1: 50
variable_bed_calibration_y1: 50
variable_bed_calibration_x2: 550
variable_bed_calibration_y2: 50
variable_bed_calibration_x3: 300
variable_bed_calibration_y3: 550
variable_bed_calibration_x4: 300
variable_bed_calibration_y4: 300
gcode:
    G90

########################################
# Y Axis
########################################

[stepper_y]
position_endstop: 600
position_max: 605
position_min: -10

########################################
# Z Axis
########################################

[stepper_z]
position_endstop: 618
position_max: 625
position_min: -5

########################################
# Bed Mesh
# Probed in PELLET mode only (the pellet nozzle is the only head that
# triggers the bed probe). The resulting profile 'p1' is carried across
# a mode swap in the shared part of the SAVE_CONFIG block and loaded by
# M420 S1 in either mode.
########################################

[bed_mesh]
mesh_min: 70, 70
mesh_max: 530, 530
probe_count: 5, 5
horizontal_move_z: 5
speed: 200
algorithm: bicubic

########################################
# Bed Screws for Manual Leveling (600mm bed)
########################################

[bed_screws]
screw1: 50, 50
screw1_name: Front Left
screw2: 550, 50
screw2_name: Front Right
screw3: 550, 300
screw3_name: Rear
horizontal_move_z: 5
speed: 50
probe_speed: 5

########################################
# Input Shaping
# No accelerometer is fitted on this machine, so SHAPER_CALIBRATE
# cannot be run. Values below can still be set by hand from a
# ringing tower test if input shaping is wanted.
########################################

[input_shaper]
# Tune these by hand - no ADXL345 fitted
#shaper_freq_x: 50
#shaper_freq_y: 50
#shaper_type: mzv
