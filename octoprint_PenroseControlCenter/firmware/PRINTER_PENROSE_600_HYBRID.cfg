########################################
# PRINTER_PENROSE_600_HYBRID.cfg
# Printer specific configurations for Penrose 600 Hybrid IDEX
# Cartesian IDEX 3D Printer 600x600x625mm
# T0 (Left): Pellet auger extruder (M6 + H0 barrel heater)
# T1 (Right): Filament extruder - TD-01 CAN toolhead + M7 side motor
# Only one nozzle prints at a time; IDEX is used for on-the-fly
# switching between pellet and filament printing (no COPY/MIRROR).
# Author: Vijay Raghav Varada
# Version: 1
########################################


########################################
# Core Configs, Common to all printers
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Select Printer Family Series
# Penrose Hybrid uses cartesian IDEX kinematics
[include BASE_PENROSE_HYBRID.cfg]
########################################

########################################
# Include Add-Ons
# ----------------------------------------
# Pellet Feeder System (Line Vac Solenoid Valve)
# LEFT (T0) side only - the right side is a filament extruder
# ----------------------------------------
[include PELLET_RELAY_CONTROL_HYBRID.cfg]
########################################

########################################
# Printer Kinematics
# Cartesian with dual_carriage for IDEX
########################################

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 20
max_z_accel: 100
# Pellet extrusion optimizations
square_corner_velocity: 4      # Reduced from 5 - smoother pressure at corners
minimum_cruise_ratio: 0.5      # Prevents short accel-decel pressure spikes

########################################
# IDEX Config
########################################

[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage (T1 offset relative to T0)
variable_offset_x: 0
variable_offset_y: 0
variable_offset_z: 0

# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 300  # mm/s
variable_feedrate: 18000  # mm/min

# HeatBed size (600x600x625)
variable_bed_x_min: 0
variable_bed_x_max: 600
variable_bed_y_min: 0
variable_bed_y_max: 600
variable_bed_z_min: 0
variable_bed_z_max: 625

# Print cooling fans names
# T0 (pellet) has two mainboard fans; T1 (filament) has one fan on
# the CAN toolhead. Empty entries are skipped by the M106 override.
variable_fan0_0: 'extruder_CF_0'
variable_fan0_1: 'extruder_CF_1'
variable_fan1_0: 'extruder1_CF'
variable_fan1_1: ''

# Extruders temp offset (TEMPERATURE_WAIT tolerance)
variable_offset_temp: 4

# Tool 0 (Primary Carriage) Pause/Purge Position
variable_tool0_pause_position_x: -20
variable_tool0_pause_position_y: 10

# Tool 1 (Dual Carriage) Pause/Purge Position
variable_tool1_pause_position_x: 620
variable_tool1_pause_position_y: 10

# Printer Configuration
variable_is_dual_nozzle: 1
# Hybrid IDEX: T0 = pellet auger, T1 = filament extruder
variable_is_hybrid: 1
# Filament path from the side feeder to the T1 hotend. The load/unload
# wizard traverses it in 150mm steps (floor(length / 150) of them), so
# any remainder is picked up by the purge loop on load and by the extra
# lead-in retract on unload.
variable_ptfe_tube_length: 2500

# Heater Configuration
# has_heater_ring: ALF ring heater (Volterra ALF specific) - 0=no, 1=yes
variable_has_heater_ring: 0
# has_heated_chamber: Heated enclosure/chamber - 0=no, 1=yes
variable_has_heated_chamber: 0
# has_spool_heater: Filament spool heater/dryer - 0=no, 1=yes
variable_has_spool_heater: 0

# Bed Calibration Positions (3-point for 600mm bed)
variable_bed_calibration_x1: 50
variable_bed_calibration_y1: 50
variable_bed_calibration_x2: 550
variable_bed_calibration_y2: 50
variable_bed_calibration_x3: 300
variable_bed_calibration_y3: 550
variable_bed_calibration_x4: 300
variable_bed_calibration_y4: 300
gcode:
    G90

########################################
# X Axis (Primary Carriage T0)
########################################

[stepper_x]
position_endstop: -85
position_min: -85
position_max: 600

########################################
# IDEX Axis (Dual Carriage T1)
########################################

[dual_carriage]
position_endstop: 640
position_min: 0
position_max: 640

########################################
# Y Axis
########################################

[stepper_y]
position_endstop: 600
position_max: 605
position_min: -10

########################################
# Z Axis
########################################

[stepper_z]
position_endstop: 618
position_max: 625
position_min: -5

########################################
# Bed Mesh
########################################

[bed_mesh]
mesh_min: 70, 70
mesh_max: 530, 530
probe_count: 5, 5
horizontal_move_z: 5
speed: 200
algorithm: bicubic

########################################
# Bed Screws for Manual Leveling (600mm bed)
########################################

[bed_screws]
screw1: 50, 50
screw1_name: Front Left
screw2: 550, 50
screw2_name: Front Right
screw3: 550, 300
screw3_name: Rear
horizontal_move_z: 5
speed: 50
probe_speed: 5

########################################
# Input Shaping
# No accelerometer is fitted on this machine, so SHAPER_CALIBRATE
# cannot be run. Values below can still be set by hand from a
# ringing tower test if input shaping is wanted.
########################################

[input_shaper]
# Tune these by hand - no ADXL345 fitted
#shaper_freq_x: 50
#shaper_freq_y: 50
#shaper_type: mzv
