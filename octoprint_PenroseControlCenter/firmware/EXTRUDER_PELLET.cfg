########################################
# EXTRUDER_PELLET.cfg
# Pellet Extruder Head configuration for Penrose printers.
#
# Contains everything specific to the pellet auger toolhead:
#   - [extruder] auger motor + nozzle heater (PA1)
#   - [heater_generic H0] secondary pellet barrel heater (PA0)
#   - Pellet-specific M104 / M109 overrides (handle H0)
#
# Swap with EXTRUDER_FILAMENT.cfg in printer.cfg when the
# filament toolhead is installed in place of the pellet head.
# Author: Vijay Raghav Varada
# Version: 1
########################################

########################################
# Extruder 0 - Motor M6 (Pellet Auger)
########################################

[extruder]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 2
rotation_distance: 35.0  # Calibrated: 28.0 / 0.8 (was 80% flow in slicer)
step_pulse_duration: 0.000005  # 3us - safe margin over DM542T 2.5us minimum
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA1
max_power: 0.5  # Limit AC heater to 50% power
sensor_pin: PC5
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_extrude_temp: -100
max_extrude_only_distance: 5000
max_extrude_cross_section: 8.0
min_temp: -200
max_temp: 300
# Pellet auger motion limits
max_extrude_only_velocity: 25
max_extrude_only_accel: 400
instantaneous_corner_velocity: 1.0
pressure_advance: 0
pressure_advance_smooth_time: 0.06

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 40
heating_gain: 3

########################################
# H0 - Secondary Heater for T0 (Pellet Barrel)
########################################

[heater_generic H0]
gcode_id: H0
heater_pin: PA0
max_power: 0.5  # Limit AC heater to 50% power
sensor_pin: PB0
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 17.062
pid_Ki: 0.455
pid_Kd: 159.960
min_temp: -200
max_temp: 480

[verify_heater H0]
max_error: 240
check_gain_time: 60
hysteresis: 40
heating_gain: 3

########################################
# Part Cooling Fans - on main board (pellet head)
# These are specific to the pellet toolhead wiring.
# For filament mode, fan is on the CAN toolhead (see EXTRUDER_FILAMENT.cfg).
########################################

[fan_generic extruder_CF_0]
pin: PF7

[fan_generic extruder_CF_1]
pin: PF9

########################################
# Pellet Feeder System (solenoid valves + sensors)
# Specific to the pellet head - not needed in filament mode.
########################################

[include PELLET_RELAY_CONTROL_SINGLE.cfg]

########################################
# Startup: confirm fan variables match pellet head defaults
# (extruder_CF_0 / extruder_CF_1 are already the defaults in
# PRINTER_PENROSE_600_SINGLE.cfg so this is a no-op unless the
# user previously had the filament head active.)
########################################

[delayed_gcode PELLET_HEAD_INIT]
initial_duration: 0.5
gcode:
    SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=fan0_0 VALUE="'extruder_CF_0'"
    SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=fan0_1 VALUE="'extruder_CF_1'"
    RESPOND TYPE=echo MSG="Pellet Head: active - fans extruder_CF_0 / extruder_CF_1"

########################################
# Temperature Macros (Pellet Head - handles H0 barrel heater)
########################################

[gcode_macro M104]
rename_existing: M104.1
description: Override "M104" for pellet extruder (handles H0 barrel heater via H param).
gcode:
    {% set temp = params.S|default(0)|float %}
    {% set sec = params.H|default(-1)|int %}

    # Handle secondary heater (H0)
    {% if sec == 0 %}
        SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
    {% else %}
        M104.1 S{temp}
    {% endif %}

[gcode_macro M109]
rename_existing: M109.1
description: Override "M109" for pellet extruder (handles H0 barrel heater via H param).
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% set sec = params.H|default(-1)|int %}

    # Handle secondary heater (H0)
    {% if sec == 0 %}
        SET_HEATER_TEMPERATURE HEATER=H0 TARGET={temp}
        TEMPERATURE_WAIT SENSOR="heater_generic H0" MINIMUM={temp - 2}
    {% elif params.R is defined %}
        M109.1 S{params.R}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp}
    {% endif %}
